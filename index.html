p3"},{"s":"F","e":"Are you going to accept?","z":"你要接受嗎？","a":"audio/da133109208.mp3"},{"s":"BEN","e":"I haven't decided. If I resign, my notice period is one month. Right in the middle of the bid.","z":"還沒決定。如果我辭職，預告期是一個月，剛好在競標正中間。","a":"audio/d087c1c1226.mp3"},{"s":"BEN","e":"Oren doesn't know. Neither does Sharon. There's no succession plan for my role.","z":"Oren 不知道，Sharon 也不知道。我的職位沒有接班計畫。","a":"audio/d3d67eb0661.mp3"},{"s":"F","e":"Why tell me?","z":"為什麼告訴我？","a":"audio/d1c12ee135d.mp3"},{"s":"BEN","e":"Because you'd find out anyway. You always do.","z":"因為你反正會知道。你總是會知道。","a":"audio/d29eac0b4f3.mp3"},{"s":"BEN","e":"And no salary negotiation today. That's Grace's job.","z":"今天不談薪水，那是 Grace 的工作。","a":"audio/de3b17b4fa4.mp3"}],"h":"📍 週一早上 10:30｜Ben 的辦公室｜在場：Ben｜試用期結束的績效考核｜目標：接受回饋、談自己的發展，並面對 Ben 的秘密","c":"你走出辦公室，Oren 正好站在門外，手裡拿著咖啡。從他的表情看，他全都聽到了。"},{"n":38,"t":"兩個主管的衝突","it":[{"s":"OREN","e":"Vexa, Ben? Leo? After what he did to this team?","z":"Vexa，Ben？Leo？在他對這個團隊做了那些事之後？","a":"audio/d9f35436e15.mp3"},{"s":"BEN","e":"It's a job offer, Oren. I didn't sign anything.","z":"那只是工作邀約，Oren，我什麼都沒簽。","a":"audio/d7914755af6.mp3"},{"s":"OREN","e":"You were going to leave in the middle of the bid without telling anyone. Where's the leadership in that?","z":"你打算在競標中途離開，誰都不說。這叫什麼領導？","a":"audio/d4533256184.mp3"},{"s":"BEN","e":"Don't lecture me about leadership. You make promises and I clean up the mess. Remember the Halden letter?","z":"別跟我講領導。你負責承諾，我負責收拾爛攤子。記得 Halden 那封信嗎？","a":"audio/daf700e81b3.mp3"},{"q":"兩人吵起來了。你要怎麼介入幫忙化解衝突？","o":[{"e":"I see both points of view. Can we focus on what we agree on? We all want to win Halden and keep this team together.","ok":true,"fb":"不選邊、找共同目標，有助化解衝突。","r":{"s":"OREN","e":"…That's true.","z":"……那倒是真的。","a":"audio/d384af4a491.mp3"},"a":"audio/d31b1da4599.mp3"},{"e":"Oren is right. Ben, you're selfish.","ok":false,"fb":"選邊站，衝突更嚴重。","r":{"s":"BEN","e":"Great. Two against one.","z":"好極了，二對一。","a":"audio/db923ce8269.mp3"},"a":"audio/d3eb8264228.mp3"},{"e":"I'm going back to work.","ok":false,"fb":"他們叫你來，你卻走了。","r":{"s":"OREN","e":"Stay, please.","z":"請留下。","a":"audio/dd391d6032c.mp3"},"a":"audio/d4f56f7c526.mp3"}]},{"s":"BEN","e":"Look. Vexa offered more money, but that's not why I considered it. Here I feel like I can't make decisions. HQ decides everything.","z":"聽著，Vexa 給更多錢，但那不是我考慮的原因。在這裡我覺得自己沒有決策權，什麼都是總部決定。","a":"audio/d6fb3a0c51c.mp3"},{"s":"OREN","e":"Then let's change that. Sharon trusts us more than you think. Ask her to delegate authority on pricing to you.","z":"那就改變它。Sharon 比你想的更信任我們，請她把定價權下放給你。","a":"audio/d2d48fc92d8.mp3"},{"s":"BEN","e":"And you?","z":"那你呢？","a":"audio/dbc0b7ff320.mp3"},{"s":"OREN","e":"I'll stop making promises without you. Deal?","z":"我不會再沒經過你就做承諾。成交？","a":"audio/d9fb748fb1f.mp3"},{"s":"BEN","e":"Deal. And I'll tell Leo no.","z":"成交。我會拒絕 Leo。","a":"audio/dce60284f82.mp3"},{"s":"F","e":"So we're all on the same wavelength now?","z":"所以我們現在想法一致了？","a":"audio/d5360296539.mp3"},{"s":"OREN","e":"{Don't push your luck|別得寸進尺}.","z":"別得寸進尺。","a":"audio/d24634bb313.mp3"},{"s":"BEN","e":"Fancia, thank you. That took empathy. And guts.","z":"Fancia，謝謝你。那需要同理心，也需要膽量。","a":"audio/dfc2b8a062f.mp3"}],"h":"📍 週一中午 12:15｜頂樓陽台｜在場：Ben、Oren（你被叫去當見證）｜Oren 質問 Ben｜目標：在衝突中保持中立，幫兩人找到共識","c":"回到辦公室，Priya 急急忙忙跑來：「我們出事了。Vexa 剛發表的新接頭，跟獵鷹專案的設計幾乎一模一樣。」"},{"n":39,"t":"設計被抄了？","it":[{"s":"PRIYA","e":"Here's the situation. Vexa launched a connector that looks almost identical to our Falcon prototype.","z":"狀況是這樣：Vexa 推出一款接頭，跟我們的獵鷹原型幾乎一樣。","a":"audio/d6bade04c20.mp3"},{"s":"TOM","e":"Same shape, same pin layout. That design is our intellectual property.","z":"一樣的形狀、一樣的針腳配置，那是我們的智慧財產。","a":"audio/d8c67e27ffb.mp3"},{"s":"MR. HSU","e":"Do you have a patent on it?","z":"你們有專利嗎？","a":"audio/d78e3ab9800.mp3"},{"s":"PRIYA","e":"A patent application, filed in March. Our trademark \"Falcon\" is registered too.","z":"有專利申請，三月提出的。「Falcon」這個商標也註冊了。","a":"audio/d038890a5b1.mp3"},{"s":"MR. HSU","e":"Good. My legal advice: first, send a formal letter. A lawsuit is expensive and slow. Most cases settle.","z":"很好。我的法律建議：先寄正式函件。打官司又貴又慢，大部分案子都和解收場。","a":"audio/d2dec8228ee.mp3"},{"s":"BEN","e":"Could this be a leak?","z":"會不會是內部洩漏？","a":"audio/d7cb36304ee.mp3"},{"q":"大家開始懷疑新來的 Sam。你怎麼回應最恰當？","o":[{"e":"Before we blame anyone, let's verify who had access to the design files. Sam joined after the prototype was finished.","ok":true,"fb":"用事實查證，避免冤枉同事。","r":{"s":"PRIYA","e":"Good point. I'll ask IT for the access logs.","z":"好觀點，我請 IT 調出存取紀錄。","a":"audio/d4812310095.mp3"},"a":"audio/d4624767576.mp3"},{"e":"It must be Sam. He's from Vexa's world.","ok":false,"fb":"沒證據就指控，很危險。","r":{"s":"MR. HSU","e":"Careful. That could be defamation.","z":"小心，那可能構成誹謗。","a":"audio/d4b4311b702.mp3"},"a":"audio/d5004cf0083.mp3"},{"e":"Who cares? Let's copy their design too.","ok":false,"fb":"侵權報復，違法。","r":{"s":"PRIYA","e":"Absolutely not.","z":"絕對不行。","a":"audio/ddcfd72395e.mp3"},"a":"audio/d3769f1eb3c.mp3"}]},{"s":"MR. HSU","e":"Also check your contract with Halden. If they shared your design with others, it's a breach of contract.","z":"也查一下跟 Halden 的合約。如果他們把你們的設計給別人，就是違約。","a":"audio/d2844ef9fa8.mp3"},{"s":"PRIYA","e":"The contract says disputes go to arbitration in Singapore. That's the jurisdiction.","z":"合約寫爭議在新加坡仲裁，那是管轄地。","a":"audio/d0fca55b62a.mp3"},{"s":"TOM","e":"How long do we have to act?","z":"我們有多少時間採取行動？","a":"audio/dd86fefbdb1.mp3"},{"s":"MR. HSU","e":"The statute of limitations is two years, but act fast. Every week they sell, the damage grows.","z":"訴訟時效是兩年，但要快。他們每多賣一週，損害就越大。","a":"audio/d6f969454c3.mp3"},{"s":"BEN","e":"Priya, ask the legal department at HQ to review it. Fancia, don't mention this to Halden yet.","z":"Priya，請總部法務部審查。Fancia，先別跟 Halden 提。","a":"audio/d3cc9907011.mp3"}],"h":"📍 週二早上 9:00｜法務部會議室｜在場：Priya、Ben、Tom、外部律師 Mr. Hsu（視訊）｜討論 Vexa 疑似抄襲｜目標：了解智慧財產的基本概念與選項","c":"當晚 IT 回報了存取紀錄：在 Vexa 發表前一週，有人從外部登入下載了設計檔。帳號是——Oren。"},{"n":40,"t":"Oren 的帳號","it":[{"s":"KEVIN","e":"The login came from an IP address in Singapore, the same night as the trade show.","z":"那次登入來自新加坡的 IP，就是展覽那晚。","a":"audio/dc9c53dc702.mp3"},{"s":"OREN","e":"I was in Singapore, but I didn't log in. I was at the bar with Kai and Fancia.","z":"我是在新加坡，但我沒登入。我跟 Kai 和 Fancia 在酒吧。","a":"audio/dd0b36c5ed7.mp3"},{"s":"F","e":"That's true. I was there.","z":"是真的，我在場。","a":"audio/d91b4a48336.mp3"},{"s":"KEVIN","e":"Did you use the hotel Wi-Fi? Did you click any links in an email that week?","z":"你有用飯店 Wi-Fi 嗎？那週有點過任何信裡的連結嗎？","a":"audio/d33fcb7944b.mp3"},{"s":"OREN","e":"Maybe. There was an email from \"IT support\" asking me to reset my password.","z":"可能有。有封自稱「IT 支援」的信叫我重設密碼。","a":"audio/d4de223c25f.mp3"},{"s":"KEVIN","e":"That wasn't us. That's phishing. A classic cybersecurity attack.","z":"那不是我們寄的，是網路釣魚，典型的資安攻擊。","a":"audio/d3fd9e38244.mp3"},{"s":"PRIYA","e":"So someone stole his password and downloaded the files from our cloud drive.","z":"所以有人偷了他的密碼，從我們的雲端硬碟下載了檔案。","a":"audio/de2bf02e86d.mp3"},{"q":"你想確保這種事不會再發生，提出什麼最有建設性？","o":[{"e":"Could we add two-factor login and run a short training for everyone? It's an easy win and protects our data.","ok":true,"fb":"提出具體、低成本的防護措施。","r":{"s":"KEVIN","e":"Already on my list. I'll get the ball rolling today.","z":"已經在我的清單上，今天就開始。","a":"audio/d734222e0fa.mp3"},"a":"audio/dff0359b415.mp3"},{"e":"Oren should be fired.","ok":false,"fb":"他是受害者，不公平。","r":{"s":"PRIYA","e":"He's the victim here, Fancia.","z":"Fancia，他才是受害者。","a":"audio/dca93414b8a.mp3"},"a":"audio/de7f43228a8.mp3"},{"e":"Let's stop using computers.","ok":false,"fb":"不切實際。","r":{"s":"KEVIN","e":"(笑) I wish.","z":"（笑）我也希望。","a":"audio/d778da6dc50.mp3"},"a":"audio/d0569ff9a71.mp3"}]},{"s":"PRIYA","e":"This also affects data privacy. If any client data was taken, we must comply with data protection regulation and inform them within seventy-two hours.","z":"這也涉及資料隱私。如果有客戶資料被拿走，我們必須遵守個資保護法規，七十二小時內通知對方。","a":"audio/dd33d990400.mp3"},{"s":"KEVIN","e":"Only design files were downloaded. No client data.","z":"只有設計檔被下載，沒有客戶資料。","a":"audio/d082ba0793f.mp3"},{"s":"PRIYA","e":"Good. Compliance will still want a report. And this helps our case. If Vexa used stolen files, it's not just a dispute. It's a crime.","z":"很好，但法遵部門還是要報告。而且這對我們的案子有利：如果 Vexa 用了偷來的檔案，那就不只是爭議，而是犯罪。","a":"audio/da34e7476c2.mp3"},{"s":"OREN","e":"Then I want Leo to answer for it.","z":"那我要 Leo 為此負責。","a":"audio/d3fb3fce6dd.mp3"},{"s":"PRIYA","e":"Let the lawyers handle it, Oren.","z":"交給律師處理，Oren。","a":"audio/d271a558501.mp3"}],"h":"📍 週三早上 8:00｜IT 室｜在場：IT 的 Kevin、Oren、Priya｜調查 Oren 帳號的異常登入｜目標：釐清資安問題，不冤枉人","c":"下午，Diana 突然打來：「Vexa 剛跟我們報了一個超低價，用的就是跟你們一樣的設計。Fancia，你有什麼要告訴我的嗎？」"},{"n":41,"t":"要不要告訴 Diana？","it":[{"s":"DIANA","e":"You're on speaker? Fine. Who's with you?","z":"你開擴音？好，誰在旁邊？","a":"audio/daeb94a1d19.mp3"},{"s":"F","e":"Ben and Priya from our legal department. Diana, I'd like to be honest with you, within what our counsel allows.","z":"Ben 和法務部的 Priya。Diana，在法務允許的範圍內，我想對你誠實。","a":"audio/d401a05259f.mp3"},{"s":"PRIYA","e":"We believe Vexa's design uses our intellectual property. We can't share details yet, but we've filed a formal complaint.","z":"我們認為 Vexa 的設計用了我們的智慧財產。細節暫時不能說，但我們已經提出正式申訴。","a":"audio/dc8d8095ec7.mp3"},{"s":"DIANA","e":"If that's true, buying from them could make Halden liable too.","z":"如果是真的，跟他們買貨的話 Halden 也可能要負責。","a":"audio/d81ca22082f.mp3"},{"s":"PRIYA","e":"That's possible. Our contract also asks both parties to indemnify each other for IP claims.","z":"有可能。我們的合約也要求雙方在智財爭議上互相賠償保障。","a":"audio/d423fa57da5.mp3"},{"q":"Diana 需要做決定。你該怎麼幫她，又不施壓？","o":[{"e":"I understand this is a tough decision. We'd appreciate it if you could postpone any decision on Vexa until the facts are clear. I'll keep you posted.","ok":true,"fb":"同理她的處境，請求合理的暫緩，並承諾更新。","r":{"s":"DIANA","e":"Fair enough. I'll put the Vexa quote on hold for two weeks.","z":"好吧，我把 Vexa 的報價暫緩兩週。","a":"audio/d1b3b5dd21e.mp3"},"a":"audio/d9c2c6458ab.mp3"},{"e":"You must not buy from Vexa!","ok":false,"fb":"命令客戶，反感。","r":{"s":"DIANA","e":"I don't take orders from suppliers.","z":"我不聽供應商命令。","a":"audio/dcd3663f3d9.mp3"},"a":"audio/d3cae136ebc.mp3"},{"e":"Buy from whoever you want.","ok":false,"fb":"太消極，放棄機會。","r":{"s":"BEN","e":"(搖頭)","z":"（搖頭）","a":null},"a":"audio/d0217005aad.mp3"}]},{"s":"DIANA","e":"Two weeks. And Fancia, I appreciate your transparency. My boss, Mr. Chen, is the key decision maker. He only cares about price.","z":"兩週。Fancia，謝謝你的坦白。我老闆陳總是最終決策者，他只在乎價格。","a":"audio/d7723d3cef4.mp3"},{"s":"BEN","e":"Then we'll need a sharper pricing strategy.","z":"那我們需要更犀利的定價策略。","a":"audio/dd837f36039.mp3"},{"s":"DIANA","e":"And Ben… I like Northwind. Don't make me regret it.","z":"還有 Ben……我喜歡 Northwind，別讓我後悔。","a":"audio/d6f4223db38.mp3"},{"d":"掛斷後"},{"s":"BEN","e":"Two weeks to beat a price based on stolen designs. Great.","z":"兩週內打敗一個用偷來的設計報的價，太好了。","a":"audio/d527599c578.mp3"},{"s":"PRIYA","e":"Two weeks to settle or win an injunction. Even better.","z":"兩週內和解或拿到禁制令，更好。","a":"audio/d547648cd2a.mp3"},{"s":"F","e":"Two weeks to think outside the box.","z":"兩週內跳脫框架思考。","a":"audio/d6d00b9251e.mp3"},{"s":"BEN","e":"Sam, please circulate the summary to the team, and Priya, could you send me a draft reply for Halden's legal?","z":"Sam，請把摘要傳給團隊。Priya，可以幫 Halden 法務擬一封回覆草稿嗎？","a":"audio/db0c8bba41c.mp3"}],"h":"📍 週三下午 4:00｜電話會議（擴音）｜在場：Ben、Priya、Diana｜Diana 追問 Vexa 低價｜目標：在法律限制內誠實回應，保住信任","c":"晚上，Kai 傳來訊息：「我聽說你們跟 Vexa 的事了。我有個瘋狂的點子：如果 Volta 的電源模組跟你們的接頭綁在一起賣呢？Vexa 做不到。」"},{"n":42,"t":"腦力激盪","it":[{"s":"OREN","e":"Okay, let's brainstorm. No bad ideas. Kai, you have the floor.","z":"好，來腦力激盪，沒有爛點子。Kai，你先說。","a":"audio/d825f41e430.mp3"},{"s":"KAI","e":"Bundle our smart power modules with your connectors. A package deal. One supplier, one warranty, less paperwork for Halden.","z":"把我們的智慧電源模組和你們的接頭綁在一起賣。套裝方案：一家供應商、一份保固、Halden 的文書作業也少一點。","a":"audio/dd35d4f920f.mp3"},{"s":"MIA","e":"That's a strong value proposition. And a competitive advantage Vexa can't copy quickly.","z":"這是很強的價值主張，也是 Vexa 短期抄不來的競爭優勢。","a":"audio/d29f1be2cc4.mp3"},{"s":"BEN","e":"What about the price? Mr. Chen only cares about price.","z":"價格呢？陳總只在乎價格。","a":"audio/d253a9b17cc.mp3"},{"s":"TOM","e":"Bundling saves Halden about eight percent on their total cost. It's not the lowest unit price, but the lowest total cost.","z":"綁售能幫 Halden 總成本省約 8%。不是最低單價，而是最低總成本。","a":"audio/d33c441a373.mp3"},{"s":"MIA","e":"Let's do a quick SWOT analysis. Strengths: trust and quality. Weaknesses: price. Opportunities: the bundle. Threats: Vexa's low price.","z":"快速做一下 SWOT 分析：優勢是信任和品質；劣勢是價格；機會是綁售；威脅是 Vexa 的低價。","a":"audio/d6135ae2809.mp3"},{"s":"OREN","e":"Sorry, we're getting sidetracked. Back to the key point: can we build it in time?","z":"抱歉，我們有點離題了。回到重點：時間上做得出來嗎？","a":"audio/d608fb44151.mp3"},{"q":"會議快超時了。你想幫大家收斂，怎麼說？","o":[{"e":"Let me summarize: we agree on the bundle, Tom checks feasibility, Mia drafts the pitch. Does anyone have an objection?","ok":true,"fb":"總結共識並確認反對意見，會議效率高。","r":{"s":"BEN","e":"No objection. Good. We have consensus.","z":"沒有反對，很好，我們達成共識了。","a":"audio/dcd75d6bf4e.mp3"},"a":"audio/d03e1de64a2.mp3"},{"e":"Let's keep talking until tonight.","ok":false,"fb":"會議沒完沒了。","r":{"s":"TOM","e":"I have a life, Fancia.","z":"我也有生活的，Fancia。","a":"audio/d82fa0dddcc.mp3"},"a":"audio/dc2c36ca6b4.mp3"},{"e":"Let's vote on Kai's hair.","ok":false,"fb":"開玩笑太離題。","r":{"s":"KAI","e":"Hey!","z":"喂！","a":"audio/de44cb7c0ae.mp3"},"a":"audio/de62c371ce3.mp3"}]},{"s":"OREN","e":"Time's up. We're running over. Any AOB?","z":"時間到了，已經超時。還有其他事項嗎？","a":"audio/d08a3afe95b.mp3"},{"s":"KAI","e":"One thing. For this to work, Volta needs a long-term partnership, not just one deal.","z":"一件事：要成功的話，Volta 需要長期合作，不只是一筆交易。","a":"audio/dbbf8da4245.mp3"},{"s":"BEN","e":"Let's discuss that offline. Thanks, everyone.","z":"那個會後再談，謝謝大家。","a":"audio/dfcf0f9ce2e.mp3"},{"d":"會後"},{"s":"TOM","e":"Fancia, the bundle needs a new bill of materials and a firmware update. That's two weeks of work.","z":"Fancia，綁售需要新的物料清單和韌體更新，那是兩週的工作量。","a":"audio/d70c9d6a55d.mp3"},{"s":"F","e":"We have two weeks.","z":"我們剛好有兩週。","a":"audio/dbc30a2d8b7.mp3"}],"h":"📍 週四早上 9:00｜會議室 A｜在場：Ben、Oren、Mia、Tom、Kai（視訊）｜集思廣益想出打敗 Vexa 的方案｜目標：在會議中提出意見、達成共識","c":"Kai 私訊你：「還有一件事我沒在會上說。Vexa 上週出價要收購 Volta。如果我們合作，我就得拒絕他們——那是一大筆錢。」"},{"n":43,"t":"兩週衝刺","it":[{"s":"F","e":"Okay team, this is a two-week sprint. Agile style. Let's look at the backlog and prioritize.","z":"好，團隊，這是兩週衝刺，用敏捷的方式。先看待辦清單、排優先順序。","a":"audio/def6907380c.mp3"},{"s":"TOM","e":"Top priority: the firmware update for the bundle. That's the critical piece.","z":"第一優先：綁售的韌體更新，那是最關鍵的部分。","a":"audio/d6761324238.mp3"},{"s":"VIC","e":"Then the new bill of materials. I need it to order parts with the right lead time.","z":"然後是新的物料清單，我需要它才能抓對交期訂零件。","a":"audio/dfb23bb9f65.mp3"},{"s":"F","e":"Let's allocate resources. Tom, you're on firmware. Vicky, materials. Sam, I'll assign you the shipping plan.","z":"來分配資源。Tom 負責韌體，Vicky 負責物料，Sam，我把出貨計畫分配給你。","a":"audio/d8206e02c7a.mp3"},{"s":"SAM","e":"No problem at all.","z":"完全沒問題。","a":"audio/d493ce176fb.mp3"},{"s":"ELA","e":"I'll help Sam this week. It's my last week before maternity leave.","z":"這週我幫 Sam，這是我產假前最後一週。","a":"audio/d7875e6678c.mp3"},{"q":"Tom 說韌體可能來不及。你要怎麼準備？","o":[{"e":"Let's have a contingency plan. If firmware isn't ready, we demo with the current version and deliver the update in phase two.","ok":true,"fb":"預先準備備案，降低風險。","r":{"s":"TOM","e":"That takes the pressure off. Thanks.","z":"這樣壓力小多了，謝謝。","a":"audio/d1cd5ac6dca.mp3"},"a":"audio/dd4d9afb15e.mp3"},{"e":"It has to be ready. No excuses.","ok":false,"fb":"施壓不能解決問題。","r":{"s":"TOM","e":"Pressure doesn't write code.","z":"壓力寫不出程式碼。","a":"audio/de8cc4bc77b.mp3"},"a":"audio/d7429bb8b7d.mp3"},{"e":"Let's ask Halden for a deadline extension.","ok":false,"fb":"時程是 Halden 定的，延期很難。","r":{"s":"VIC","e":"Diana will say no.","z":"Diana 會拒絕。","a":"audio/d4a958eb486.mp3"},"a":"audio/d8413a944f8.mp3"}]},{"s":"F","e":"Good. Daily standup at nine, ten minutes. We track progress on the board. Any blocker, raise it immediately.","z":"好。每天九點站立會議，十分鐘。進度在看板上追蹤，有阻礙立刻提出。","a":"audio/d4330ce1398.mp3"},{"s":"SAM","e":"Should I loop in the freight forwarder now?","z":"我要現在就讓貨代知道嗎？","a":"audio/d9073d6a52a.mp3"},{"s":"F","e":"Yes, and copy Elaine. FYI, Halden prefers door-to-door delivery.","z":"要，並副本給 Elaine。順帶一提，Halden 偏好門到門運送。","a":"audio/dc8509052b1.mp3"},{"s":"ELA","e":"And check the Incoterms in their PO. They used FOB last time, but for the bundle they may want CIF.","z":"也要確認他們訂單裡的國貿條規。上次用 FOB，但綁售他們可能想要 CIF。","a":"audio/d147382cded.mp3"},{"s":"SAM","e":"Got it. FOB means they handle the freight after the port, CIF means we pay cost, insurance and freight.","z":"了解。FOB 是過了港口運費由他們處理，CIF 是我們付貨價、保險和運費。","a":"audio/d15ac14f3cb.mp3"},{"s":"ELA","e":"Look at him. {He's a fast learner|他學得真快}.","z":"你看他，學得真快。","a":"audio/daccfa2857d.mp3"}],"h":"📍 週五早上 9:00｜專案作戰室｜在場：Tom、Vicky、Sam、Elaine｜規劃兩週衝刺｜目標：排定優先順序、分配資源、準備應變計畫","c":"三天後，Sam 的電腦螢幕沒關。你經過時看到一封未寄出的信，收件人是 Leo，內容只有一句：「我需要跟你談談 Northwind 的事。」"},{"n":44,"t":"Sam 的信","it":[{"s":"F","e":"Sam, do you have a minute? I saw something on your screen on Friday. I'd rather ask you directly.","z":"Sam，有空嗎？週五我在你螢幕上看到一些東西，我寧可直接問你。","a":"audio/dcc4fbcd7eb.mp3"},{"s":"SAM","e":"The email to Leo? I didn't send it.","z":"給 Leo 的信？我沒寄出去。","a":"audio/dd7d10eb0af.mp3"},{"s":"F","e":"Can you tell me why you wrote it?","z":"可以告訴我你為什麼寫嗎？","a":"audio/d4aabd858dd.mp3"},{"s":"SAM","e":"Leo called me last week. He offered me money for our shipping schedule and the Halden quotation. I said no. But I was scared. I wanted to tell him to stop calling.","z":"Leo 上週打給我，說要花錢買我們的出貨排程和 Halden 報價。我拒絕了，但我很害怕，想叫他別再打來。","a":"audio/d69e307cecf.mp3"},{"q":"Sam 說出真相。你應該怎麼做？","o":[{"e":"Thank you for telling me. You did the right thing. Let's tell Grace and Priya together, so you're protected.","ok":true,"fb":"肯定他的誠實，並走正式管道保護他。","r":{"s":"SAM","e":"Thank you. I was afraid nobody would believe me.","z":"謝謝你，我很怕沒人相信我。","a":"audio/d2b8b6d217a.mp3"},"a":"audio/df39fec4b7a.mp3"},{"e":"I don't believe you.","ok":false,"fb":"沒有證據就否定，傷人且不公平。","r":{"s":"SAM","e":"Then check my phone. Please.","z":"那你檢查我手機吧，拜託。","a":"audio/d9bbd8a2519.mp3"},"a":"audio/d6954d3c9e1.mp3"},{"e":"Let's keep it secret.","ok":false,"fb":"隱瞞會讓兩人都有風險。","r":{"s":"GRACE","e":"(推門) Keep what secret?","z":"（推門）什麼要保密？","a":"audio/d356c91237c.mp3"},"a":"audio/d157146a334.mp3"}]},{"s":"GRACE","e":"This is serious. Sam, you have an obligation under your NDA, and you kept it. That matters.","z":"這很嚴重。Sam，你有保密協議的義務，你也做到了，這很重要。","a":"audio/d304512e4c8.mp3"},{"s":"PRIYA","e":"(趕到) Do you have the call records? This could be evidence in our dispute with Vexa.","z":"（趕到）你有通話紀錄嗎？這可能成為我們跟 Vexa 爭議的證據。","a":"audio/d2aef5394ba.mp3"},{"s":"SAM","e":"Yes. And a text message.","z":"有，還有一則簡訊。","a":"audio/d2dc251747d.mp3"},{"s":"PRIYA","e":"Then Leo has a big problem. Inducing a breach of contract is serious.","z":"那 Leo 麻煩大了。誘使他人違約是很嚴重的。","a":"audio/d8c42f4aff1.mp3"},{"s":"F","e":"Sam, are you okay?","z":"Sam，你還好嗎？","a":"audio/d99592b973f.mp3"},{"s":"SAM","e":"Better now. I thought I'd lose this job.","z":"現在好多了。我以為我會丟掉這份工作。","a":"audio/d2198dc57c3.mp3"},{"s":"GRACE","e":"You won't. Actually, this is exactly the company culture we want.","z":"不會的。事實上，這正是我們想要的公司文化。","a":"audio/dff5c91d111.mp3"}],"h":"📍 週一早上 8:30｜小會議室｜在場：Sam，稍後 Grace｜當面了解 Sam 寫給 Leo 的信｜目標：以尊重和事實為基礎溝通，不預設立場","c":"Priya 帶著證據去找 Vexa 的律師。兩小時後她回來，臉色複雜：「Vexa 想和解。但條件是——我們要撤回 Halden 的競標。」"},{"n":45,"t":"和解的條件","it":[{"s":"GRANT","e":"Our offer is simple. Vexa stops selling the connector. Northwind withdraws from the Halden bid. Take it or leave it.","z":"我們的提議很簡單：Vexa 停賣那款接頭，Northwind 退出 Halden 競標。要就接受，不要拉倒。","a":"audio/d4cc774b6b4.mp3"},{"s":"PRIYA","e":"That's not a compromise. That's a win-lose deal. Our walk-away point is clear: we stay in the bid.","z":"那不是妥協，是一贏一輸。我們的底線很清楚：我們不退出競標。","a":"audio/d7f6f6e50a4.mp3"},{"s":"GRANT","e":"Then we're at a deadlock.","z":"那我們陷入僵局了。","a":"audio/d9f07bc0f3f.mp3"},{"s":"BEN","e":"Not yet. Let's make a counteroffer.","z":"還沒。我們提一個還價。","a":"audio/d886e74932a.mp3"},{"q":"Ben 示意你提出方案。你怎麼開口最有利？","o":[{"e":"Here's our counteroffer: Vexa stops selling the design, pays a license fee for units already sold, and both sides stay in the bid. That's room for negotiation on the fee.","ok":true,"fb":"提出具體、雙方都有台階的方案。","r":{"s":"GRANT","e":"…A license fee. I'll need to talk to my counterpart at Vexa.","z":"……授權費，我得跟 Vexa 的對口談一下。","a":"audio/dc12dab2590.mp3"},"a":"audio/def7978fb0b.mp3"},{"e":"We'll sue you for ten million!","ok":false,"fb":"情緒性威脅，降低可信度。","r":{"s":"GRANT","e":"Go ahead. It'll take years.","z":"請便，那要好幾年。","a":"audio/d1cd21ec000.mp3"},"a":"audio/d3471054bf2.mp3"},{"e":"Okay, we'll withdraw.","ok":false,"fb":"放棄核心利益。","r":{"s":"BEN","e":"Absolutely not.","z":"絕對不行。","a":"audio/d24a8080fde.mp3"},"a":"audio/d7c5c93362a.mp3"}]},{"s":"GRANT","e":"What's your bottom price for the license?","z":"授權費你們的底價是多少？","a":"audio/d78e4b3c798.mp3"},{"s":"PRIYA","e":"Five dollars per unit, paid upfront. Plus Vexa accepts that the design is our copyright and patent.","z":"每件五美元，預付。另外 Vexa 要承認設計的著作權和專利屬於我們。","a":"audio/d4ab17f5c1b.mp3"},{"s":"GRANT","e":"Three dollars, and no public admission. My client cares about its brand image.","z":"三美元，而且不公開承認。我的客戶在乎品牌形象。","a":"audio/d1b51facf00.mp3"},{"s":"BEN","e":"Four dollars and a private admission in the agreement. That's our final offer. It's a mutual benefit: no lawsuit, no headlines.","z":"四美元，在協議中私下承認。這是我們最後的條件。這對雙方都有利：沒有訴訟，也沒有新聞標題。","a":"audio/d0b849d6ce0.mp3"},{"s":"GRANT","e":"I'll take it to my client. If they sign off on it, we'll sign a contract by Friday.","z":"我會轉達給客戶。如果他們同意，週五前簽約。","a":"audio/d4348e47f29.mp3"},{"s":"PRIYA","e":"The terms and conditions need a clause: if Vexa breaks it, the agreement is null and void and we can sue.","z":"條款裡要寫：如果 Vexa 違反，協議就無效，我們可以提告。","a":"audio/dd21b132c83.mp3"},{"s":"GRANT","e":"Agreed in principle.","z":"原則上同意。","a":"audio/df7beb78b05.mp3"},{"d":"會後"},{"s":"BEN","e":"(群組訊息) Settlement looks good. Nobody celebrate yet.","z":"（群組訊息）和解看起來不錯，大家先別慶祝。","a":"audio/ddc03124133.mp3"},{"s":"VIC","e":"(群組訊息) Too late. I bought cake. 🎂","z":"（群組訊息）太遲了，我買了蛋糕。🎂","a":"audio/d85fee8c053.mp3"}],"h":"📍 週二早上 10:00｜視訊會議｜在場：Priya、Ben、Vexa 的律師 Mr. Grant｜和 Vexa 談和解｜目標：守住底線，談出可接受的協議","c":"週五，Vexa 簽了和解協議。但同一天，Leo 在 LinkedIn 發文：「很高興宣布，Vexa 將推出全新電源模組套裝方案。」——跟你們的綁售點子一模一樣。"},{"n":46,"t":"搶先上市","it":[{"s":"MIA","e":"Okay, Vexa copied our idea again. But they only announced it. We can launch first.","z":"好，Vexa 又抄了我們的點子，但他們只是宣布而已，我們可以搶先上市。","a":"audio/d7f7da036fb.mp3"},{"s":"KAI","e":"First-mover advantage. Early adopters remember who was first.","z":"先行者優勢。早期採用者會記得誰是第一個。","a":"audio/d591f0481fd.mp3"},{"s":"MIA","e":"Here's my plan for the marketing campaign. Target market: mid-size electronics makers. Customer persona: an engineering manager who hates dealing with five suppliers.","z":"這是我的行銷活動規劃。目標市場：中型電子廠。客戶輪廓：討厭同時應付五家供應商的工程經理。","a":"audio/d1d59693deb.mp3"},{"s":"OREN","e":"What's the customer journey?","z":"客戶旅程是什麼？","a":"audio/d49e426defc.mp3"},{"s":"MIA","e":"They see a short video on social media, click to our page, download a free guide, then book a demo. A classic funnel.","z":"他們在社群看到短影片，點進我們網頁，下載免費指南，然後預約展示。經典的漏斗。","a":"audio/d4449cd4e7e.mp3"},{"s":"KAI","e":"And a free trial? Engineers love testing things.","z":"那免費試用呢？工程師最愛測試東西。","a":"audio/dbf3a7f19e2.mp3"},{"s":"MIA","e":"Yes, a thirty-day free trial for qualified leads.","z":"好，合格的潛在客戶有三十天免費試用。","a":"audio/d66e513c429.mp3"},{"q":"Oren 問預算。你要怎麼幫 Mia 說服他？","o":[{"e":"If our customer acquisition cost stays below two thousand dollars, one new client pays back the whole ad spend. We can track it with analytics every week.","ok":true,"fb":"用 CAC 和數據說服主管。","r":{"s":"OREN","e":"That I can sell to Sharon. Approved.","z":"這我可以說服 Sharon，批准。","a":"audio/d7783c2b7a5.mp3"},"a":"audio/d7d32c19f98.mp3"},{"e":"Let's spend everything and hope it goes viral.","ok":false,"fb":"把希望寄託在爆紅，不可靠。","r":{"s":"MIA","e":"Viral isn't a strategy.","z":"爆紅不是策略。","a":"audio/dfabdb372bb.mp3"},"a":"audio/deb368fc592.mp3"},{"e":"We don't need marketing.","ok":false,"fb":"低估行銷價值。","r":{"s":"MIA","e":"(瞪你)","z":"（瞪你）","a":null},"a":"audio/da37392ae75.mp3"}]},{"s":"MIA","e":"We also need a slogan for the bundle.","z":"綁售也需要一個口號。","a":"audio/d2b8c70a706.mp3"},{"s":"F","e":"\"One partner. Full power.\"","z":"「一個夥伴，全方位動力。」","a":"audio/d919cf7b9c3.mp3"},{"s":"MIA","e":"Love it! I'll write a press release and check our brand guideline for the logo. Maybe we can rebrand the bundle as \"Falcon Power.\"","z":"喜歡！我來寫新聞稿，並查品牌規範看 logo 怎麼放。也許綁售可以重新命名為「Falcon Power」。","a":"audio/dfd19cd7df9.mp3"},{"s":"KAI","e":"Volta will endorse it on our channels too. Our founder story gets great engagement.","z":"Volta 也會在我們的管道背書。我們創辦人的故事互動率很高。","a":"audio/d356e6ebeda.mp3"},{"s":"OREN","e":"How do we measure success?","z":"怎麼衡量成功？","a":"audio/d55f4785bac.mp3"},{"s":"MIA","e":"Click-through rate, impressions, and campaign results in leads. I'll circle back next Monday with numbers.","z":"點擊率、曝光數，還有活動帶來的名單成效。下週一我再帶數字回報。","a":"audio/d0cb4392f36.mp3"},{"s":"MIA","e":"People who unsubscribe from our newsletter get a short survey. And if our emails bounce back, we clean the list.","z":"取消訂閱電子報的人會收到簡短問卷。信件被退回的話，我們就清理名單。","a":"audio/dcc4ede9a94.mp3"}],"h":"📍 週一早上 9:30｜行銷部｜在場：Mia、Oren、Kai（視訊）｜Vexa 也要推綁售，要搶時間｜目標：快速規劃行銷活動，搶佔先機","c":"三天後，Mia 衝進辦公室：「我們的影片爆紅了！但是……留言區有人說，Volta 的模組在高溫下會過熱。」"},{"n":47,"t":"爆紅之後","it":[{"s":"MIA","e":"Two hundred thousand views in three days! It's viral marketing at its best. But this comment has two thousand likes: \"Volta modules overheat. Don't buy.\"","z":"三天二十萬次觀看！完美的病毒式行銷。但這則留言有兩千個讚：「Volta 模組會過熱，別買。」","a":"audio/d7aa10a42f2.mp3"},{"s":"KAI","e":"That was our first version, the MVP. We fixed it a year ago.","z":"那是我們第一版，最小可行產品，一年前就修好了。","a":"audio/d5ab06e59b8.mp3"},{"s":"TOM","e":"I tested the new one myself. It's fine up to eighty-five degrees.","z":"新版我親自測過，85 度以內都沒問題。","a":"audio/d434e404c50.mp3"},{"q":"你要建議怎麼回應網路負評？","o":[{"e":"Let's respond publicly and honestly: admit the early issue, show Tom's test data, and offer a free trial so people can check themselves.","ok":true,"fb":"誠實回應加數據佐證，最能建立信任。","r":{"s":"MIA","e":"Transparent and confident. Our brand loyalty will grow from this.","z":"透明又有自信，品牌忠誠度會因此提升。","a":"audio/d77adf82fe8.mp3"},"a":"audio/da91a8f6d41.mp3"},{"e":"Delete the comment.","ok":false,"fb":"刪留言會被認為心虛，反效果。","r":{"s":"MIA","e":"People will screenshot it. Worse.","z":"大家會截圖，更糟。","a":"audio/dce3eb48673.mp3"},"a":"audio/d2b4e064990.mp3"},{"e":"Reply: \"You're lying!\"","ok":false,"fb":"攻擊網友會引發更大負評。","r":{"s":"KAI","e":"Please, no.","z":"拜託不要。","a":"audio/dffb344c46b.mp3"},"a":"audio/dae8831c4ad.mp3"}]},{"s":"MIA","e":"I'll also use this for content marketing. A blog post: \"How we fixed overheating.\" Good for SEO too.","z":"我也會拿來做內容行銷，寫一篇部落格：「我們如何解決過熱問題」，對搜尋引擎優化也有幫助。","a":"audio/d3be25ba609.mp3"},{"s":"KAI","e":"Our customer insight is that engineers trust test data more than ads.","z":"我們的客戶洞察是：工程師相信測試數據勝過廣告。","a":"audio/d146c575ee8.mp3"},{"s":"MIA","e":"Then let's do event marketing too. A live test at the Taipei tech fair. Maybe a sponsorship of an engineering competition.","z":"那也來做活動行銷：在台北科技展現場測試，或者贊助一場工程競賽。","a":"audio/df2ae3710d2.mp3"},{"s":"F","e":"What about a brand ambassador? A well-known engineer on YouTube?","z":"那品牌大使呢？找一位 YouTube 上有名的工程師？","a":"audio/df4bdfe0e6b.mp3"},{"s":"MIA","e":"Good idea. Better than product placement in a drama.","z":"好點子，比在電視劇裡置入行銷好。","a":"audio/d2637d0ef07.mp3"},{"s":"TOM","e":"Also, the packaging. Engineers hate opening plastic. Make it simple.","z":"還有包裝。工程師討厭拆塑膠，要簡單。","a":"audio/dfffc67536d.mp3"},{"s":"MIA","e":"Noted. Our market research says the mass market wants cheap. But our market segment wants reliable. That's our market share to win.","z":"記下了。市場調查說大眾市場要便宜，但我們的區隔市場要可靠，那是我們要搶的市佔率。","a":"audio/dd3575d83b8.mp3"},{"s":"KAI","e":"And no coupons. We're not selling pizza.","z":"而且不要優惠券，我們又不是在賣披薩。","a":"audio/d073a16d9f9.mp3"},{"s":"MIA","e":"Ha. Fine. But a loyalty program for repeat customers?","z":"哈，好。但給回頭客的忠誠計畫呢？","a":"audio/d0b887a2328.mp3"},{"s":"KAI","e":"That I like.","z":"這我喜歡。","a":"audio/d8061c5a644.mp3"}],"h":"📍 週四早上 10:00｜行銷部｜在場：Mia、Tom、Kai（視訊）｜影片爆紅但出現負評｜目標：處理網路負評，保護品牌","c":"下午，Diana 打來：「你們的影片陳總看了。他想親自見你們——下週，在 Halden 的越南工廠。帶上產品。」"},{"n":48,"t":"客服大考驗","it":[{"s":"JOY","e":"Halden wants a service level agreement for the bundle. Response time within four hours, resolution within two days.","z":"Halden 要綁售的服務水準協議：四小時內回應，兩天內解決。","a":"audio/dbd3a88d96f.mp3"},{"s":"F","e":"Can we do that?","z":"我們做得到嗎？","a":"audio/dc013c35054.mp3"},{"s":"JOY","e":"Our help desk can. Every issue gets a ticket. Our first-call resolution rate is seventy percent.","z":"我們的服務台可以。每個問題都會開單，首次通話解決率七成。","a":"audio/dd93e154950.mp3"},{"s":"SAM","e":"What about after service hours?","z":"下班時間之後呢？","a":"audio/dbfe80d5bb2.mp3"},{"s":"JOY","e":"We have a chatbot and live chat for simple questions, and a callback system. The FAQ page covers the rest.","z":"簡單問題有聊天機器人和線上客服，還有回撥系統，其他的常見問題頁面都有。","a":"audio/d812627d984.mp3"},{"d":"電話響起"},{"s":"JOY","e":"Customer support, this is Joy. May I have your account number? … I'm sorry for the inconvenience. Let me verify your order.","z":"客服中心，我是 Joy。請問您的帳號？……造成不便很抱歉，我幫您核對訂單。","a":"audio/de01343718d.mp3"},{"s":"JOY","e":"(掩住話筒) Angry customer. Wrong part, wants to escalate a complaint. Fancia, want to try?","z":"（摀住話筒）客人很生氣，零件送錯，要升級客訴。Fancia，想試試嗎？","a":"audio/d2b6b0ea154.mp3"},{"q":"你接過電話，客戶很生氣。第一句怎麼說最好？","o":[{"e":"Hello, this is Fancia. I understand you're frustrated, and I'll look into it right now. Could you tell me what happened?","ok":true,"fb":"先同理、承諾處理，再請對方說明。","r":{"s":"CUSTOMER","e":"…Thank you. Finally someone listens.","z":"……謝謝，終於有人在聽了。","a":"audio/d183f3d5e25.mp3"},"a":"audio/d114546db07.mp3"},{"e":"Calm down, please.","ok":false,"fb":"叫人冷靜通常讓人更火大。","r":{"s":"CUSTOMER","e":"Don't tell me to calm down!","z":"不要叫我冷靜！","a":"audio/dc7da2a79fd.mp3"},"a":"audio/dafc07924c2.mp3"},{"e":"It's not my department.","ok":false,"fb":"推託，客訴會更嚴重。","r":{"s":"JOY","e":"(搖頭)","z":"（搖頭）","a":null},"a":"audio/d77f98740d5.mp3"}]},{"s":"F","e":"I see. Under our return policy, we can do an exchange or a refund. I'll also compensate the shipping cost with a voucher.","z":"了解。依照退貨政策，可以換貨或退款，我也會用折價券補償運費。","a":"audio/d5b180ba31e.mp3"},{"s":"CUSTOMER","e":"An exchange is fine.","z":"換貨就好。","a":"audio/de3e9eb65b4.mp3"},{"s":"F","e":"Great. I'll send a complaint form and a customer feedback form by email. Is there anything else I can help you with?","z":"好的，我會用信寄給您客訴單和顧客意見表。還有什麼我可以幫忙的嗎？","a":"audio/da96260dfbe.mp3"},{"s":"CUSTOMER","e":"No. That's all. Have a nice day.","z":"沒有了，就這樣。祝你有美好的一天。","a":"audio/da1e2448c38.mp3"},{"s":"JOY","e":"Customer satisfaction saved. We'll do a follow-up call next week.","z":"顧客滿意度保住了。下週我們會做追蹤電話。","a":"audio/d7ca8268223.mp3"},{"s":"SAM","e":"Can I put that call in our training as a best practice?","z":"我可以把那通電話放進訓練教材當最佳範例嗎？","a":"audio/d3974f30c75.mp3"},{"s":"JOY","e":"Good customer service is mostly understanding. Listen first.","z":"好的客服大部分是理解，先聽。","a":"audio/d2754821354.mp3"}],"h":"📍 週五早上 9:00｜客服中心｜在場：客服主管 Joy、Sam｜Halden 要求服務水準協議｜目標：了解客服流程與指標，準備 SLA","c":"收拾東西準備去越南時，Ben 傳訊息：「陳總剛改了會面時間，提前到後天。還有——Leo 也會在。」"},{"n":49,"t":"飛往越南","it":[{"s":"OREN","e":"Did you book a flight already? The meeting moved on such short notice.","z":"機票訂了嗎？會議改得這麼臨時。","a":"audio/db90acd3ac4.mp3"},{"s":"F","e":"Yes, a round trip with a layover in Hanoi. The direct flight was full. I also got our visa approved online yesterday.","z":"訂了，來回票，在河內轉機，直飛滿了。昨天也在網路上辦好簽證了。","a":"audio/db47b98968b.mp3"},{"s":"TOM","e":"I only have a carry-on. The samples are in my bag. I'm not checking them in.","z":"我只帶登機箱，樣品在我包包裡，我不託運。","a":"audio/d364987766f.mp3"},{"d":"抵達後，行李轉盤前"},{"s":"OREN","e":"My suitcase isn't here. Great. Lost luggage.","z":"我的行李沒出來。太好了，行李遺失。","a":"audio/d63d7f45b3f.mp3"},{"q":"Oren 的行李不見了，你怎麼幫忙？","o":[{"e":"Let's go to the baggage desk and file a report. Oren, I'll ask the hotel to send toiletries, and we can buy you a shirt tonight.","ok":true,"fb":"冷靜處理並提供實際協助。","r":{"s":"OREN","e":"Thanks. You're better at this than me.","z":"謝謝，你比我還會處理。","a":"audio/d1f8b587a46.mp3"},"a":"audio/d942fe2512d.mp3"},{"e":"That's bad luck. See you at the hotel!","ok":false,"fb":"丟下主管不管，不夠團隊精神。","r":{"s":"TOM","e":"Uh, Fancia…","z":"呃，Fancia……","a":"audio/deb827c66fe.mp3"},"a":"audio/dcd18ce4f83.mp3"},{"e":"Just wear the same clothes tomorrow.","ok":false,"fb":"不太實際，明天要見陳總。","r":{"s":"OREN","e":"In front of Mr. Chen? No.","z":"在陳總面前？不行。","a":"audio/db016c48573.mp3"},"a":"audio/d85392209fd.mp3"}]},{"d":"飯店大廳"},{"s":"CLERK","e":"Welcome. Your hotel booking is for two nights. Good news, we can give you a free upgrade to a suite.","z":"歡迎，您訂了兩晚。好消息，我們可以免費幫您升級套房。","a":"audio/db705eaa3dd.mp3"},{"s":"F","e":"That's very kind. What's the local time? My phone is still on Taipei time.","z":"太客氣了。現在當地時間幾點？我手機還是台北時間。","a":"audio/de08d5ec735.mp3"},{"s":"CLERK","e":"It's 11:30. One hour behind Taipei. Room service is available all night.","z":"11 點半，比台北晚一小時。客房服務整晚都有。","a":"audio/dc03a37de4c.mp3"},{"s":"TOM","e":"Can we get a car rental for tomorrow? The site visit is two hours away.","z":"明天可以租車嗎？工廠參觀要開兩小時。","a":"audio/dede437f1a5.mp3"},{"s":"CLERK","e":"We'll arrange a driver. He'll meet you in the hotel lobby at seven. Check out is at noon on Monday.","z":"我們會安排司機，七點在大廳等您。週一中午退房。","a":"audio/deb52f471d1.mp3"},{"d":"飯店酒吧"},{"s":"TOM","e":"So, Fancia, where's your hometown?","z":"那 Fancia，你老家在哪裡？","a":"audio/d53f6ac3ed3.mp3"},{"s":"F","e":"Tainan. Best food in Taiwan. What about you?","z":"台南，台灣最好吃的地方。你呢？","a":"audio/dc8b89b8dce.mp3"},{"s":"TOM","e":"Hualien. I'm into hiking. That's my hobby when I'm not fixing firmware.","z":"花蓮。我喜歡爬山，不修韌體的時候那就是我的嗜好。","a":"audio/d54f33543aa.mp3"},{"s":"OREN","e":"My hobby is losing suitcases, apparently.","z":"我的嗜好顯然是弄丟行李。","a":"audio/d21eefab643.mp3"}],"h":"📍 週六早上 6:00｜機場到胡志明市｜在場：Oren、Tom｜臨時改期，連夜出發｜目標：處理出差的各種突發狀況","c":"半夜，Diana 傳來訊息：「明天先別提價格。陳總最近心情很差——Halden 的股價這週跌了 20%。」"},{"n":50,"t":"陳總的工廠","it":[{"s":"MR. CHEN","e":"Welcome to our factory. Diana tells me you're the people who refunded us forty thousand dollars.","z":"歡迎來到我們工廠。Diana 說你們就是退了我們四萬美元的人。","a":"audio/d4dd687075e.mp3"},{"s":"F","e":"That's right. It was our mistake. Thank you for having us, Mr. Chen.","z":"沒錯，那是我們的錯。陳總，謝謝您接待我們。","a":"audio/d810bf0e475.mp3"},{"s":"MR. CHEN","e":"Mr. Leo is here too. I like competition. It's good for prices.","z":"Leo 先生也在。我喜歡競爭，對價格有好處。","a":"audio/d220a0e081a.mp3"},{"s":"LEO","e":"It's been a while, Oren.","z":"好久不見，Oren。","a":"audio/d0eece69983.mp3"},{"s":"OREN","e":"Not long enough.","z":"還不夠久。","a":"audio/d4ccda3624c.mp3"},{"s":"MR. CHEN","e":"Let me show you our new line. It's scalable. We'll double production next year. Our engineers want edge computing in every device, so power is our biggest headache.","z":"讓我帶你們看新產線，它可以擴充，明年產能翻倍。我們的工程師希望每台設備都有邊緣運算，所以電源是最大的頭痛。","a":"audio/dde6ca82eeb.mp3"},{"s":"TOM","e":"That's exactly what the bundle solves. May I show you a quick demo?","z":"這正是綁售要解決的，我可以做個簡短展示嗎？","a":"audio/d82cf5c11b0.mp3"},{"q":"陳總心情不好，你在展示前要說什麼最好？","o":[{"e":"Before the demo, could you tell us your top requirement? I'd like to make sure we focus on what matters most to you.","ok":true,"fb":"先問客戶需求，展現尊重與專業。","r":{"s":"MR. CHEN","e":"Hmm. Reliability. Our stock price can't take another recall.","z":"嗯，可靠性。我們的股價承受不了再一次召回。","a":"audio/dfa9e5e760d.mp3"},"a":"audio/dbae6276498.mp3"},{"e":"Our product is the best. Let me prove it.","ok":false,"fb":"自吹自擂，陳總會更煩。","r":{"s":"MR. CHEN","e":"Everyone says that.","z":"每個人都這麼說。","a":"audio/dcc6364dd45.mp3"},"a":"audio/dec7896cb03.mp3"},{"e":"Is your stock price okay?","ok":false,"fb":"戳到痛處，非常失禮。","r":{"s":"DIANA","e":"(瞪你)","z":"（瞪你）","a":null},"a":"audio/d774ca41673.mp3"}]},{"s":"TOM","e":"Then watch this. The module runs at eighty-five degrees for six hours. The software is user-friendly. Your engineers can upgrade it remotely.","z":"那請看：模組在 85 度下連續運作六小時，軟體很好上手，你們的工程師可以遠端升級。","a":"audio/d9e03f9d051.mp3"},{"s":"LEO","e":"Vexa's version is twenty percent cheaper.","z":"Vexa 的版本便宜兩成。","a":"audio/d61769c61f1.mp3"},{"s":"MR. CHEN","e":"Cheaper doesn't help if it overheats. Mr. Leo, how many units have you tested?","z":"便宜如果會過熱也沒用。Leo 先生，你們測了多少件？","a":"audio/dd61b5df3ba.mp3"},{"s":"LEO","e":"…We're still testing.","z":"……我們還在測試。","a":"audio/dfa863da9ed.mp3"},{"s":"MR. CHEN","e":"I see.","z":"我明白了。","a":"audio/dce3ec37841.mp3"},{"s":"MARCUS","e":"(小聲) That's a good sign.","z":"（小聲）這是好跡象。","a":"audio/d6a696c6eb7.mp3"}],"h":"📍 週日早上 9:30｜Halden 越南工廠｜在場：Halden 執行長陳總、Diana、Marcus、Oren、Tom，以及 Vexa 的 Leo｜工廠參觀與產品展示｜目標：先理解客戶需求，再展示產品","c":"參觀結束，陳總叫住你：「Fancia，明天早上八點，你一個人來我辦公室。不要帶 Oren。」"},{"n":51,"t":"單獨面對陳總","it":[{"s":"MR. CHEN","e":"I'll be direct. I want your bundle. But I want Vexa's price.","z":"我直說。我想要你們的綁售方案，但我要 Vexa 的價格。","a":"audio/db7bb3efb60.mp3"},{"s":"F","e":"I understand, Mr. Chen. But Vexa's price doesn't include the warranty, the SLA or a tested module.","z":"我理解，陳總。但 Vexa 的價格不包括保固、服務水準協議和經過測試的模組。","a":"audio/d4d7244df1a.mp3"},{"s":"MR. CHEN","e":"Everything is a bargain if you look hard enough. Make an offer. Now.","z":"夠認真找的話，什麼都能殺價。現在開價。","a":"audio/d42b8750da0.mp3"},{"q":"你沒有最終定價權。最好的應對？","o":[{"e":"I'd like to give you a serious answer. May I call Ben? He has authority on pricing, and I'd rather not guess.","ok":true,"fb":"誠實說明權限，避免亂承諾。","r":{"s":"MR. CHEN","e":"…Good. Call him. On speaker.","z":"……好，打給他，開擴音。","a":"audio/d876bb23032.mp3"},"a":"audio/d864e285c4b.mp3"},{"e":"Okay, Vexa's price. Deal!","ok":false,"fb":"超越權限亂讓價，嚴重錯誤。","r":{"s":"MR. CHEN","e":"Interesting. Your boss will be angry.","z":"有意思，你老闆會生氣的。","a":"audio/de759e02ac9.mp3"},"a":"audio/d070f72e431.mp3"},{"e":"No discount. Ever.","ok":false,"fb":"太僵硬，可能失去客戶。","r":{"s":"MR. CHEN","e":"Then we're done here.","z":"那就談到這。","a":"audio/d2e01eefb8d.mp3"},"a":"audio/d211b831405.mp3"}]},{"d":"你撥打國際電話"},{"s":"BEN","e":"Ben speaking. Sorry, you're breaking up. Could you repeat that?","z":"我是 Ben。抱歉，你斷斷續續的，可以再說一次嗎？","a":"audio/d1574295713.mp3"},{"s":"F","e":"Ben, I'm with Mr. Chen. You're on speaker. He wants to close the deal today but asks for a better price.","z":"Ben，我跟陳總在一起，你在擴音上。他想今天成交，但要求更好的價格。","a":"audio/dc1dce79425.mp3"},{"s":"BEN","e":"Good morning, Mr. Chen. I understand your budget constraint. Here's what I can do: five percent off, if you sign a three-year exclusive agreement.","z":"陳總早安。我理解您的預算限制。我能做的是：如果您簽三年獨家協議，打九五折。","a":"audio/ddaf9a190ab.mp3"},{"s":"MR. CHEN","e":"Three years is long. What if I want to terminate early?","z":"三年很長。如果我想提前終止呢？","a":"audio/dc221b17a9e.mp3"},{"s":"BEN","e":"Then the discount is paid back. And we can renew every year after that.","z":"那折扣要退回。之後每年可以續約。","a":"audio/d3864147e59.mp3"},{"s":"MR. CHEN","e":"Sweeten the deal a little. Free after-sales service for the first year.","z":"再加點甜頭：第一年免費售後服務。","a":"audio/db18ec42f62.mp3"},{"s":"BEN","e":"Deal.","z":"成交。","a":"audio/db1efdb2fd6.mp3"},{"s":"MR. CHEN","e":"Fancia, you did the right thing. Leo said yes to everything yesterday. I don't trust people who say yes to everything.","z":"Fancia，你做得對。Leo 昨天什麼都答應，我不信任什麼都答應的人。","a":"audio/d4595235a7b.mp3"}],"h":"📍 週一早上 8:00｜陳總辦公室｜在場：陳總，稍後 Ben（國際電話）｜陳總單獨跟你談價格｜目標：守住底線，同時讓客戶覺得被重視","c":"你走出辦公室，眼眶有點熱。手機響了——是 Linnea：「好消息還是壞消息先聽？總部的財報電話會議提前了，Sharon 要你明天上線報告 Halden。」"},{"n":52,"t":"財報電話會議","it":[{"s":"CFO","e":"Thank you for dialing in. This is an internal session before our earnings call with investors. Taipei, you're up.","z":"謝謝各位上線。這是對投資人財報電話會議前的內部會議。台北，換你們。","a":"audio/d85dbd1f26d.mp3"},{"s":"LIN","e":"Thank you. This quarter we beat expectations on revenue, but missed estimates on net margin, because of the refund and air freight.","z":"謝謝。本季營收超出預期，但淨利率未達預估，原因是退款和空運。","a":"audio/d8e03665d47.mp3"},{"s":"CFO","e":"And the Halden contract?","z":"那 Halden 合約呢？","a":"audio/dc3254ff149.mp3"},{"s":"F","e":"Three years, exclusive. We expect it to double our volume and lower our cost of goods sold by twelve percent.","z":"三年獨家。預計我們的量會翻倍，銷貨成本降低 12%。","a":"audio/dd35b35f642.mp3"},{"s":"CFO","e":"What does that mean for earnings per share growth? Shareholders care about EPS.","z":"那對每股盈餘成長有什麼影響？股東在乎 EPS。","a":"audio/df27e58983e.mp3"},{"s":"LIN","e":"Taipei alone could add two cents to group EPS. We would outperform the region.","z":"光台北就能為集團 EPS 貢獻兩分錢，我們會超越區域平均。","a":"audio/d95e116daac.mp3"},{"s":"SHARON","e":"Institutional investors will ask about guidance. Can we raise it?","z":"機構投資人會問財測，我們可以上調嗎？","a":"audio/d97bbf02d6e.mp3"},{"q":"財務長問你風險。你要怎麼回答最專業？","o":[{"e":"The main risk is supply. We'll need some CapEx for a new test line, but we break even on it within one year.","ok":true,"fb":"承認風險並給出量化的回收期，很專業。","r":{"s":"CFO","e":"Clear. I like a manager who knows her numbers.","z":"很清楚，我喜歡懂數字的經理。","a":"audio/df07aa37e42.mp3"},"a":"audio/dc167dbe9a6.mp3"},{"e":"There's no risk at all.","ok":false,"fb":"過度樂觀，財務長不會相信。","r":{"s":"CFO","e":"There's always risk.","z":"風險永遠存在。","a":"audio/d5ecc93c8ef.mp3"},"a":"audio/d21bdf0835d.mp3"},{"e":"I don't know. Ask Linnea.","ok":false,"fb":"自己的案子要能回答。","r":{"s":"LIN","e":"(小聲) Say something!","z":"（小聲）說點什麼！","a":"audio/d5943142d20.mp3"},"a":"audio/dd0477d96c8.mp3"}]},{"s":"CFO","e":"Linnea, what about the cash flow statement? A new line means more debt?","z":"Linnea，現金流量表呢？新產線意味著更多負債？","a":"audio/d2b50744fe2.mp3"},{"s":"LIN","e":"No new loan. We'll use our cash reserve and working capital. Depreciation is over five years, which also lowers our tax.","z":"不用新貸款，我們會用現金準備和營運資金。折舊分五年，也能降低稅負。","a":"audio/d5f1edf6d74.mp3"},{"s":"CFO","e":"Good. Equity stays clean. I'll approve the budget.","z":"很好，股東權益保持乾淨。我會批准預算。","a":"audio/d8d2c5757ed.mp3"},{"s":"SHARON","e":"And put the Halden story in the annual report. Shareholders love a comeback story. And we might even raise the dividend.","z":"把 Halden 的故事寫進年報。股東喜歡逆轉勝的故事，我們甚至可能提高股利。","a":"audio/d5b190de2a9.mp3"}],"h":"📍 週二下午 4:00｜台北辦公室（視訊連線總部）｜在場：Sharon、總部財務長、Linnea、Ben｜內部財報會議，報告 Halden 對業績的影響｜目標：用財務語言清楚說明合約價值","c":"會議結束，Sharon 留下你單獨通話：「Fancia，我直說了。Oren 申請調職，去負責跟 Volta 的合資公司。他推薦你接他的位子。」"},{"n":53,"t":"Oren 的決定","it":[{"s":"OREN","e":"So Sharon told you.","z":"Sharon 告訴你了。","a":"audio/dd98cf1d646.mp3"},{"s":"F","e":"Why didn't you tell me first?","z":"你為什麼不先跟我說？","a":"audio/d375f850503.mp3"},{"s":"OREN","e":"Because I wanted you to hear it as a decision, not a rumor. I'm going to run the joint venture with Volta. It's my chance to build something from zero.","z":"因為我希望你聽到的是決定，不是傳言。我要去負責跟 Volta 的合資公司，這是我從零打造東西的機會。","a":"audio/d5517e5fbc2.mp3"},{"s":"F","e":"And you think I can lead the sales team? I'm not sure I agree.","z":"你覺得我能帶業務團隊？我不太同意。","a":"audio/d875b092858.mp3"},{"s":"OREN","e":"I see your point. You're new. But leadership isn't about years. You already lead by example. You took the initiative with Diana, with Vicky, with Sam.","z":"我懂你的意思，你是新人。但領導跟年資無關。你已經在以身作則了：Diana、Vicky、Sam 的事，你都主動出擊。","a":"audio/ddcf49451b3.mp3"},{"q":"Oren 給你很大的信任。你想表達顧慮，又不想推掉機會，怎麼說？","o":[{"e":"Thank you for trusting me. I'd like to try, but I'll need your coaching for the first three months. Could we do a weekly one-on-one?","ok":true,"fb":"接受挑戰並提出具體支援需求，很成熟。","r":{"s":"OREN","e":"Every Friday. Coffee's on me.","z":"每週五，咖啡我請。","a":"audio/dd290a8803d.mp3"},"a":"audio/d3149c6058c.mp3"},{"e":"No way. I'm not ready.","ok":false,"fb":"直接拒絕，可能錯失成長機會。","r":{"s":"OREN","e":"Nobody is ever ready.","z":"沒有人真的準備好。","a":"audio/da69a471e8a.mp3"},"a":"audio/dd9b5f90aad.mp3"},{"e":"Finally! I deserve it.","ok":false,"fb":"太自滿，同事可能反感。","r":{"s":"OREN","e":"Careful. Humility matters.","z":"小心，謙虛很重要。","a":"audio/d8a27f45f60.mp3"},"a":"audio/da619a07b6a.mp3"}]},{"s":"OREN","e":"Three pieces of advice. First, empower your people. Delegate tasks, don't do everything yourself.","z":"三個建議。第一，賦權給你的人，分派任務，別什麼都自己做。","a":"audio/d4ea8698337.mp3"},{"s":"OREN","e":"Second, motivate with a vision, not just numbers. People follow a mission.","z":"第二，用願景激勵人，不只是數字。人們追隨的是使命。","a":"audio/dd71302c1dc.mp3"},{"s":"OREN","e":"Third, when there's conflict, don't avoid it. Resolve a conflict early, before it grows. Ben and I waited five years.","z":"第三，有衝突時別逃避。及早化解衝突，別等它長大。Ben 和我等了五年。","a":"audio/dc01e85267f.mp3"},{"s":"F","e":"And decision-making? Ben is still the boss.","z":"那決策呢？Ben 還是老闆。","a":"audio/dd2808338b2.mp3"},{"s":"OREN","e":"Ben will give you room. He told me so. He also said, and I quote, \"She's better than a performance improvement plan.\"","z":"Ben 會給你空間，他親口說的。他還說，我照念：「她比績效改善計畫有用多了。」","a":"audio/d55a913264a.mp3"},{"s":"F","e":"That's… a compliment?","z":"那……算是稱讚嗎？","a":"audio/dc35cc980f9.mp3"},{"s":"OREN","e":"From Ben, it's a love letter.","z":"從 Ben 嘴裡說出來，那是情書。","a":"audio/d1f37c4303c.mp3"},{"s":"OREN","e":"One more thing. A team building activity before I leave. Karaoke. Ben is paying.","z":"還有一件事。我走之前辦一次團隊活動：唱 KTV，Ben 買單。","a":"audio/d9561d8a63d.mp3"},{"s":"OREN","e":"Being hands-on is good, but don't do every coworker's job.","z":"親力親為是好事，但別把每個同事的工作都攬下來。","a":"audio/df8f7d4e98a.mp3"}],"h":"📍 週三晚上 6:30｜公司頂樓陽台｜在場：Oren｜Oren 要離開業務部，推薦你接手｜目標：聽懂領導相關的建議，表達你的顧慮","c":"第二天，Kai 寄來合資公司的策略簡報，附註一行字：「Vexa 又出價了。這次不是收購 Volta，而是收購 Northwind 台北。」"},{"n":54,"t":"策略會議","it":[{"s":"SHARON","e":"Two items. One, the joint venture roadmap planning. Two, Vexa's offer. Let's start with the JV. Kai?","z":"兩件事。第一，合資公司的路線圖規劃；第二，Vexa 的提議。先談合資。Kai？","a":"audio/dd4cd41a6a9.mp3"},{"s":"KAI","e":"Our long-term plan is market expansion across Southeast Asia. Short-term goal: win three clients like Halden next year.","z":"我們的長期計畫是擴展東南亞市場。短期目標：明年拿下三個像 Halden 的客戶。","a":"audio/d711e3c4303.mp3"},{"s":"OREN","e":"Market entry in Vietnam first. Halden gives us a reference. Then we expand to Thailand.","z":"先進入越南市場，Halden 能當我們的參考案例，再擴展到泰國。","a":"audio/d4b0d5215db.mp3"},{"s":"KAI","e":"We also want to benchmark against market leaders in Japan. Their energy efficiency is the standard.","z":"我們也想以日本的市場領導者為標竿，他們的能源效率就是標準。","a":"audio/d1516b2f692.mp3"},{"s":"SHARON","e":"And sustainability? Investors care about ESG now.","z":"那永續呢？投資人現在很在乎 ESG。","a":"audio/dab33751e10.mp3"},{"s":"KAI","e":"Our modules save thirty percent energy. Our goal is a carbon neutral factory by year three.","z":"我們的模組省三成電，目標是三年內工廠碳中和。","a":"audio/d81b8eaa48b.mp3"},{"s":"BEN","e":"This is a big pivot for us. From parts supplier to energy solutions.","z":"這對我們是個大轉型：從零件供應商變成能源解決方案。","a":"audio/df31a070416.mp3"},{"s":"OREN","e":"It's diversification. If the connector market slows, we have another engine. Tailwinds from AI, headwinds from tariffs.","z":"這是多角化。如果接頭市場放緩，我們還有另一個引擎。AI 是順風，關稅是逆風。","a":"audio/dff2a3e2857.mp3"},{"s":"SHARON","e":"Now, Vexa. They offered to buy Taipei. Their argument: they want to disrupt the market and need our customers.","z":"現在談 Vexa。他們出價要買台北，理由是要顛覆市場，需要我們的客戶。","a":"audio/df3747ec15f.mp3"},{"q":"Sharon 問大家的看法。你怎麼表達你的觀點？","o":[{"e":"From my point of view, our customers stay because of trust. If Vexa buys us, Halden may walk away. This deal is an opportunity for Vexa, not for us.","ok":true,"fb":"用客戶觀點分析，有理有據。","r":{"s":"SHARON","e":"Agreed. We'll reject the offer.","z":"同意，我們拒絕。","a":"audio/ddaf2c48cd6.mp3"},"a":"audio/de7451ab707.mp3"},{"e":"Let's sell! More money for everyone.","ok":false,"fb":"只看短期利益，忽視客戶。","r":{"s":"BEN","e":"Our people aren't for sale.","z":"我們的人不是商品。","a":"audio/ddbb4d0f1b1.mp3"},"a":"audio/df920c92c99.mp3"},{"e":"I don't have an opinion.","ok":false,"fb":"錯失表現機會。","r":{"s":"OREN","e":"You always have one. Say it.","z":"你一向有想法，說出來。","a":"audio/d0b19afc91a.mp3"},"a":"audio/d926464aa61.mp3"}]},{"s":"KAI","e":"And if Vexa doesn't stop?","z":"如果 Vexa 不罷手呢？","a":"audio/dc6d749376d.mp3"},{"s":"SHARON","e":"Then we spin off the JV as a separate company, so Vexa can't touch it. And Kai keeps his exit strategy as an entrepreneur.","z":"那我們就把合資公司分拆成獨立公司，讓 Vexa 碰不到。Kai 身為創業家的退場策略也能保留。","a":"audio/db03110ea9e.mp3"},{"s":"KAI","e":"Then let's write the investor pitch.","z":"那我們來寫投資簡報吧。","a":"audio/d2572af2ad5.mp3"},{"s":"KAI","e":"Remember, our first product was a minimum viable product. We moved fast, then improved.","z":"記得，我們第一個產品是最小可行產品，我們先快速推出，再改進。","a":"audio/d409a900566.mp3"}],"h":"📍 週五早上 9:00｜飯店會議室・策略會議｜在場：Sharon、Ben、Oren、Kai｜討論合資策略，並面對 Vexa 的收購提議｜目標：理解策略用語，提出你的觀點","c":"會後，Priya 打來：「合資協議要在下週簽。但是我在做盡職調查時發現，Volta 有一位早期投資人——Leo 持有 Volta 5% 的股份。」"},{"n":55,"t":"盡職調查","it":[{"s":"PRIYA","e":"During due diligence, I found that Leo owns a five percent stake in Volta. He invested when Kai was still in his garage.","z":"做盡職調查時我發現，Leo 持有 Volta 5% 的股份，他在 Kai 還在車庫時就投資了。","a":"audio/de1b45e5e40.mp3"},{"s":"KAI","e":"It's true. He was my first investor. But five percent gives him no control.","z":"是真的，他是我第一位投資人。但 5% 沒有控制權。","a":"audio/df5e5f9c53f.mp3"},{"s":"PRIYA","e":"Control, no. Information, yes. As a shareholder, he can see some financial reports.","z":"控制權沒有，但有資訊權。身為股東，他能看到部分財務報告。","a":"audio/d26f313f8a5.mp3"},{"s":"BEN","e":"Can we buy him out?","z":"我們可以買下他的股份嗎？","a":"audio/d951eaf9e30.mp3"},{"s":"PRIYA","e":"The JV agreement can include an exclusivity clause and a non-compete for all shareholders. If Leo refuses, he must sell his shares.","z":"合資協議可以加入獨家條款和所有股東的競業禁止。Leo 如果拒絕，就必須出售股份。","a":"audio/dcd4ffda245.mp3"},{"s":"KAI","e":"He'll refuse. Leo never waives anything.","z":"他會拒絕。Leo 從不放棄任何權利。","a":"audio/d40391a9d23.mp3"},{"q":"Kai 很擔心。你要怎麼幫忙推進？","o":[{"e":"Then let's make him an offer for his shares at a fair price. For Leo, money matters more than control.","ok":true,"fb":"理解對方動機，提出實際方案。","r":{"s":"PRIYA","e":"That works. It's cleaner than a fight.","z":"可行，比打一架乾淨。","a":"audio/d3a6f4484ce.mp3"},"a":"audio/d16d9342e01.mp3"},{"e":"Let's sue Leo again.","ok":false,"fb":"沒有法律依據，浪費時間。","r":{"s":"PRIYA","e":"For what? Investing?","z":"告什麼？投資嗎？","a":"audio/d2719a1c629.mp3"},"a":"audio/d01b9f9d597.mp3"},{"e":"Forget the JV.","ok":false,"fb":"太快放棄。","r":{"s":"KAI","e":"Please, no.","z":"拜託不要。","a":"audio/dffb344c46b.mp3"},"a":"audio/de987face0b.mp3"}]},{"d":"兩天後"},{"s":"PRIYA","e":"Leo accepted. He sold his stake. Now the paperwork. This is a memorandum of the deal terms. The counterparty is Volta Pte. Ltd.","z":"Leo 接受了，他賣掉股份。現在是文件作業。這是交易條件備忘錄，對方是 Volta 私人有限公司。","a":"audio/d286e01f86d.mp3"},{"s":"PRIYA","e":"Kai, since you're in Singapore, you'll need a power of attorney for your lawyer to sign here. And it must be notarized.","z":"Kai，你在新加坡，需要授權書讓你的律師在這裡簽，而且要公證。","a":"audio/defd5afd93f.mp3"},{"s":"KAI","e":"What about terms of payment?","z":"付款條件呢？","a":"audio/dc147a8a1f9.mp3"},{"s":"PRIYA","e":"Fifty percent at signing, fifty percent in six months. Also, update your terms of service and privacy policy before the merger of the sales teams.","z":"簽約時付一半，六個月後付另一半。另外，業務團隊合併前要更新服務條款和隱私權政策。","a":"audio/d812db6297e.mp3"},{"s":"BEN","e":"Do we need a witness?","z":"需要見證人嗎？","a":"audio/d3c7a2ee38b.mp3"},{"s":"PRIYA","e":"Yes. Fancia, would you be our witness? Your signature goes here.","z":"要。Fancia，你可以當我們的見證人嗎？你在這裡簽名。","a":"audio/d8a46e9d0b1.mp3"},{"s":"F","e":"My first acquisition. Sort of.","z":"我的第一次併購……算是吧。","a":"audio/d56f3d8689d.mp3"}],"h":"📍 週一早上 10:00｜法務部｜在場：Priya、Kai（視訊）、Ben｜處理 Leo 持股的問題並準備簽約｜目標：理解併購與合約條款","c":"簽完字，你的手機收到 Linnea 的訊息：「快看新聞！股市大跌，Halden 跌停。陳總剛打給 Ben——他想延後訂單。」"},{"n":56,"t":"股市大跌","it":[{"s":"LIN","e":"Don't panic. It's a correction, not a crash. The market is down twelve percent this month.","z":"別慌，這是修正，不是崩盤。這個月大盤跌了 12%。","a":"audio/dc1b5c2517a.mp3"},{"s":"SAM","e":"My portfolio is all red. Should I sell?","z":"我的投資組合全綠了（虧損）。要賣嗎？","a":"audio/dcbcbde6ef5.mp3"},{"s":"LIN","e":"Did you set a stop loss?","z":"你有設停損嗎？","a":"audio/dd7feeb26b2.mp3"},{"s":"SAM","e":"No… I didn't even know what that was until last week.","z":"沒有……我上週才知道那是什麼。","a":"audio/ddc3989a9fb.mp3"},{"s":"VIC","e":"My cousin says it's time to buy the dip.","z":"我表哥說現在該逢低買進。","a":"audio/deff0f3cb3c.mp3"},{"s":"LIN","e":"Maybe. Or it's a bear market rally and it drops again. Nobody knows. People talk about a recession next year.","z":"也許。也可能是熊市反彈，然後又跌。沒人知道，大家都在談明年可能衰退。","a":"audio/da8d1573676.mp3"},{"q":"Sam 很焦慮，問你怎麼看。你怎麼回最自然？","o":[{"e":"I'm not an expert, but Linnea taught me: think long term, and don't check your brokerage account every hour.","ok":true,"fb":"謙虛分享，還幽默地減輕焦慮。","r":{"s":"SAM","e":"Ha. I checked it ten times this morning.","z":"哈，我今天早上看了十次。","a":"audio/d7c4216e33a.mp3"},"a":"audio/d4493767bc1.mp3"},{"e":"Sell everything now!","ok":false,"fb":"情緒化建議，不負責任。","r":{"s":"LIN","e":"Please don't give financial advice, Fancia.","z":"拜託別給理財建議，Fancia。","a":"audio/ddb42eb36d5.mp3"},"a":"audio/db3fca64cb5.mp3"},{"e":"Who cares, it's just money.","ok":false,"fb":"太輕率，Sam 會更不安。","r":{"s":"SAM","e":"It's my money…","z":"那是我的錢……","a":"audio/d03564e79d9.mp3"},"a":"audio/d96581e63c2.mp3"}]},{"s":"LIN","e":"Also, Halden's market cap fell by a third, but their business is fine. Last year I took profit at the top. Capital gains are nice, but I prefer the dividend yield.","z":"另外，Halden 市值跌了三分之一，但業務沒問題。去年我在高點獲利了結，資本利得很好，但我更喜歡股息殖利率。","a":"audio/d5ebdd5f5bd.mp3"},{"s":"VIC","e":"I want passive income too. And a bigger cubicle.","z":"我也想要被動收入，還有大一點的隔間。","a":"audio/d2b36d65ab3.mp3"},{"s":"SAM","e":"We work in an open-plan office, Vicky. There are no cubicles.","z":"我們是開放式辦公室，Vicky，沒有隔間。","a":"audio/d2dcd2c5a95.mp3"},{"s":"VIC","e":"Exactly. That's why I want one.","z":"正是如此，所以我想要一個。","a":"audio/d69b2f2824a.mp3"},{"s":"LIN","e":"Okay, lunch break is over. Sam, can you photocopy these invoices? And the printer is out of paper. Office supplies are in the storage room, next to the stationery.","z":"好，午休結束。Sam，可以幫我影印這些發票嗎？印表機沒紙了，辦公用品在儲藏室文具旁邊。","a":"audio/d43f43bdadb.mp3"},{"s":"SAM","e":"Sure. And I'll fix the meeting room booking for Friday. Someone double-booked it.","z":"好。我也會處理週五會議室預約，有人重複訂了。","a":"audio/dac5e94f238.mp3"},{"s":"VIC","e":"(群組) Who stole my yogurt from the fridge? I will find you.","z":"（群組）誰偷了我冰箱裡的優格？我會找到你的。","a":"audio/d3f80de16de.mp3"},{"s":"BEN","e":"(群組) …Sorry. My bad. I'll buy you two.","z":"（群組）……抱歉，我的錯，我買兩瓶還你。","a":"audio/d529e46d030.mp3"}],"h":"📍 週二中午 12:00｜辦公室茶水間・午休｜在場：Linnea、Vicky、Sam｜股市修正，大家邊吃午餐邊聊｜目標：學會投資與辦公室閒聊用語","c":"下午，Ben 從陳總的電話會議出來：「Halden 要延後第一批訂單一個月。如果我們同意，這一季業績就達不到總部目標——台北的重組評估又回來了。」"},{"n":57,"t":"Elaine 的最後一天","it":[{"s":"ELA","e":"Okay Sam, last lesson: emails. When a client sends an inquiry, respond within four hours. Even if you don't have the answer, say \"I'll get right back to you.\"","z":"好 Sam，最後一課：寫信。客戶來詢問，四小時內回覆。即使沒答案，也要說「我馬上回覆您」。","a":"audio/d5335f9d472.mp3"},{"s":"SAM","e":"Got it. And the opening?","z":"了解。開頭呢？","a":"audio/d46d72ac0d5.mp3"},{"s":"ELA","e":"Never \"Dear Sir or Madam\" or \"To whom it may concern\" if you know the name. Use the name.","z":"知道名字的話，別用「敬啟者」或「致相關人士」，直接用名字。","a":"audio/d1b1cf3ad9c.mp3"},{"s":"ELA","e":"If you're late, start with \"Apologies for the delay.\" Then: \"As discussed, please find the packing list attached.\"","z":"如果回晚了，先寫「抱歉回覆晚了」。然後：「如先前討論，附上裝箱單。」","a":"audio/d434286a628.mp3"},{"s":"SAM","e":"Attached or enclosed?","z":"用 attached 還是 enclosed？","a":"audio/d8730bda7d7.mp3"},{"s":"ELA","e":"Attached for an attachment in email. Enclosed is for paper letters. Old school.","z":"電子郵件的附件用 attached，enclosed 是紙本信用的，比較老派。","a":"audio/d11db77c3f8.mp3"},{"s":"VIC","e":"And always check your spam folder. Half of the forwarder's emails end up there.","z":"還有一定要檢查垃圾郵件匣，貨代的信有一半都跑進去。","a":"audio/d963d14d9b3.mp3"},{"s":"ELA","e":"If an email bounces back, call them. Don't wait to hear back.","z":"信被退回的話，直接打電話，別等對方回覆。","a":"audio/d406c22fab2.mp3"},{"s":"SAM","e":"What do I say in my out of office message?","z":"那我的休假自動回覆要寫什麼？","a":"audio/d623b5d7427.mp3"},{"s":"ELA","e":"\"I'm out of office until Monday. For urgent matters, please reach out to Vicky.\" Simple.","z":"「我休假到週一，緊急事項請聯絡 Vicky。」很簡單。","a":"audio/d418d767c51.mp3"},{"q":"Sam 問你怎麼寫一封請客戶回覆的信。最好的結尾？","o":[{"e":"Could you please reply by Friday? Thank you in advance. I look forward to hearing from you.","ok":true,"fb":"明確期限加禮貌結尾，最標準。","r":{"s":"ELA","e":"Perfect. Polite and clear.","z":"完美，有禮又清楚。","a":"audio/d159270c9ad.mp3"},"a":"audio/d0a3ca1e53d.mp3"},{"e":"Reply now or else.","ok":false,"fb":"像威脅，非常失禮。","r":{"s":"SAM","e":"Even I know that's bad.","z":"連我都知道那很糟。","a":"audio/da50d1bd573.mp3"},"a":"audio/d2687cf0421.mp3"},{"e":"Reply whenever. No rush.","ok":false,"fb":"沒有期限，對方會拖。","r":{"s":"VIC","e":"Then they'll reply next year.","z":"那他們明年才會回。","a":"audio/dc5a4a012d2.mp3"},"a":"audio/d0cfd3d323e.mp3"}]},{"s":"ELA","e":"Also, at your earliest convenience is polite, but it's not a deadline. Use a date.","z":"還有，「在您方便時盡早」很禮貌，但不是期限，要寫日期。","a":"audio/d5f04a192a8.mp3"},{"s":"SAM","e":"And phone calls?","z":"那電話呢？","a":"audio/de1a79eb5c7.mp3"},{"s":"ELA","e":"If someone is on another line, take a message. Or say \"Let me put you through to voicemail.\" For an international call, check the time zone first.","z":"如果對方在講別的電話，就幫忙留言，或說「我幫您轉語音信箱」。打國際電話前先查時區。","a":"audio/d352b9ae1a6.mp3"},{"s":"VIC","e":"And if the line breaks up, say \"Sorry, I'll call back.\" Don't shout like Fancia did.","z":"如果電話斷斷續續，就說「抱歉，我回撥給您」。別像 Fancia 那樣用吼的。","a":"audio/da97dd0de97.mp3"},{"s":"F","e":"I'll never live that down.","z":"這件事我一輩子都擺脫不了了。","a":"audio/ddc8add4a38.mp3"},{"s":"ELA","e":"(抱抱大家) I'll miss you. Text me photos of the office. And no conference calls on my maternity leave!","z":"（擁抱大家）我會想你們的。傳辦公室照片給我，產假期間不准找我開電話會議！","a":"audio/d2c8bf078a4.mp3"},{"s":"VIC","e":"Unless it's an emergency.","z":"除非緊急狀況。","a":"audio/dfe458743da.mp3"},{"s":"ELA","e":"Even then.","z":"那也不行。","a":"audio/defe5dd4503.mp3"},{"s":"ELA","e":"And Sam, if a client asks for something on short notice, don't promise. Let's play it by ear and check with Vicky.","z":"還有 Sam，客戶臨時要東西時別先答應，我們見機行事，跟 Vicky 確認。","a":"audio/d7590d22025.mp3"}],"h":"📍 週三下午 3:00｜出貨區・Elaine 的座位｜在場：Elaine、Sam、Vicky｜Elaine 產假前最後交接｜目標：學會交接、寫信與電話的實用說法","c":"Elaine 離開一小時後，Sam 臉色發白地走過來：「Fancia……第一批綁售的貨櫃，在新加坡港卡住了。港口壅塞，至少延誤十天。」"},{"n":58,"t":"港口壅塞","it":[{"s":"NINA","e":"Port congestion in Singapore is the worst this year. Your container is in transit, but it can't unload for ten days.","z":"新加坡港口壅塞是今年最嚴重的。你們的貨櫃在運送途中，但十天內無法卸貨。","a":"audio/da71fefdf6a.mp3"},{"s":"F","e":"Nina, you're our lead logistics provider. What are our options?","z":"Nina，你們是我們的主要物流供應商，我們有什麼選擇？","a":"audio/d4e7287eba4.mp3"},{"s":"NINA","e":"Option one: wait. Option two: move half the cargo to air freight from Taipei directly to the distribution center in Ho Chi Minh.","z":"選項一：等。選項二：一半的貨從台北直接空運到胡志明市的配送中心。","a":"audio/de1189e0701.mp3"},{"s":"VIC","e":"We have enough stock for half. But some boxes are overweight for air cargo. I'll repack them.","z":"我們的庫存夠一半，但有些箱子超過空運重量，我來重新包裝。","a":"audio/d9c54048fd9.mp3"},{"s":"SAM","e":"Do we have cargo insurance for the container?","z":"那個貨櫃有貨物保險嗎？","a":"audio/d461721081f.mp3"},{"s":"NINA","e":"Yes, it's covered. And for the last mile, our local partner can deliver directly to Halden's factory.","z":"有，有保。最後一哩路，我們當地夥伴可以直接送到 Halden 工廠。","a":"audio/da42a32ace7.mp3"},{"s":"F","e":"Who's the consignee on the paperwork?","z":"文件上的收貨人是誰？","a":"audio/d6735f639fd.mp3"},{"s":"SAM","e":"Halden Vietnam. I checked.","z":"Halden 越南，我查過了。","a":"audio/d5973798915.mp3"},{"q":"你要通知 Diana。哪種說法最好？","o":[{"e":"Diana, a quick heads-up: our container is delayed by port congestion. We'll send half by air tomorrow, so your production line won't stop. I'll share proof of delivery as soon as it arrives.","ok":true,"fb":"主動告知、說明影響與解法、承諾後續，完美示範透明溝通。","r":{"s":"DIANA","e":"Thank you for telling me first. That's why we chose you.","z":"謝謝你先告訴我，這就是我們選你們的原因。","a":"audio/d7d3a717b61.mp3"},"a":"audio/de5bcd6ff0f.mp3"},{"e":"Wait until it's fixed, then tell her.","ok":false,"fb":"等客戶自己發現，信任會崩。","r":{"s":"SAM","e":"Remember the Vexa price leak?","z":"記得 Vexa 那次價格的事嗎？","a":"audio/d665433ad04.mp3"},"a":"audio/da861fa7ee1.mp3"},{"e":"Blame the port on social media.","ok":false,"fb":"公開抱怨不專業。","r":{"s":"VIC","e":"Please don't go viral for that.","z":"拜託別因為這個爆紅。","a":"audio/d403a6a20f0.mp3"},"a":"audio/dac3c9699bd.mp3"}]},{"s":"VIC","e":"We should add this to the lessons learned for the project retrospective.","z":"這要加進專案回顧的經驗教訓裡。","a":"audio/de686c3f5b6.mp3"},{"s":"F","e":"Agreed. Also, the cold chain isn't needed for us, right?","z":"同意。另外，我們不需要冷鏈運輸吧？","a":"audio/de2a5ead3d0.mp3"},{"s":"NINA","e":"No, electronics are fine at normal temperature. Cold chain is for food and medicine.","z":"不用，電子產品常溫就行，冷鏈是給食品和藥品用的。","a":"audio/d44e5c02675.mp3"},{"s":"SAM","e":"(群組) Team, heads down today. Air cargo leaves at 9 pm.","z":"（群組）各位，今天埋頭苦幹，空運晚上九點起飛。","a":"audio/de2dcc060e1.mp3"},{"s":"VIC","e":"(群組) Pizza at 7. Ben's paying.","z":"（群組）七點吃披薩，Ben 請客。","a":"audio/d8864347d67.mp3"},{"s":"BEN","e":"(群組) I am?","z":"（群組）我請？","a":"audio/ddc41c4ab84.mp3"},{"s":"VIC","e":"(群組) You are.","z":"（群組）你請。","a":"audio/d4400bbca91.mp3"},{"s":"F","e":"Let's debrief tomorrow and get Ben up to speed. Good news: we're not back to square one.","z":"明天做個檢討，讓 Ben 跟上進度。好消息是：我們沒有回到原點。","a":"audio/d9bf5d8f68d.mp3"}],"h":"📍 週四早上 8:00｜物流作戰室｜在場：Sam、Vicky、物流供應商的 Nina（視訊）｜第一批貨卡港｜目標：找出替代路線，向客戶透明說明","c":"凌晨一點，空運的貨順利起飛。你正要回家，Sharon 打來：「明天的季度業務檢討會，Halden 的陳總要親自出席。他說——要看你們的簡報，再決定要不要續約第二年。」"},{"n":59,"t":"季度業務檢討","it":[{"s":"DIANA","e":"Thanks, everyone. Sharon is dialing in from Singapore. Can everyone on the video conference mute when not speaking?","z":"謝謝各位。Sharon 從新加坡連線。視訊會議的各位，不發言時請靜音。","a":"audio/d28da3137e2.mp3"},{"s":"F","e":"Thank you, Mr. Chen. Here's our slide deck. I'll keep it to twenty minutes, then a Q&A. There's a handout with the key figures.","z":"謝謝陳總。這是我們的簡報，我控制在二十分鐘，然後問答。講義上有關鍵數字。","a":"audio/d94d831862c.mp3"},{"s":"F","e":"To illustrate our progress, look at this trend line. On-time delivery rose, then leveled off at ninety-seven percent. That's a significant change from March.","z":"為了說明進展，請看這條趨勢線：準時交貨率上升，然後穩定在 97%。跟三月相比是很顯著的改變。","a":"audio/d488a5aee9d.mp3"},{"s":"F","e":"This data visualization represents your cost savings. The green area is the bundle: eight percent lower total cost.","z":"這張數據視覺化圖代表您節省的成本，綠色區塊是綁售：總成本降低 8%。","a":"audio/ddfa66a96f0.mp3"},{"s":"MR. CHEN","e":"And the port delay last week?","z":"那上週的港口延誤呢？","a":"audio/d08637f4f45.mp3"},{"s":"F","e":"Good question. We told Diana the same day and moved half the cargo by air. Your line didn't stop for one minute.","z":"好問題。我們當天就通知 Diana，並把一半的貨改空運。您的產線一分鐘都沒停。","a":"audio/d4d7e7ab6cf.mp3"},{"s":"MARCUS","e":"Can I add something? Our engineers are very happy. The firmware update was smooth.","z":"我可以補充嗎？我們工程師很滿意，韌體更新很順利。","a":"audio/d6ebc455d6f.mp3"},{"s":"F","e":"Thank you, Marcus. Our projection for next year: if we go live with the second phase, waterproof modules, you save another five percent.","z":"謝謝 Marcus。我們明年的預估：如果第二階段防水模組上線，您還能再省 5%。","a":"audio/d98a1e782ce.mp3"},{"s":"F","e":"Here's my summary slide. A quick recap: reliable delivery, lower cost, and a partner who tells you the truth.","z":"這是總結投影片。快速回顧：可靠的交貨、更低的成本，以及一個會對您說實話的夥伴。","a":"audio/d55f924ba7d.mp3"},{"q":"陳總沉默了。你要怎麼收尾最好？","o":[{"e":"Mr. Chen, the ball is in your court. Whatever you decide, we're grateful for this partnership.","ok":true,"fb":"尊重決策權，同時展現感謝與自信。","r":{"s":"MR. CHEN","e":"(微笑) You don't push. I like that.","z":"（微笑）你不逼人，我喜歡。","a":"audio/d059f4aebd4.mp3"},"a":"audio/d72ff084176.mp3"},{"e":"Please sign now. We really need this.","ok":false,"fb":"太急迫，顯得沒自信。","r":{"s":"BEN","e":"(閉上眼睛)","z":"（閉上眼睛）","a":null},"a":"audio/d50ed7a96e6.mp3"},{"e":"So… any questions? No? Okay, bye!","ok":false,"fb":"收尾太倉促。","r":{"s":"DIANA","e":"(小聲) Slow down.","z":"（小聲）慢一點。","a":"audio/d86bf0341ad.mp3"},"a":"audio/d1b013a19b0.mp3"}]},{"s":"MR. CHEN","e":"Diana, prepare the purchase order for year two. And I want Fancia as our account manager for the whole region.","z":"Diana，準備第二年的訂單。我要 Fancia 擔任我們整個區域的客戶經理。","a":"audio/da624e9ffa7.mp3"},{"s":"SHARON","e":"(視訊) Consider it done.","z":"（視訊）就這麼定了。","a":"audio/d4e4d4d1934.mp3"},{"s":"BEN","e":"(群組) WE GOT IT. Drinks tonight. On me. Don't tell Linnea.","z":"（群組）我們拿下了。今晚喝一杯，我請。別告訴 Linnea。","a":"audio/de6acf8dbb7.mp3"},{"s":"LIN","e":"(群組) I'm in this group, Ben.","z":"（群組）我也在這個群組裡，Ben。","a":"audio/dcc39c7dfde.mp3"},{"s":"MR. CHEN","e":"When is the rollout for our other factories?","z":"我們其他工廠的導入什麼時候？","a":"audio/d600032e1ef.mp3"},{"s":"F","e":"Next quarter, after this rollout is stable.","z":"下一季，等這次導入穩定後。","a":"audio/d8f2df35781.mp3"}],"h":"📍 週五早上 10:00｜Halden 台北辦公室・會議室｜在場：陳總、Diana、Marcus、Ben、Sharon（視訊）｜向陳總做季度業務檢討簡報｜目標：用數據說故事，贏得續約","c":"慶功宴上，Sharon 遞給你一個信封：「這是你的升職通知。但我還有另一個消息。下週一，Vexa 的新任亞太區總裁要來拜訪我們。」她頓了一下。「是 Leo。」"},{"n":60,"t":"新的開始（第一季完結）","it":[{"s":"GRACE","e":"Morning, Fancia. Or should I say, Sales Manager? First thing: we need to recruit your replacement. Can you write the job description by Wednesday?","z":"早，Fancia，還是該叫你業務經理？第一件事：要招募你的接替者，週三前可以寫好職務說明嗎？","a":"audio/ddc5f24ed4a.mp3"},{"s":"F","e":"Sure. I'll do the interviews myself.","z":"好，面試我親自來。","a":"audio/dc3d3895cf5.mp3"},{"s":"GRACE","e":"Also, Oren's exit interview is at eleven. He asked for you to be there.","z":"還有，Oren 的離職面談在十一點，他希望你在場。","a":"audio/dc60f6415a3.mp3"},{"d":"Fancia 主持她的第一場週會"},{"s":"F","e":"Good morning, everyone. Let's get started. We have a quorum. First, minutes approval from last week. Any objections? No? Approved.","z":"大家早，我們開始吧，人數足夠。首先，確認上週會議紀錄。有異議嗎？沒有？通過。","a":"audio/d0364c6126b.mp3"},{"s":"F","e":"Second, I'd like to make this a recurring meeting, but shorter. Thirty minutes. If we run over, we'll reschedule the rest.","z":"第二，我想把這變成固定會議，但縮短到三十分鐘。超時的話，剩下的改期。","a":"audio/d537104a6e8.mp3"},{"s":"VIC","e":"Can we call off the Friday meeting then?","z":"那週五的會可以取消嗎？","a":"audio/dd2f7aedd37.mp3"},{"s":"F","e":"Yes. Use it for client visits.","z":"可以，拿去拜訪客戶。","a":"audio/d5f946bd2ae.mp3"},{"s":"SAM","e":"How's it going so far, boss?","z":"目前感覺怎麼樣，老闆？","a":"audio/d2170ed9850.mp3"},{"s":"F","e":"Ask me on Friday.","z":"週五再問我。","a":"audio/d7199bfbcd7.mp3"},{"s":"F","e":"Our goals this quarter: client retention, a satisfaction survey for every loyal customer, and upselling the waterproof module. And every referral gets a bonus.","z":"本季目標：留住客戶、每位忠實客戶做滿意度調查，以及加售防水模組。每個轉介紹都有獎金。","a":"audio/d1512f3873a.mp3"},{"s":"LIN","e":"And the low-hanging fruit?","z":"那容易達成的目標呢？","a":"audio/d1c726df738.mp3"},{"s":"F","e":"Follow up with a client from the trade show. Hana sent a quotation request last week. Sam, can you respond promptly today?","z":"追蹤展覽上的客戶。Hana 上週送來報價請求。Sam，今天可以盡快回覆嗎？","a":"audio/d2000ed5646.mp3"},{"s":"OREN","e":"(站在門口) Look at you. You don't even need me anymore.","z":"（站在門口）看看你，你已經不需要我了。","a":"audio/ddc7bff5e73.mp3"},{"q":"Oren 最後一天。你想對他說什麼？","o":[{"e":"We'll always need you, Oren. Thank you for believing in me. Let's keep in touch, and don't forget our Friday coffee.","ok":true,"fb":"真誠感謝、保持聯繫，有溫度的告別。","r":{"s":"OREN","e":"Every Friday. I promise.","z":"每週五，我保證。","a":"audio/d42eaedff76.mp3"},"a":"audio/dfce4eee75c.mp3"},{"e":"Bye! Good luck!","ok":false,"fb":"太簡短，缺少溫度。","r":{"s":"VIC","e":"That's it?!","z":"就這樣？！","a":"audio/d647ddd216c.mp3"},"a":"audio/d8179983f88.mp3"},{"e":"Finally, your office is mine.","ok":false,"fb":"玩笑開過頭。","r":{"s":"BEN","e":"(憋笑)","z":"（憋笑）","a":null},"a":"audio/da11b9e822e.mp3"}]},{"s":"ELA","e":"(視訊) Congratulations, Fancia! I'm proud of you! The baby says hi!","z":"（視訊）恭喜你，Fancia！我以你為榮！寶寶也跟你打招呼！","a":"audio/dfe894da99c.mp3"},{"s":"BEN","e":"Alright, enough feelings. Back to work.","z":"好了，感性時間結束，回去工作。","a":"audio/de0ec604360.mp3"},{"s":"RECEP","e":"(廣播) Fancia, there's a visitor for you at reception. A Mr. Leo, from Vexa. He says it's about Halden… and about Volta.","z":"（廣播）Fancia，櫃台有訪客找你。Vexa 的 Leo 先生，他說是關於 Halden……還有 Volta 的事。","a":"audio/dbc41cf0e56.mp3"}],"h":"📍 週一早上 9:00｜台北辦公室｜在場：Ben、Oren、Linnea、Vicky、Sam、HR 的 Grace，Elaine（視訊）｜你升任業務經理的第一天，也是 Oren 的最後一天｜目標：主持第一場會議，面對新挑戰","c":"Leo 走進會議室，笑著放下一份文件：「恭喜升職。我們來談談合作吧——Vexa 剛買下了 Halden 20% 的股份。」第一季・完。"}];

function setPlayingUI(on,label){
  document.querySelectorAll('.btn.playing').forEach(b=>{b.classList.remove('playing');if(b.dataset.olab){b.innerHTML=b.dataset.olab;delete b.dataset.olab}});
  if(on&&playBtn){playBtn.dataset.olab=playBtn.innerHTML;playBtn.classList.add('playing');playBtn.innerHTML=label||'🔊 播放中…'}}

function ttsSpeak(t,rate){return new Promise(res=>{if(!synth){setPlayingUI(0);return res()}
 const u=new SpeechSynthesisUtterance(t.replace(/\b(e\.g\.)/g,'for example'));u.lang=cfg.accent;const v=pickV();if(v)u.voice=v;u.rate=rate||+cfg.rate;
 u.onend=u.onerror=()=>{setPlayingUI(0);res()};synth.speak(u)})}
function clip(t,spk){if(spk&&String(spk).startsWith('D:'))return spk.slice(2);if(typeof AUD==='undefined')return null;if(spk==='B')return AUD.b[t]||null;if(cfg.accent==='en-GB'&&AUD.g[t])return AUD.g[t];return AUD.u[t]||null}
let pend=null,tok=0;
function speak(t,rate,spk){if(!unlocked)return Promise.resolve();
 const src=clip(t,spk);rate=rate||+cfg.rate;if(pend){pend();pend=null}if(!src){setPlayingUI(1);return ttsSpeak(t,rate)}
 return new Promise(res=>{const my=++tok,a=AE;let done=false;
  const fin=()=>{if(!done){done=true;if(pend===fin)pend=null;setPlayingUI(0);res()}};pend=fin;
  const fb=()=>{if(!done&&my===tok){done=true;pend=null;setPlayingUI(0);toast('語音播放失敗，改用手機語音');ttsSpeak(t,rate).then(res)}};
  a.onended=()=>{if(my===tok)fin()};a.onerror=fb;
  a.onloadedmetadata=()=>{a.playbackRate=rate};
  a.pause();const abs=new URL(src,location.href).href;if(a.src!==abs)a.src=src;try{a.currentTime=0}catch(e){}
  curA=a;a.defaultPlaybackRate=rate;a.playbackRate=rate;a.preservesPitch=true;a.webkitPreservesPitch=true;
  setPlayingUI(1);
  const p=a.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name==='AbortError')return;fb()})})}

 if(rand)nw=shuf(nw);let ids=due.slice(0,Math.ceil(n/2)).concat(nw).slice(0,n);if(ids.length<n)ids=ids.concat(shuf(p.filter(w=>!ids.includes(w))).slice(0,n-ids.length));
 set={day:today(),cat:cfg.cat,ids:shuf(ids).map(w=>w.id),done:[]};save()}

 while(has(d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate())){c++;d.setDate(d.getDate()-1)}return c}

// ===== Learning engine v2 (successive relearning) =====
const IV2=[1,3,7,21,45];
(function migrate(){if(LS.get('srsv',1)>=2)return;Object.values(srs).forEach(s=>{const b=s.box||0;s.st=b>=6?3:b>=5?2:b>=3?1:0;s.box=s.st+2;s.p=1});LS.set('srsv',2);LS.set('srs',srs)})();
function grade(id,ok){const s=srs[id]||{box:0,due:0,r:0,x:0,st:0,p:0};const t=today();if(!log[t])log[t]={ops:0,words:[]};log[t].ops=(log[t].ops||0)+1;
 if(ok){if(!s.p){s.p=1;s.st=0}else if(s.due<=dayN()){s.st=Math.min((s.st||0)+1,IV2.length-1)}s.r=(s.r||0)+1;s.box=s.st+2;s.due=dayN()+IV2[s.st];if(!log[t].words.includes(id))log[t].words.push(id)}
 else{s.x=(s.x||0)+1;if(s.p){s.st=0;s.box=1}s.due=dayN()}
 srs[id]=s;save()}
function norm(x){return String(x).toLowerCase().replace(/[’‘`]/g,"'").replace(/\(.*?\)/g,' ').replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function answers(w){return [...new Set([wHead(w),...w.k].map(norm).filter(Boolean))]}
function checkTyped(w,v){v=norm(v);if(!v)return false;return answers(w).some(a=>{const tol=a.length<=4?0:a.length<=8?1:2;return a===v||lev(a,v)<=tol})}
function sentences(w){const out=[w.e,...w.d];SC.forEach(s=>s.l.forEach(l=>{if(wordsIn(l[1]).includes(w.id))out.push(l[1])}));return [...new Set(out)]}
function blankIn(w,t){for(const k of w.k){const r=new RegExp('\\b'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').split(' ').map(x=>x+'\\w*').join(' '),'i'),m=t.match(r);if(m)return[t.replace(m[0],'_____'),m[0],t]}return null}
function randBlank(w,avoid){const c=shuf(sentences(w)).map(t=>blankIn(w,t)).filter(Boolean);return c.find(b=>b[2]!==avoid)||c[0]||null}
function distract(w,n){const near=shuf(W.filter(x=>x.id!==w.id&&x.c===w.c&&!/\//.test(x.w)));return near.slice(0,n||3)}
// ---- session ----
let S=LS.get('tsess',null);
function saveS(){LS.set('tsess',S)}
function planToday(){const d=dayN(),p=W.filter(w=>cfg.cat==='all'||w.c===cfg.cat);
 let due=p.filter(w=>srs[w.id]&&srs[w.id].p&&srs[w.id].due<=d);
 // interleave: group by category so confusables sit next to each other
 const g={};shuf(due).forEach(w=>(g[w.c]=g[w.c]||[]).push(w));due=Object.values(g).flat().slice(0,40);
 const fresh=p.filter(w=>!srs[w.id]||!srs[w.id].p);let pref=[];const nx=typeof nextEpN==='function'&&nextEpN();
 if(nx){const ews=new Set(epWords(DRAMA.find(e=>e.n===nx)));pref=shuf(fresh.filter(w=>ews.has(w.id)))}
 const nw=[...new Set([...pref,...shuf(fresh)])].slice(0,+cfg.newCap||6);
 return{rev:due.map(w=>w.id),nw:nw.map(w=>w.id)}}
function todayPlanText(){if(S&&S.day===today()&&!S.done)return`繼續今天的練習：剩 ${S.q.length} 題`;const pl=planToday();const min=Math.max(3,Math.round(pl.rev.length*0.6+pl.nw.length*2));return`今天：複習 ${pl.rev.length} 個＋新詞 ${pl.nw.length} 個，約 ${min} 分鐘`}
const QT=['recall','listen','fill','ctx'];
function nextType(id){const s=srs[id]||{};const opts=QT.filter(t=>t!==s.lq);const t=opts[Math.random()*opts.length|0];if(srs[id]){srs[id].lq=t}return t}
function startToday(){if(!(S&&S.day===today()&&!S.done)){const pl=planToday();
  S={day:today(),rev:pl.rev,nw:pl.nw,q:[],okR:0,okN:[],tries:{},step:1,done:false};
  pl.rev.forEach(id=>S.q.push({id,k:'rev',t:nextType(id)}));
  pl.nw.forEach(id=>S.q.push({id,k:'pre'}));
  pl.nw.forEach(id=>S.q.push({id,k:'learn'}));
  pl.nw.forEach((id,i)=>S.q.push({id,k:'conf',t:i%2?'listen':'pick'}));
  pl.nw.forEach(id=>S.q.push({id,k:'fin',t:'recall'}));
  S.total=S.q.length;saveS()}
 tab='today';sessView()}
const STEPS=['複習','猜新詞','學新詞','確認','完成'];
function stepOf(k){return{rev:1,pre:2,learn:3,conf:4,fin:4}[k]||5}
function stepBar(){const cur=S.q.length?stepOf(S.q[0].k):5,pct=S.total?Math.round((S.total-S.q.length)/S.total*100):100;
 return`<div class="steps">${STEPS.map((s,i)=>`<span class="${i+1===cur?'on':i+1<cur?'past':''}">${'①②③④⑤'[i]}${s}</span>`).join('')}</div><div class="pbar" style="margin-bottom:12px"><i style="width:${pct}%"></i></div>`}
function sessView(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==='today'));stopAll();
