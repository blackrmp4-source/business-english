<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#163a5f">
<title>商務英文每日練習</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f1724;--card:#182636;--card2:#1e3148;--line:#2a415c;--txt:#e8eef6;--mut:#8fa3bb;--acc:#3b9eff;--acc2:#1f6fbf;--ok:#2ecc71;--bad:#e74c3c;--warn:#f0b429}
body{margin:0;font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#0b1220,#121c2c 40%,#0f1724);color:var(--txt);font-size:16px;min-height:100vh}
header{background:rgba(15,28,45,.92);backdrop-filter:blur(10px);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
header .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:17px;margin:0;font-weight:700}
.iconbtn{border:0;background:var(--card2);color:var(--txt);border-radius:10px;padding:8px 12px;font-size:15px}
nav{display:flex;background:rgba(15,28,45,.95);border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:4}
nav button{flex:1;border:0;background:none;padding:11px 2px;font-size:13px;color:var(--mut)}
nav button.on{color:var(--acc);font-weight:700;border-bottom:3px solid var(--acc)}
main{padding:12px;max-width:640px;margin:auto;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px #0004}
.big{font-size:28px;font-weight:700;color:#fff;margin:4px 0;letter-spacing:.3px}
.mean{font-size:19px;margin:6px 0;color:#d7e6f7}.ex{font-size:16px;color:#c5d4e6;line-height:1.55}
.tag{display:inline-block;background:#243b55;color:#9ec9ff;border-radius:10px;padding:2px 8px;font-size:12px;margin:0 4px 4px 0}
.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--acc2);color:#fff;margin:4px 4px 4px 0;font-size:15px;font-weight:600}
.btn.g{background:#1e7a45}.btn.r{background:#a33b35}.btn.l{background:#243b55;color:#d7e6f7}.btn.s{padding:7px 10px;font-size:13px;font-weight:500}
.btn.pri{background:linear-gradient(135deg,#2f8fff,#1a5fbf);font-size:17px;padding:14px;width:100%;margin:8px 0}
.btn.playing{outline:2px solid var(--warn);box-shadow:0 0 0 4px #f0b42933;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #f0b42911}}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-width:40%}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:13px;margin:6px 0;font-size:16px;color:var(--txt)}
.opt.ok{border-color:var(--ok);background:#1a3d2c}.opt.no{border-color:var(--bad);background:#3d1a1a}
.mut{color:var(--mut);font-size:13px}.hint{color:#7eb6ef;font-size:12px;margin:2px 0 8px}
.scn{background:#2a2414;border-left:4px solid var(--warn);padding:8px 10px;border-radius:8px;margin:8px 0;font-size:14px;color:#f3e2a8}
.line{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .who{min-width:28px;height:28px;border-radius:14px;background:var(--acc2);color:#fff;text-align:center;line-height:28px;font-size:13px;flex-shrink:0}
.line.B .who{background:#b8860b}.line .tx{flex:1;line-height:1.5}.line.now{background:#1a3350;margin:0 -8px;padding:10px 8px;border-radius:10px}
.hl{border-bottom:2px solid var(--warn);cursor:pointer}.hl.kn{background:#1a3d2c;border-color:var(--ok)}
.list .it{padding:10px 0;border-bottom:1px solid var(--line)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat b{display:block;font-size:22px;color:var(--acc)}
.pbar{height:8px;background:#243040;border-radius:4px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#5ad48a);width:0;transition:width .3s}
#pop{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -8px 30px #0008;padding:16px;border-radius:18px 18px 0 0;z-index:9;display:none;max-width:640px;margin:auto;border-top:1px solid var(--line)}
input[type=text],select{font:inherit;padding:10px;border:2px solid var(--line);border-radius:10px;width:100%;background:var(--card2);color:var(--txt)}
.sub{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.sub button{white-space:nowrap;border:1px solid var(--line);background:var(--card2);color:#c5d4e6;border-radius:16px;padding:7px 12px;font-size:13px}
.sub button.on{background:var(--acc2);color:#fff;border-color:var(--acc)}
#gate{position:fixed;inset:0;background:rgba(8,14,24,.88);z-index:20;display:flex;align-items:center;justify-content:center;padding:24px}
#gate .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center;max-width:320px}
#gate .box h2{margin:0 0 8px;font-size:20px}#gate .box p{color:var(--mut);margin:0 0 18px;line-height:1.5}
#drawer{position:fixed;inset:0;z-index:15;display:none}
#drawer .mask{position:absolute;inset:0;background:#000a}
#drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(340px,92vw);background:var(--card);border-left:1px solid var(--line);padding:18px;overflow:auto}
#drawer label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}
#turn{position:sticky;top:100px;z-index:3;display:none;background:linear-gradient(135deg,#8a6d12,#5c4a0a);color:#fff;text-align:center;padding:12px;border-radius:12px;margin-bottom:10px;font-weight:700;font-size:18px;box-shadow:0 6px 20px #0005}
#turn .cd{font-size:36px;display:block;margin-top:4px}
.more{margin-top:8px}.more summary{cursor:pointer;color:var(--acc);font-weight:600;padding:8px 0}
.progbox{margin:10px 0}.progbox .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:4px}
</style></head><body>
<div id="gate"><div class="box"><h2>🎧 商務英文練習</h2><p>iPhone 需先點一下才能播放聲音。<br>點下方按鈕開始，之後即可自動播放。</p><button class="btn pri" id="gateBtn" aria-label="點一下開始聽">點一下開始聽</button></div></div>
<header><div class="top"><h1>📘 商務英文每日練習</h1><button class="iconbtn" id="setBtn" type="button" aria-label="開啟設定">⚙️ 設定</button></div></header>
<nav id="nav"><button data-t="today">今日</button><button data-t="word">單詞</button><button data-t="scene">場景</button><button data-t="lib">詞庫</button><button data-t="stats">進度</button></nav>
<div id="turn"></div>
<main id="main"></main>
<div id="pop"></div>
<div id="drawer"><div class="mask" id="drawerMask"></div><div class="panel">
<h3 style="margin-top:0">設定</h3>
<label>分類</label><select id="cat"></select>
<label>每日題數</label><select id="daily"><option>10</option><option>20</option><option>30</option></select>
<label>口音</label><select id="accent"><option value="en-US">美式</option><option value="en-GB">英式</option></select>
<p class="hint">英式僅單字有獨立語音；例句與對話仍為美式。</p>
<label>語速</label><select id="rate"><option value="1">1x（預設）</option><option value="0.7">0.7x（慢）</option></select>
<label>閃卡翻開前自動播音</label><select id="autoplay"><option value="0">關閉（建議）</option><option value="1">開啟</option></select>
<label>練習範圍</label><select id="reviewOnly"><option value="0">全部單字</option><option value="1">只練待複習</option></select>
<label>收藏篩選</label><select id="favOnly"><option value="0">不限</option><option value="1">只練收藏 ★</option></select>

<hr style="border-color:var(--line);margin:16px 0">
<button class="btn l" style="width:100%" id="dlAll">⬇ 下載全部語音（約 50MB）</button>
<div class="progbox" id="dlProg" style="display:none"><div class="lbl"><span id="dlLbl">準備中…</span><span id="dlPct">0%</span></div><div class="pbar"><i id="dlBar"></i></div></div>
<p class="mut" style="margin-top:12px">下載後可離線練習已快取的語音。進度存在本機瀏覽器。</p>
<button class="btn r" style="width:100%;margin-top:16px" id="closeSet">完成</button>
</div></div>
<script>
const DATA={"cats":["會議","Email","簡報","談判","專案管理","財務／財報","客戶往來","人資","出差旅行","寒暄閒聊","科技／供應鏈","投資理財","行銷","法務／合約","客服","物流","辦公日常","電話溝通","管理領導","策略／創業","職場溝通"],"words":[{"id":0,"c":"會議","w":"agenda","m":"議程","e":"Let's go through today's agenda first.","s":"會議開始前確認討論項目時","d":["Do we have an agenda for today?","Yes, I'll share it on screen now."],"k":["agenda"]},{"id":1,"c":"會議","w":"minutes","m":"會議記錄","e":"Could you take the minutes for today's meeting?","s":"指派會議記錄人員時","d":["Who's taking the minutes today?","I can do it and send them out after."],"k":["minutes"]},{"id":2,"c":"會議","w":"action item","m":"待辦事項、行動項目","e":"I'll send out the action items after the call.","s":"會議結束整理分工時","d":["What are the action items from today?","Mark will update the budget, and I'll call the client."],"k":["action item"]},{"id":3,"c":"會議","w":"follow up (on)","m":"後續追蹤","e":"I'll follow up on the budget issue by Friday.","s":"承諾會後追蹤某件事時","d":["Any update on the contract?","Not yet, but I'll follow up on it tomorrow."],"k":["follow up"]},{"id":4,"c":"會議","w":"touch base","m":"簡短聯繫、碰個面","e":"Let's touch base again next Tuesday.","s":"約同事簡短同步進度時","d":["Can we touch base this afternoon?","Sure, how about three o'clock?"],"k":["touch base"]},{"id":5,"c":"會議","w":"circle back","m":"稍後再回來討論","e":"Can we circle back to this point later?","s":"會議中想把話題延後處理時","d":["What about the pricing issue?","Let's circle back to that after the demo."],"k":["circle back"]},{"id":6,"c":"會議","w":"on the same page","m":"想法一致、有共識","e":"I want to make sure we're all on the same page.","s":"確認團隊理解一致時","d":["Are we all on the same page about the deadline?","Yes, everything is due on the 15th."],"k":["on the same page"]},{"id":7,"c":"會議","w":"take the floor","m":"發言","e":"Jason, would you like to take the floor?","s":"主持人邀請某人發言時","d":["Lisa, would you like to take the floor?","Thank you. I'd like to share our Q3 results."],"k":["take the floor"]},{"id":8,"c":"會議","w":"wrap up","m":"收尾、總結","e":"Let's wrap up with a quick summary.","s":"會議接近尾聲時","d":["We're almost out of time.","Okay, let's wrap up and review the next steps."],"k":["wrap up"]},{"id":9,"c":"會議","w":"reschedule","m":"改期","e":"Can we reschedule the meeting to Thursday?","s":"需要更改會議時間時","d":["Something came up. Can we reschedule?","No problem. Does Thursday morning work?"],"k":["reschedule"]},{"id":10,"c":"會議","w":"quorum","m":"法定人數","e":"We don't have a quorum, so we can't vote today.","s":"董事會或正式表決前","d":["Can we vote on this now?","Not yet. We still don't have a quorum."],"k":["quorum"]},{"id":11,"c":"會議","w":"brainstorm","m":"腦力激盪","e":"Let's brainstorm some ideas for the campaign.","s":"團隊發想新點子時","d":["We need fresh ideas for the launch.","Let's brainstorm for ten minutes."],"k":["brainstorm"]},{"id":12,"c":"會議","w":"consensus","m":"共識","e":"We need to reach a consensus before the launch.","s":"需要大家同意才能推進時","d":["Can we move forward with the plan?","Only if we reach a consensus first."],"k":["consensus"]},{"id":13,"c":"會議","w":"table (a topic)","m":"擱置（美式）議題","e":"Let's table this discussion until next week.","s":"議題太複雜需延後時","d":["This is taking too long.","Agreed. Let's table it until next week."],"k":["table"]},{"id":14,"c":"會議","w":"sidetracked","m":"離題","e":"Sorry, we're getting sidetracked. Back to the agenda.","s":"會議離題要拉回時","d":["And then we talked about the holiday party...","Sorry, we're getting sidetracked. Back to the agenda."],"k":["sidetracked"]},{"id":15,"c":"會議","w":"key takeaway","m":"重點收穫","e":"The key takeaway is that we need more resources.","s":"總結會議重點時","d":["So what's the key takeaway?","We need two more engineers on this project."],"k":["key takeaway"]},{"id":16,"c":"會議","w":"dial in","m":"撥入（電話／線上會議）","e":"Please dial in five minutes early.","s":"提醒大家參加線上會議時","d":["How do I join the call?","Just dial in with the number in the invite."],"k":["dial in"]},{"id":17,"c":"會議","w":"AOB (any other business)","m":"臨時動議","e":"Is there any other business before we close?","s":"會議最後詢問其他事項時","d":["Is there any other business?","Just one thing: the office will close early Friday."],"k":["aob"]},{"id":18,"c":"Email","w":"regarding / re:","m":"關於","e":"I'm writing regarding your inquiry last week.","s":"信件開頭說明來意時","d":["What's this email about?","It's regarding the delivery delay last week."],"k":["regarding","re:"]},{"id":19,"c":"Email","w":"attached","m":"附件中的","e":"Please find the attached proposal.","s":"寄出附件文件時","d":["Did you get the proposal?","Yes, I saw the attached file. Thanks."],"k":["attached"]},{"id":20,"c":"Email","w":"cc / bcc","m":"副本／密件副本","e":"I've cc'd my manager on this email.","s":"告知已讓主管知情時","d":["Does your manager know about this?","Yes, I cc'd her on the email."],"k":["cc","bcc"]},{"id":21,"c":"Email","w":"loop in","m":"把某人加入討論","e":"Let me loop in our finance team.","s":"把相關部門拉進討論時","d":["We need someone from finance on this.","Good idea. Let me loop in Kevin."],"k":["loop in"]},{"id":22,"c":"Email","w":"heads-up","m":"事先提醒","e":"Just a heads-up: the deadline has moved up.","s":"事先提醒同事變動時","d":["Just a heads-up: the client is coming early.","Thanks. I'll get the room ready."],"k":["heads-up"]},{"id":23,"c":"Email","w":"FYI (for your information)","m":"供參考","e":"FYI, the client approved the design.","s":"分享資訊不需對方動作時","d":["FYI, the shipment arrived this morning.","Great, thanks for letting me know."],"k":["fyi"]},{"id":24,"c":"Email","w":"ASAP","m":"盡快","e":"Please confirm ASAP so we can book the venue.","s":"請對方盡快回覆時","d":["When do you need the numbers?","ASAP, if possible. The meeting is at two."],"k":["asap"]},{"id":25,"c":"Email","w":"at your earliest convenience","m":"在您方便時盡早","e":"Please reply at your earliest convenience.","s":"客氣請對方回覆時","d":["Please reply at your earliest convenience.","Of course. I'll get back to you today."],"k":["at your earliest convenience"]},{"id":26,"c":"Email","w":"clarify","m":"釐清","e":"Could you clarify the delivery terms?","s":"請對方說明不清楚的地方時","d":["Could you clarify the payment terms?","Sure. It's thirty Thanks. Could you clarify the payment terms?"],["B","Sure. Our payment terms are net thirty days."],["A","Noted. I'll loop in our finance team."],["B","Great. Please reply at your earliest convenience. I look forward to hearing from you."]]},{"t":"季度業績簡報","c":"簡報","r":["聽眾 Audience","你 You (Presenter)"],"l":[["B","Good afternoon. Let me start with a quick overview."],["B","As you can see on this chart, revenue surged in the third quarter."],["A","Could you elaborate on the reasons?"],["B","Of course. Demand for AI servers doubled, and our gross margin improved."],["A","What's the bottom line?"],["B","In a nutshell, we beat expectations. To sum up, we're raising our guidance."],["B","That's the end of my talk. Let's move on to the Q&A session."]]},{"t":"價格談判","c":"談判","r":["採購 Buyer","你 You (Seller)"],"l":[["A","Thanks for the proposal. Honestly, your price is too high for us."],["B","I understand. What did you have in mind?"],["A","If we order ten thousand units, can you give us a volume discount?"],["B","We can offer five percent. That's a big concession for us."],["A","How about we meet halfway at seven percent?"],["B","Seven percent works if you pay 30 percent upfront."],["A","Deal. Let's close the deal and sign off on the contract next week."],["B","Great. It's a win-win for both of us."]]},{"t":"客訴處理","c":"客戶往來","r":["客戶 Client","你 You"],"l":[["A","Hi, I'm calling with a complaint. The shipment arrived with a defect."],["B","I'm very sorry. We apologize for the inconvenience."],["A","We need a replacement as soon as possible."],["B","Of course. I'll expedite a replacement today and send you the tracking number."],["A","Thank you. This has happened twice."],["B","I understand. Our after-sales team will resolve the root cause. Thank you for your understanding."]]},{"t":"客戶報價與下單","c":"客戶往來","r":["客戶 Client","你 You"],"l":[["A","Could you send us a quote for five hundred units?"],["B","Sure. Our MOQ is two hundred, so that's fine. The lead time is four weeks."],["A","Can we get a sample first?"],["B","Of course. I'll mail one today."],["A","If it looks good, we'll send a purchase order."],["B","Great. We look forward to a long-term partnership."]]},{"t":"專案啟動會議","c":"專案管理","r":["專案經理 PM","你 You"],"l":[["A","Welcome to the kick-off meeting. Let's define the scope first."],["B","Is the mobile app in scope?"],["A","Not in phase one. The key deliverables are the website and a report."],["B","What's the timeline?"],["A","Eight weeks, with a milestone every two weeks. Let's add a one-week buffer."],["B","Who's in charge of testing?"],["A","I'll assign it to you. Do you have the bandwidth?"],["B","Yes, I can prioritize it."]]},{"t":"法說會與財報","c":"財務／財報","r":["分析師 Analyst","你 You (IR)"],"l":[["A","Thanks for joining the earnings call. Revenue is up 20 percent YoY."],["B","Congratulations. What drove the gross margin higher?"],["A","Better yield rates and lower costs."],["B","And EPS?"],["A","EPS beat expectations. We'll also raise CapEx next year."],["B","What's your guidance for next quarter?"],["A","We expect steady growth, with some risk from tariffs."]]},{"t":"面試","c":"人資","r":["面試官 Interviewer","你 You (Candidate)"],"l":[["A","Thanks for coming in. Tell me about yourself."],["B","Thanks for having me. I've worked in finance for five years."],["A","What's your biggest strength?"],["B","Teamwork. I'm also very deadline-driven."],["A","What are you looking for in a compensation package?"],["B","A fair salary, good benefits, and a clear career path."],["A","Great. HR will contact you about the job offer."]]},{"t":"加薪與考核","c":"人資","r":["主管 Manager","你 You"],"l":[["A","Let's start your performance review. You did great this year."],["B","Thank you. I'd like to talk about a raise."],["A","Sure. Your KPIs were strong."],["B","I also hope to get a promotion to team lead."],["A","I'll discuss it with HR. You'll hear back before the year-end bonus."]]},{"t":"機場與飯店","c":"出差旅行","r":["櫃台 Staff","你 You"],"l":[["A","Good evening. Do you have a reservation?"],["B","Yes, under Lee. I'd like to check in."],["A","Here's your key. Breakfast is from 7 to 10."],["B","Thanks. Can I get a wake-up call at six?"],["A","Of course. What time is check out?"],["B","Twelve noon. Is there a shuttle bus to the airport?"],["A","Yes, every thirty minutes."]]},{"t":"展覽上的寒暄","c":"寒暄閒聊","r":["新朋友 New contact","你 You"],"l":[["A","Hi, nice to meet you. What brings you here?"],["B","Nice to meet you too. I'm here for the trade show. What do you do?"],["A","I work in supply chain for a laptop ODM."],["B","Interesting! How's business?"],["A","Pretty good, but the chip shortage was tough."],["B","Let's grab a coffee and catch up later."],["A","Sounds good. Let's keep in touch."]]},{"t":"供應商交期協調","c":"科技／供應鏈","r":["供應商 Supplier","你 You"],"l":[["A","I'm afraid there's a delay on the wafers."],["B","What's the new lead time?"],["A","About six weeks. The factory is at full capacity."],["B","That's a problem. Our inventory is low."],["A","We can ship half now as a workaround."],["B","Okay. Please expedite the rest and keep me updated."]]},{"t":"聊投資理財","c":"投資理財","r":["朋友 Friend","你 You"],"l":[["A","The market is so volatile lately."],["B","Yes. I'm a long-term investor, so I just diversify."],["A","Do you buy individual stocks?"],["B","Mostly ETFs and some blue chips with a good dividend yield."],["A","What about bonds?"],["B","With interest rates falling, bonds look good. Asset allocation is key."]]},{"t":"新品行銷會議","c":"行銷","r":["行銷經理 Marketing Manager","你 You"],"l":[["A","Let's talk about the launch. Who's our target audience?"],["B","Young professionals. Market research shows strong demand."],["A","What's the plan to build brand awareness?"],["B","We'll work with an influencer and run ads on social media."],["A","How will we measure success?"],["B","We'll track the conversion rate and run an A/B test on the landing page."],["A","Great. Let's also prepare a press release."]]},{"t":"合約條款審閱","c":"法務／合約","r":["法務 Legal Counsel","你 You"],"l":[["A","I've reviewed the draft contract. There are two issues."],["B","What are they?"],["A","First, the penalty clause is too strict. Second, there's an exclusivity clause."],["B","Can we ask for an amendment?"],["A","Yes. Also, make sure the NDA is legally binding."],["B","Understood. What about disputes?"],["A","We suggest arbitration in Singapore, and force majeure should cover typhoons."]]},{"t":"客服電話","c":"客服","r":["客戶 Customer","你 You (Support)"],"l":[["B","Thank you for calling customer support. How can I help?"],["A","I can't log in. I already tried to reset my password."],["B","I'm sorry about that. First, I need to verify your identity. May I have your account number?"],["A","Sure, it's 4471-2208."],["B","Thank you. Let's troubleshoot step by step. I'll look into it."],["A","Thanks. If it takes long, can you give me a callback?"],["B","Of course. Is there anything else I can help with?"]]},{"t":"跨國出貨追蹤","c":"物流","r":["客戶 Buyer","你 You (Seller)"],"l":[["A","Hi, what's the ETA for our order?"],["B","The goods are in transit by sea freight. The ETA is next Friday."],["A","Have you sent the bill of lading?"],["B","Yes, with the packing list and commercial invoice."],["A","Good. Who handles customs clearance?"],["B","Our freight forwarder and customs broker will take care of it."]]},{"t":"接聽商務電話","c":"電話溝通","r":["來電者 Caller","你 You"],"l":[["B","Good morning, ABC Company. Qq speaking."],["A","Hi, I'm calling about the invoice. May I speak to Mr. Lin?"],["B","May I ask who's calling?"],["A","This is Amy from Delta Trading."],["B","I'm afraid he's on another line. Would you like to leave a message?"],["A","Yes, please ask him to call me back."],["B","Sure. Could you spell your company name, please?"]]},{"t":"一對一面談","c":"管理領導","r":["員工 Team Member","你 You (Manager)"],"l":[["B","Thanks for coming to our one-on-one. How's your workload?"],["A","To be honest, it's heavy. I'm worried about burnout."],["B","I hear you. Let's prioritize and delegate some tasks."],["A","That makes sense. Can I get some constructive feedback too?"],["B","Sure. You show great initiative. Try to keep me in the loop more."],["A","Point taken. I'll keep you posted every week."]]},{"t":"新創募資簡報","c":"策略／創業","r":["投資人 Investor","你 You (Founder)"],"l":[["A","So, what's your business model?"],["B","We sell subscriptions to small businesses."],["A","Do you have any traction?"],["B","Yes, five thousand users and strong growth every month."],["A","What's your burn rate?"],["B","About fifty thousand a month. This funding round gives us two years."],["A","And your competitive advantage?"],["B","Speed. We have a first-mover advantage in Taiwan."]]}]};

const CQ=[{"s":"The client is sick, so we need to ___ the meeting to next week.","a":"postpone","o":["cancel","suspend","delay"],"e":"postpone 是主動把活動「改到之後的時間」。cancel 是直接取消、不再舉行；suspend 多指暫停營運或權利；delay 多指「非預期地延誤」，較少用於主動改期。","f":"The client is sick, so we need to postpone the meeting to next week."},{"s":"Our flight was ___ by two hours because of the storm.","a":"delayed","o":["postponed","canceled","suspended"],"e":"delay 指非預期的延誤，航班最常用。postpone 是主動改期；canceled 是取消、不飛了；suspended 用於服務或營運暫停。","f":"Our flight was delayed by two hours because of the storm."},{"s":"Due to low ticket sales, the concert was ___. There will be no new date.","a":"canceled","o":["postponed","delayed","rescheduled"],"e":"沒有新日期＝取消 canceled。postponed / rescheduled 都表示會改到其他時間；delayed 是延誤。","f":"Due to low ticket sales, the concert was canceled. There will be no new date."},{"s":"The factory ___ production for a month after the fire.","a":"suspended","o":["postponed","canceled","delayed"],"e":"suspend 指正在進行的營運「暫停一段時間」。postpone 用於尚未開始的活動；cancel 是永久取消；delay 是延誤，不強調暫停。","f":"The factory suspended production for a month after the fire."},{"s":"Can we ___ the call to 3 p.m.? Something came up.","a":"reschedule","o":["cancel","suspend","delay"],"e":"reschedule 是「改到新時間」，最適合。cancel 取消；suspend 暫停營運；delay 雖可用但語意是延後而不指定新時間，較不自然。","f":"Can we reschedule the call to 3 p.m.? Something came up."},{"s":"I'd like to ___ my order. I don't need it anymore.","a":"cancel","o":["postpone","suspend","reschedule"],"e":"不需要了＝取消 cancel。postpone / reschedule 表示之後還要；suspend 是暫停。","f":"I'd like to cancel my order. I don't need it anymore."},{"s":"Please ___ the attached file and let me know your thoughts.","a":"review","o":["revise","preview","reread"],"e":"review 是「審閱並給意見」。revise 是修改；preview 是預先看一眼；reread 只是再讀一次，沒有給意見的意思。","f":"Please review the attached file and let me know your thoughts."},{"s":"Could you ___ the report based on my comments?","a":"revise","o":["review","preview","check"],"e":"根據意見修改＝revise。review 是審閱；preview 是預覽；check 是檢查，不含修改。","f":"Could you revise the report based on my comments?"},{"s":"Thank you for your ___. We'll reply within 24 hours.","a":"inquiry","o":["requirement","request form","complaint"],"e":"客戶來信詢問＝inquiry。requirement 是需求規格；request form 是表單；complaint 是抱怨，語氣不符。","f":"Thank you for your inquiry. We'll reply within 24 hours."},{"s":"Please ___ receipt of this email.","a":"acknowledge","o":["admit","recognize","accept"],"e":"acknowledge receipt 是固定說法「確認收到」。admit 是承認錯誤；recognize 是認出／認可；accept 是接受（提議、條件）。","f":"Please acknowledge receipt of this email."},{"s":"I'm writing to ___ our meeting on Monday at 10.","a":"confirm","o":["affirm","assure","ensure"],"e":"confirm 是確認時間、安排。affirm 是斷言、肯定；assure 是向人保證；ensure 是確保某事發生。","f":"I'm writing to confirm our meeting on Monday at 10."},{"s":"I can ___ you that the goods will arrive on time.","a":"assure","o":["ensure","insure","confirm"],"e":"assure + 人 = 向某人保證。ensure 後面接事情（ensure that...），不直接接人；insure 是投保；confirm 是確認。","f":"I can assure you that the goods will arrive on time."},{"s":"Please ___ that all doors are locked before you leave.","a":"ensure","o":["assure","insure","confirm"],"e":"ensure that... = 確保某事。assure 需要接人；insure 是保險；confirm 是事後確認，不是事前確保。","f":"Please ensure that all doors are locked before you leave."},{"s":"We need to ___ the shipment against damage.","a":"insure","o":["ensure","assure","secure"],"e":"insure 是「投保」。ensure 是確保；assure 是保證給某人；secure 是固定、取得，不是保險。","f":"We need to insure the shipment against damage."},{"s":"The new policy will ___ all employees.","a":"affect","o":["effect","infect","effort"],"e":"affect 是動詞「影響」。effect 多為名詞「效果」；infect 是感染；effort 是努力（名詞）。","f":"The new policy will affect all employees."},{"s":"The new rules will take ___ next month.","a":"effect","o":["affect","effort","impact"],"e":"take effect 是固定片語「生效」。affect 是動詞；effort 是努力；impact 不與 take 搭配成「生效」。","f":"The new rules will take effect next month."},{"s":"Sales ___ sharply in Q3, up 40 percent.","a":"rose","o":["raised","arose","lifted"],"e":"rise 是不及物「上升」（rose 為過去式）。raise 需要受詞（raise prices）；arise 是「出現（問題）」；lift 也需要受詞。","f":"Sales rose sharply in Q3, up 40 percent."},{"s":"We plan to ___ prices by five percent next year.","a":"raise","o":["rise","arise","grow"],"e":"raise 是及物「提高某物」。rise 不接受詞；arise 指問題發生；grow 多指自然成長，不用於主動調價。","f":"We plan to raise prices by five percent next year."},{"s":"If any problems ___, please contact me.","a":"arise","o":["rise","raise","happen to"],"e":"arise 指「問題、狀況出現」，正式且常用。rise 是上升；raise 要受詞；happen to 後面要接人，句構不對。","f":"If any problems arise, please contact me."},{"s":"Could you ___ me the file by email?","a":"send","o":["borrow","lend","give back"],"e":"send 是寄送。borrow 是「向別人借」；lend 是借出，但 email 文件用 send；give back 是歸還。","f":"Could you send me the file by email?"},{"s":"Can I ___ your charger for a minute?","a":"borrow","o":["lend","rent","loan"],"e":"向別人借＝borrow。lend 是借給別人；rent 是付費租；loan 多用於錢、正式借貸。","f":"Can I borrow your charger for a minute?"},{"s":"Could you ___ me your pen?","a":"lend","o":["borrow","rent","owe"],"e":"借給我＝lend me。borrow 是我向你借（Can I borrow...）；rent 是租；owe 是欠。","f":"Could you lend me your pen?"},{"s":"The meeting room can ___ up to 20 people.","a":"hold","o":["contain","include","consist"],"e":"hold 指容納人數，最自然。contain 多指裝東西／成分；include 是包含項目；consist 需接 of。","f":"The meeting room can hold up to 20 people."},{"s":"The price ___ shipping and tax.","a":"includes","o":["contains","holds","consists"],"e":"includes 是「包含（項目）」。contains 多指容器內物或成分；holds 是容納；consists 要接 of 且指組成。","f":"The price includes shipping and tax."},{"s":"The team ___ of five engineers and two designers.","a":"consists","o":["includes","contains","comprises of"],"e":"consist of 指「由…組成」。includes 不必列出全部；contains 是裝有；comprise 不加 of（comprises of 是常見錯誤）。","f":"The team consists of five engineers and two designers."},{"s":"I look forward to ___ from you.","a":"hearing","o":["hear","heard","be hearing"],"e":"look forward to 的 to 是介系詞，後接動名詞 hearing。hear 原形是常見錯誤；heard 為過去式；be hearing 句構不對。","f":"I look forward to hearing from you."},{"s":"We ___ the problem in the meeting yesterday.","a":"discussed","o":["discussed about","talked","spoke"],"e":"discuss 是及物動詞，直接接受詞，不加 about。talked 要接 about；spoke 也要加 about。","f":"We discussed the problem in the meeting yesterday."},{"s":"Let me ___ my manager before I answer.","a":"consult","o":["consult with to","advise","suggest"],"e":"consult 某人＝徵詢其意見。advise 是給建議；suggest 不接人當受詞；consult with to 文法錯誤。","f":"Let me consult my manager before I answer."},{"s":"I ___ that we hire a consultant.","a":"suggest","o":["advise","recommend to","propose to"],"e":"suggest that... 最自然。advise that 偏正式且多用於專業建議；recommend to / propose to 後面不能直接接 that 子句。","f":"I suggest that we hire a consultant."},{"s":"Our lawyer ___ us not to sign the contract.","a":"advised","o":["suggested","proposed","recommended"],"e":"advise + 人 + not to do 是正確句型。suggest / propose / recommend 不能接「人 + to do」。","f":"Our lawyer advised us not to sign the contract."},{"s":"We need to ___ a decision by Friday.","a":"make","o":["do","take on","get"],"e":"make a decision 是固定搭配。do 不和 decision 連用；take on 是承擔；get 不自然。","f":"We need to make a decision by Friday."},{"s":"Can you ___ me a favor?","a":"do","o":["make","give","take"],"e":"do someone a favor 是固定說法。make / give / take 都不和 favor 這樣搭配。","f":"Can you do me a favor?"},{"s":"I'll ___ a presentation on Monday.","a":"give","o":["make","do","say"],"e":"give a presentation 最常見（make 也可，但 give 最自然）。do 偏口語；say 不和 presentation 搭配。","f":"I'll give a presentation on Monday."},{"s":"Could you ___ the minutes today?","a":"take","o":["write down","make","do"],"e":"take minutes 是固定說法「做會議記錄」。write down 是寫下；make / do 不和 minutes 搭配。","f":"Could you take the minutes today?"},{"s":"The project is ___ schedule; we'll finish early.","a":"ahead of","o":["behind","on","in front of"],"e":"提前完成＝ahead of schedule。behind schedule 是落後；on schedule 是準時；in front of 是空間上的「在前面」。","f":"The project is ahead of schedule; we'll finish early."},{"s":"We're two weeks ___ schedule because of the supplier.","a":"behind","o":["ahead of","beyond","after"],"e":"落後進度＝behind schedule。ahead of 是超前；beyond / after 不和 schedule 這樣搭配。","f":"We're two weeks behind schedule because of the supplier."},{"s":"Please reply ___ Friday.","a":"by","o":["until","till","on to"],"e":"by + 時間 = 最遲在那時之前。until 表示持續到那時（Wait until Friday）；till 同 until；on to 文法錯誤。","f":"Please reply by Friday."},{"s":"I'll be out of office ___ October 20.","a":"until","o":["by","on","since"],"e":"until 表示狀態持續到某時。by 是截止期限；on 是在某天；since 是從過去某時起。","f":"I'll be out of office until October 20."},{"s":"I've worked here ___ 2019.","a":"since","o":["for","from","during"],"e":"since + 時間點 搭配現在完成式。for 接一段時間（for five years）；from 要搭配 to；during 是在某期間內。","f":"I've worked here since 2019."},{"s":"The office is closed ___ the holiday.","a":"during","o":["while","for","within"],"e":"during + 名詞（期間）。while 後接子句；for 接時間長度；within 是「在…之內」。","f":"The office is closed during the holiday."},{"s":"We'll deliver ___ three working days.","a":"within","o":["during","since","until"],"e":"within + 時間 = 在…之內完成。during 是在期間中；since 是從…起；until 是持續到。","f":"We'll deliver within three working days."},{"s":"Our ___ is to double revenue in two years.","a":"goal","o":["vision","mission","dream"],"e":"具體、可衡量＝goal。vision 是長遠願景；mission 是存在的使命；dream 太口語、不正式。","f":"Our goal is to double revenue in two years."},{"s":"Can you give me a rough ___ of the cost?","a":"estimate","o":["evaluation","assessment","quotation"],"e":"粗估成本＝estimate。evaluation / assessment 是評估好壞；quotation 是正式報價，不是粗估。","f":"Can you give me a rough estimate of the cost?"},{"s":"Please send us a formal ___ for 1,000 units.","a":"quotation","o":["estimate","price tag","invoice"],"e":"正式報價單＝quotation。estimate 是粗估；price tag 是商品標籤；invoice 是交貨後請款的發票。","f":"Please send us a formal quotation for 1,000 units."},{"s":"We'll send the ___ after the goods are shipped.","a":"invoice","o":["quotation","receipt","purchase order"],"e":"出貨後請款＝invoice。quotation 是報價；receipt 是付款後收據；purchase order 是買方下的訂單。","f":"We'll send the invoice after the goods are shipped."},{"s":"Here's your ___. Thank you for your payment.","a":"receipt","o":["invoice","bill of lading","quotation"],"e":"付款後給的是 receipt 收據。invoice 是請款單；bill of lading 是提單；quotation 是報價。","f":"Here's your receipt. Thank you for your payment."},{"s":"The customer sent us a ___ for 500 units.","a":"purchase order","o":["invoice","quotation","receipt"],"e":"買方下單＝purchase order。invoice 是賣方請款；quotation 是賣方報價；receipt 是收據。","f":"The customer sent us a purchase order for 500 units."},{"s":"Our ___ rose 10 percent, but costs rose even faster.","a":"revenue","o":["profit","income tax","margin"],"e":"營收＝revenue（未扣成本）。profit 是扣成本後的利潤，與句意矛盾；income tax 是所得稅；margin 是比率。","f":"Our revenue rose 10 percent, but costs rose even faster."},{"s":"After costs, our ___ was only two million.","a":"profit","o":["revenue","turnover","sales"],"e":"扣除成本後＝profit。revenue / turnover / sales 都是營收，尚未扣成本。","f":"After costs, our profit was only two million."},{"s":"The company's ___ is 30 percent, meaning it keeps 30 cents of every dollar.","a":"margin","o":["revenue","volume","price"],"e":"利潤率＝margin。revenue 是營收金額；volume 是數量；price 是售價。","f":"The company's margin is 30 percent, meaning it keeps 30 cents of every dollar."},{"s":"We're ___ budget, so we must cut costs.","a":"over","o":["above of","beyond of","out"],"e":"超出預算＝over budget。above of / beyond of 文法錯誤；out 不和 budget 這樣用。","f":"We're over budget, so we must cut costs."},{"s":"The project came in ___ budget, saving 5,000 dollars.","a":"under","o":["below of","less","lower"],"e":"低於預算＝under budget。below of 錯誤；less / lower 是形容詞或副詞，不能這樣搭配。","f":"The project came in under budget, saving 5,000 dollars."},{"s":"I'm afraid I'm not ___ to share that information.","a":"allowed","o":["permitted to","able for","let"],"e":"be allowed to 是「被允許」。permitted to 與 not 之後句構重複 to；able for 錯誤；let 不能這樣用被動。","f":"I'm afraid I'm not allowed to share that information."},{"s":"Let me ___ you to our CEO, Ms. Chen.","a":"introduce","o":["present to","show","meet"],"e":"introduce A to B 是介紹。present 偏正式頒發或簡報；show 是展示；meet 是見面，不是介紹。","f":"Let me introduce you to our CEO, Ms. Chen."},{"s":"It was nice to ___ you today.","a":"meet","o":["see you","know","introduce"],"e":"初次見面用 meet。see 用於再次見面；know 是認識（狀態）；introduce 是介紹他人。","f":"It was nice to meet you today."},{"s":"We need to ___ our market share in Japan.","a":"increase","o":["rise","arise","grow up"],"e":"及物「提高」＝increase。rise 不接受詞；arise 是出現；grow up 是人長大。","f":"We need to increase our market share in Japan."},{"s":"Please ___ the form and return it to HR.","a":"fill out","o":["fill","fill up","write in"],"e":"填寫表格＝fill out（或 fill in）。fill 只是裝滿；fill up 是加滿；write in 不是填表的說法。","f":"Please fill out the form and return it to HR."},{"s":"I'm calling to ___ about your new product.","a":"ask","o":["inquire for","request","question"],"e":"ask about 最自然。inquire 要用 inquire about；request 是要求某物；question 是質疑。","f":"I'm calling to ask about your new product."},{"s":"Could you ___ the price a little?","a":"lower","o":["reduce down","decrease to down","cheapen"],"e":"lower the price 自然。reduce down 重複；decrease to down 錯誤；cheapen 是讓東西變廉價、降低品質。","f":"Could you lower the price a little?"},{"s":"We'd like a 10 percent ___ for bulk orders.","a":"discount","o":["sale","cheap price","reduction off"],"e":"折扣＝discount。sale 是特賣活動；cheap price 不自然；reduction off 搭配錯誤。","f":"We'd like a 10 percent discount for bulk orders."},{"s":"Our products are ___ priced compared to competitors.","a":"competitively","o":["competitive","competing","competed"],"e":"修飾 priced（形容詞）要用副詞 competitively。competitive 是形容詞；competing / competed 意思不對。","f":"Our products are competitively priced compared to competitors."},{"s":"The contract will ___ on December 31.","a":"expire","o":["finish","terminate by","dead"],"e":"合約到期＝expire。finish 用於完成工作；terminate 是提前終止；dead 不能用於合約。","f":"The contract will expire on December 31."},{"s":"Either party may ___ the agreement with 30 days' notice.","a":"terminate","o":["expire","finish","end up"],"e":"主動提前終止＝terminate。expire 是自然到期，無法「主動」；finish 用於工作；end up 是最後變成。","f":"Either party may terminate the agreement with 30 days' notice."},{"s":"We'd like to ___ the contract for another year.","a":"renew","o":["extend to","repeat","restart"],"e":"續約＝renew。extend 也可但不接 to；repeat 是重複；restart 是重新啟動。","f":"We'd like to renew the contract for another year."},{"s":"Can we ___ the deadline by one week?","a":"extend","o":["renew","expand","enlarge"],"e":"延長期限＝extend。renew 是續約；expand / enlarge 是擴大規模或尺寸。","f":"Can we extend the deadline by one week?"},{"s":"We plan to ___ into Southeast Asia next year.","a":"expand","o":["extend","enlarge","spread out"],"e":"擴展市場＝expand into。extend 用於時間、期限；enlarge 是放大尺寸；spread out 是散開。","f":"We plan to expand into Southeast Asia next year."},{"s":"I need to ___ my presentation skills.","a":"improve","o":["develop up","raise","progress"],"e":"improve 是提升能力。develop 也可但不加 up；raise 是提高（價格、手）；progress 是名詞或不及物「進展」。","f":"I need to improve my presentation skills."},{"s":"Our team made great ___ this week.","a":"progress","o":["process","procedure","progression"],"e":"有進展＝make progress。process 是流程；procedure 是程序；progression 是遞進，較抽象。","f":"Our team made great progress this week."},{"s":"Please follow the ___ for expense claims.","a":"procedure","o":["progress","process of","proceeding"],"e":"規定步驟＝procedure。progress 是進展；process 也可但 process of 不完整；proceeding 是訴訟程序。","f":"Please follow the procedure for expense claims."},{"s":"The hiring ___ takes about four weeks.","a":"process","o":["progress","procedure for","proceed"],"e":"整個流程＝process。progress 是進度；procedure for 後缺受詞；proceed 是動詞。","f":"The hiring process takes about four weeks."},{"s":"I'm ___ in the new position. Please tell me more.","a":"interested","o":["interesting","interest","interests"],"e":"人感到有興趣＝interested。interesting 是「事物有趣」；interest / interests 是名詞或動詞原形。","f":"I'm interested in the new position. Please tell me more."},{"s":"The data was really ___. It changed our plan.","a":"interesting","o":["interested","interest","interestingly"],"e":"事物有趣＝interesting。interested 用於人的感受；interest 名詞；interestingly 副詞。","f":"The data was really interesting. It changed our plan."},{"s":"We were ___ by the poor results.","a":"disappointed","o":["disappointing","disappoint","disappointment"],"e":"人感到失望＝disappointed。disappointing 描述事物令人失望；其他是原形或名詞。","f":"We were disappointed by the poor results."},{"s":"The results were ___.","a":"disappointing","o":["disappointed","disappoint","disappointedly"],"e":"事物令人失望＝disappointing。disappointed 用於人。","f":"The results were disappointing."},{"s":"Who is ___ for the budget?","a":"responsible","o":["in charge","accountable to","charged"],"e":"be responsible for 最自然。in charge 要接 of；accountable to 是對某人負責；charged 是被收費／被起訴。","f":"Who is responsible for the budget?"},{"s":"Kevin is in ___ of the marketing team.","a":"charge","o":["responsible","lead","control"],"e":"in charge of 是固定片語「負責」。responsible / lead / control 都不能放在 in ___ of 中。","f":"Kevin is in charge of the marketing team."},{"s":"I'm ___ to inform you that your application was not successful.","a":"sorry","o":["regretful","apologize","sad"],"e":"I'm sorry to inform you 是委婉正式說法。regretful 很少這樣用（應為 I regret to）；apologize 是動詞；sad 太情緒化。","f":"I'm sorry to inform you that your application was not successful."},{"s":"We ___ for any inconvenience caused.","a":"apologize","o":["sorry","excuse","regret for"],"e":"apologize for 是正確動詞片語。sorry 是形容詞，缺 are；excuse 是原諒；regret 不加 for。","f":"We apologize for any inconvenience caused."},{"s":"Please ___ me, I have another meeting.","a":"excuse","o":["apologize","sorry","forgive about"],"e":"excuse me 用於禮貌離席。apologize 是道歉；sorry 不接 me；forgive about 錯誤。","f":"Please excuse me, I have another meeting."},{"s":"I ___ your help with this project.","a":"appreciate","o":["thank","grateful","appreciate for"],"e":"appreciate + 事物 直接接受詞。thank 接人；grateful 是形容詞；appreciate for 多了 for。","f":"I appreciate your help with this project."},{"s":"Thank you ___ your quick reply.","a":"for","o":["to","about","of"],"e":"thank you for + 事物。to / about / of 都不正確。","f":"Thank you for your quick reply."},{"s":"The meeting is ___ Monday ___ 10 a.m.","a":"on / at","o":["in / at","at / on","on / in"],"e":"星期幾用 on，幾點用 at。in 用於月份、年份或一段時間。","f":"The meeting is on Monday at 10 a.m."},{"s":"Our office is ___ the 12th floor.","a":"on","o":["in","at","to"],"e":"樓層用 on。in 用於建築物裡；at 用於地點點位；to 是方向。","f":"Our office is on the 12th floor."},{"s":"I'll call you ___ the morning.","a":"in","o":["on","at","by"],"e":"in the morning 是固定說法。on 用於特定日期；at 用於時刻；by 是期限。","f":"I'll call you in the morning."},{"s":"We've had a lot of ___ from customers.","a":"feedback","o":["feedbacks","advices","informations"],"e":"feedback 是不可數名詞，不加 s。advice、information 同樣不可數，加 s 是錯誤。","f":"We've had a lot of feedback from customers."},{"s":"Can you give me some ___ on my résumé?","a":"advice","o":["advices","advise","suggest"],"e":"建議（名詞，不可數）＝advice。advices 錯誤；advise 是動詞；suggest 是動詞。","f":"Can you give me some advice on my résumé?"},{"s":"I need more ___ about the product.","a":"information","o":["informations","inform","news"],"e":"information 不可數，不加 s。inform 是動詞；news 指新聞消息，不是產品資料。","f":"I need more information about the product."},{"s":"We have too much ___ in the warehouse.","a":"inventory","o":["inventories of","store","storage"],"e":"庫存＝inventory。inventories of 句構不對；store 是商店；storage 是儲存空間。","f":"We have too much inventory in the warehouse."},{"s":"The goods are kept in our ___ in Taoyuan.","a":"warehouse","o":["inventory","store","factory"],"e":"存放貨物的地方＝warehouse。inventory 是庫存品本身；store 是零售店；factory 是生產工廠。","f":"The goods are kept in our warehouse in Taoyuan."},{"s":"We have 500 units in ___.","a":"stock","o":["storage","store","stuck"],"e":"in stock 是固定片語「有現貨」。storage 是儲存；store 是商店；stuck 是卡住。","f":"We have 500 units in stock."},{"s":"The item is out of ___ until next month.","a":"stock","o":["store","stuck","storage"],"e":"out of stock＝缺貨。其他都不是固定搭配。","f":"The item is out of stock until next month."},{"s":"We need to ___ the shipment; the client needs it tomorrow.","a":"expedite","o":["expand","expose","export"],"e":"加急處理＝expedite。expand 擴大；expose 暴露；export 出口。","f":"We need to expedite the shipment; the client needs it tomorrow."},{"s":"Taiwan ___ a lot of semiconductors.","a":"exports","o":["expedites","expands","imports to"],"e":"出口＝exports。expedite 是加速；expand 是擴大；imports to 是進口且句構錯。","f":"Taiwan exports a lot of semiconductors."},{"s":"Our main ___ just cut prices by 20 percent.","a":"competitor","o":["competition","competence","compatriot"],"e":"競爭對手（某公司）＝competitor。competition 是競爭（抽象）；competence 是能力；compatriot 是同胞。","f":"Our main competitor just cut prices by 20 percent."},{"s":"___ in this market is very strong.","a":"Competition","o":["Competitor","Competence","Compete"],"e":"市場競爭（抽象概念）＝competition。competitor 是對手；competence 是能力；compete 是動詞。","f":"Competition in this market is very strong."},{"s":"She has strong ___ in data analysis.","a":"skills","o":["abilities in","talents to","capability"],"e":"skills in... 是最自然的說法。abilities in 少用；talents to 錯誤；capability 是單數抽象，不與 strong ... in 這樣搭配。","f":"She has strong skills in data analysis."},{"s":"We need to ___ a new supplier.","a":"find","o":["seek for","search","look"],"e":"找到＝find。seek 不加 for；search 要接 for；look 要接 for。","f":"We need to find a new supplier."},{"s":"I'm ___ a new job.","a":"looking for","o":["looking","finding","searching"],"e":"正在找＝looking for。looking 缺 for；finding 是找到的結果，不用進行式；searching 要加 for。","f":"I'm looking for a new job."},{"s":"Let's ___ the problem together.","a":"solve","o":["solute","resolve to","answer"],"e":"解決問題＝solve。solute 是溶質；resolve to 是決心去做；answer 是回答問題。","f":"Let's solve the problem together."},{"s":"We ___ the dispute without going to court.","a":"resolved","o":["solved to","dissolved","answered"],"e":"解決紛爭＝resolve a dispute。solve 多用於問題、謎題；dissolved 是溶解、解散；answered 是回答。","f":"We resolved the dispute without going to court."},{"s":"The board ___ the merger.","a":"approved","o":["approved of","proved","improved"],"e":"核准＝approve（正式批准不加 of）。approve of 是「贊同」態度；proved 是證明；improved 是改善。","f":"The board approved the merger."},{"s":"Can you ___ that the data is correct?","a":"verify","o":["clarify","certify to","justify"],"e":"核實＝verify。clarify 是釐清說明；certify 是正式認證；justify 是證明合理。","f":"Can you verify that the data is correct?"},{"s":"Could you ___ what you mean by \"soon\"?","a":"clarify","o":["verify","classify","declare"],"e":"說明清楚＝clarify。verify 是核實真偽；classify 是分類；declare 是宣布。","f":"Could you clarify what you mean by \"soon\"?"},{"s":"We had a ___ with the supplier about late delivery.","a":"dispute","o":["discussion about","disagree","quarrel"],"e":"商業糾紛＝dispute。discussion about 中性；disagree 是動詞；quarrel 偏私人吵架。","f":"We had a dispute with the supplier about late delivery."},{"s":"Let's ___ base next week to check progress.","a":"touch","o":["keep","catch","reach"],"e":"touch base 是固定片語「簡短聯繫」。keep in touch 是保持聯絡；catch up 是敘舊；reach out 是主動聯繫。","f":"Let's touch base next week to check progress."},{"s":"I'll ___ you in on the email so you know what's happening.","a":"loop","o":["keep","cc","put"],"e":"loop someone in 是「把某人拉進討論」。keep in 意思不對；cc 不接 in；put in 是放入。","f":"I'll loop you in on the email so you know what's happening."},{"s":"Let's ___ back to this topic after lunch.","a":"circle","o":["turn","come","go"],"e":"circle back 是商務慣用語「稍後再回來討論」。come back 可用但不加 to this topic 時常指人回來；turn back 是掉頭；go back 指返回原處。","f":"Let's circle back to this topic after lunch."},{"s":"Let's ___ up the meeting with a summary.","a":"wrap","o":["close","end","finish"],"e":"wrap up 是「收尾」。close up / end up / finish up 意思不同：end up 是最後變成。","f":"Let's wrap up the meeting with a summary."},{"s":"Can you bring me up to ___ on the project?","a":"speed","o":["date","line","track"],"e":"bring someone up to speed 是「幫人跟上進度」。up to date 是最新的；on track 是按進度。","f":"Can you bring me up to speed on the project?"},{"s":"Let's take this ___; it's not relevant to everyone.","a":"offline","o":["online","outside","away"],"e":"take it offline 是「會後私下討論」。online 相反；outside / away 沒有這個慣用意思。","f":"Let's take this offline; it's not relevant to everyone."},{"s":"I want to make sure we're all on the same ___.","a":"page","o":["line","side","book"],"e":"on the same page 是「想法一致」。on the same side 是同一陣營；line / book 不是慣用語。","f":"I want to make sure we're all on the same page."},{"s":"We're on ___ to finish by Friday.","a":"track","o":["time","line","schedule to"],"e":"on track 是「進度正常」。on time 是準時（單一事件）；on schedule 不加 to。","f":"We're on track to finish by Friday."},{"s":"Just a ___: the client is arriving early.","a":"heads-up","o":["warning out","notice of","reminder of"],"e":"Just a heads-up 是輕鬆的「先提醒一下」。warning out / notice of 句構錯；reminder of 後缺受詞。","f":"Just a heads-up: the client is arriving early."},{"s":"This is a friendly ___ that the invoice is due.","a":"reminder","o":["remainder","remind","memory"],"e":"提醒＝reminder。remainder 是剩餘部分（常見拼錯）；remind 是動詞；memory 是記憶。","f":"This is a friendly reminder that the invoice is due."},{"s":"Please pay the ___ of 2,000 dollars by Friday.","a":"remainder","o":["reminder","remain","rest of"],"e":"剩餘金額＝remainder（或 the rest）。reminder 是提醒；remain 是動詞；rest of 後缺受詞。","f":"Please pay the remainder of 2,000 dollars by Friday."},{"s":"Please find ___ the agenda for tomorrow.","a":"attached","o":["attaching","attach","attachment"],"e":"Please find attached... 是固定書信用法。其他詞性不對。","f":"Please find attached the agenda for tomorrow."},{"s":"I've ___ my manager on this email.","a":"cc'd","o":["copied to","carbon","added to"],"e":"cc 當動詞「副本給某人」。copied to 句構錯；carbon 是碳；added to 缺受詞。","f":"I've cc'd my manager on this email."},{"s":"We're ___ budget constraints this year.","a":"facing","o":["meeting","facing to","encountering with"],"e":"face budget constraints 自然。meet 是滿足；facing to / encountering with 多了介系詞。","f":"We're facing budget constraints this year."},{"s":"This is our ___ offer. We can't go lower.","a":"final","o":["last time","end","finally"],"e":"最終報價＝final offer。last time 是上次；end 是名詞；finally 是副詞。","f":"This is our final offer. We can't go lower."},{"s":"Price is not the ___; delivery time is.","a":"deal-breaker","o":["deadline","bottleneck","breakthrough"],"e":"導致交易破局的關鍵＝deal-breaker。deadline 是期限；bottleneck 是瓶頸；breakthrough 是突破。","f":"Price is not the deal-breaker; delivery time is."},{"s":"Testing is the ___ that slows down the whole project.","a":"bottleneck","o":["deal-breaker","milestone","deadline"],"e":"拖慢整體的環節＝bottleneck。milestone 是里程碑；deadline 是截止日。","f":"Testing is the bottleneck that slows down the whole project."},{"s":"Finishing the prototype is a major ___.","a":"milestone","o":["deadline","bottleneck","timeline"],"e":"重要階段成果＝milestone。deadline 是期限；timeline 是時程表。","f":"Finishing the prototype is a major milestone."},{"s":"The client keeps adding features. This is scope ___.","a":"creep","o":["crawl","growth","increase"],"e":"scope creep 是專案管理術語「範圍蔓延」。其他詞不構成此術語。","f":"The client keeps adding features. This is scope creep."},{"s":"Sorry, I don't have the ___ to take on another project.","a":"bandwidth","o":["band","capacity of","space"],"e":"bandwidth（餘力）是職場常用比喻。band 是樂團；capacity of 後缺名詞；space 太字面。","f":"Sorry, I don't have the bandwidth to take on another project."},{"s":"Our factory is at full ___.","a":"capacity","o":["ability","capability","volume"],"e":"產能滿載＝at full capacity。ability / capability 指能力；volume 是量，不與 at full 搭配。","f":"Our factory is at full capacity."},{"s":"We need to ___ this issue to senior management.","a":"escalate","o":["elevate","raise up","promote"],"e":"將問題上報＝escalate。elevate 多指提升地位；raise up 重複；promote 是升職或推廣。","f":"We need to escalate this issue to senior management."},{"s":"She was ___ to manager last month.","a":"promoted","o":["escalated","raised","upgraded"],"e":"升職＝be promoted。escalated 是問題升級；raised 是加薪（got a raise）；upgraded 用於產品、座位。","f":"She was promoted to manager last month."},{"s":"I got a 5 percent ___ this year.","a":"raise","o":["rise up","promotion","bonus up"],"e":"加薪＝raise（美式）。rise up 錯；promotion 是升職；bonus up 錯。","f":"I got a 5 percent raise this year."},{"s":"We ___ ten new engineers this quarter.","a":"hired","o":["employed to","fired","recruited for"],"e":"聘用＝hired。employed to 句構錯；fired 是開除；recruited for 後缺受詞。","f":"We hired ten new engineers this quarter."},{"s":"He was ___ for missing work too often.","a":"fired","o":["laid off","resigned","retired"],"e":"因個人原因被開除＝fired。laid off 是公司因經營裁員；resigned 是自己辭職；retired 是退休。","f":"He was fired for missing work too often."},{"s":"Due to the downturn, 200 workers were ___.","a":"laid off","o":["fired","resigned","quit"],"e":"因景氣裁員＝laid off。fired 是因個人表現開除；resigned / quit 是自願離職。","f":"Due to the downturn, 200 workers were laid off."},{"s":"I've decided to ___ and join another company.","a":"resign","o":["retire","lay off","fire"],"e":"主動離職＝resign。retire 是退休；lay off / fire 是被公司解僱。","f":"I've decided to resign and join another company."},{"s":"Our ___ rate is high; many people leave within a year.","a":"turnover","o":["turnaround","turnout","overturn"],"e":"離職率＝turnover rate。turnaround 是好轉或周轉時間；turnout 是出席人數；overturn 是推翻。","f":"Our turnover rate is high; many people leave within a year."},{"s":"The ___ for the event was great; over 300 people came.","a":"turnout","o":["turnover","attendance to","output"],"e":"出席人數＝turnout。turnover 是離職率；attendance to 錯；output 是產出。","f":"The turnout for the event was great; over 300 people came."},{"s":"Can you give me a ___ figure? It doesn't need to be exact.","a":"ballpark","o":["baseball","rough out","exact"],"e":"大概數字＝ballpark figure。baseball 錯；rough out 錯；exact 意思相反。","f":"Can you give me a ballpark figure? It doesn't need to be exact."},{"s":"We need ___ from the client before we launch.","a":"sign-off","o":["sign-up","sign-in","signal"],"e":"核准＝sign-off。sign-up 是註冊；sign-in 是登入；signal 是信號。","f":"We need sign-off from the client before we launch."},{"s":"Please ___ up for the training by Friday.","a":"sign","o":["log","sign off","check"],"e":"報名＝sign up。log up 錯；sign off 是批准或結束；check up 是檢查。","f":"Please sign up for the training by Friday."},{"s":"Let's ___ a compromise: 45 days instead of 60.","a":"reach","o":["arrive","get to at","make up"],"e":"reach a compromise 是自然搭配。arrive 要接 at；get to at 錯；make up 是和好或編造。","f":"Let's reach a compromise: 45 days instead of 60."},{"s":"They gave us a big ___ on delivery time.","a":"concession","o":["confession","concert","conception"],"e":"談判讓步＝concession。confession 是坦白；concert 是音樂會；conception 是概念。","f":"They gave us a big concession on delivery time."},{"s":"We have ___ because we're their biggest customer.","a":"leverage","o":["level","leave","lever up"],"e":"談判籌碼＝leverage。level 是水準；leave 是離開；lever up 錯。","f":"We have leverage because we're their biggest customer."},{"s":"This deal is good for both sides; it's a ___.","a":"win-win","o":["win-lose","zero-sum","lose-lose"],"e":"雙贏＝win-win。win-lose 一方得利；zero-sum 零和；lose-lose 雙輸。","f":"This deal is good for both sides; it's a win-win."},{"s":"Our ___ to Q3 was revenue growth of 20 percent.","a":"guidance","o":["guide","guideline","guidebook"],"e":"公司財測＝guidance。guide 是指南或導遊；guideline 是規範；guidebook 是旅遊書。","f":"Our guidance to Q3 was revenue growth of 20 percent."},{"s":"Please follow the brand ___ when making the poster.","a":"guidelines","o":["guidance","guides","guidebook"],"e":"品牌規範＝brand guidelines。guidance 是指導或財測；guides 是導遊；guidebook 是書。","f":"Please follow the brand guidelines when making the poster."},{"s":"Earnings ___ expectations, so the stock jumped.","a":"beat","o":["won","defeated","overcame"],"e":"財報優於預期＝beat expectations。won / defeated / overcame 不和 expectations 搭配。","f":"Earnings beat expectations, so the stock jumped."},{"s":"The company ___ estimates; the stock fell 8 percent.","a":"missed","o":["lost","failed","lacked"],"e":"不如預期＝missed estimates。lost / failed / lacked 不和 estimates 這樣搭配。","f":"The company missed estimates; the stock fell 8 percent."},{"s":"Revenue grew 15 percent ___, compared with the same quarter last year.","a":"year over year","o":["month over month","quarter over quarter","day to day"],"e":"和去年同期比較＝year over year（YoY）。MoM 是月增；QoQ 是季增；day to day 是日常。","f":"Revenue grew 15 percent year over year, compared with the same quarter last year."},{"s":"We expect to ___ even next year.","a":"break","o":["get","make","reach"],"e":"損益兩平＝break even。get / make / reach 不與 even 搭配。","f":"We expect to break even next year."},{"s":"Please submit your ___ report after the trip.","a":"expense","o":["expensive","expenditure","spend"],"e":"報帳＝expense report。expensive 是昂貴；expenditure 是支出（較正式，不用於此搭配）；spend 是動詞。","f":"Please submit your expense report after the trip."},{"s":"The company will ___ you for the taxi fare.","a":"reimburse","o":["refund","return","repay to"],"e":"公司報銷＝reimburse。refund 是商家退款；return 是歸還；repay to 錯。","f":"The company will reimburse you for the taxi fare."},{"s":"The store gave me a full ___ for the broken item.","a":"refund","o":["reimbursement","return","repayment"],"e":"商家退錢給消費者＝refund。reimbursement 是公司報銷；return 是退貨行為；repayment 是還款。","f":"The store gave me a full refund for the broken item."},{"s":"Can I ___ this shirt for a larger size?","a":"exchange","o":["change to","return","refund"],"e":"換貨＝exchange A for B。change to 錯；return 是退貨不換；refund 是退款。","f":"Can I exchange this shirt for a larger size?"},{"s":"The product comes with a two-year ___.","a":"warranty","o":["guarantee to","insurance","promise"],"e":"產品保固＝warranty。guarantee to 錯；insurance 是保險；promise 是承諾，不正式。","f":"The product comes with a two-year warranty."},{"s":"Please sign the ___ before we share the design.","a":"NDA","o":["MOU","PO","KPI"],"e":"保密協議＝NDA。MOU 是合作備忘錄；PO 是訂單；KPI 是績效指標。","f":"Please sign the NDA before we share the design."},{"s":"Our main ___ this year is customer retention.","a":"KPI","o":["ROI","EPS","MOQ"],"e":"績效指標＝KPI。ROI  <div class="card"><b>各分類進度</b>${CATS.map(c=>{const ws=W.filter(w=>w.c===c),s=ws.filter(w=>srs[w.id]).length;return`<p style="margin:8px 0 2px">${c} <span class="mut">${s}/${ws.length}</span></p><div class="pbar"><i style="width:${s/ws.length*100}%"></i></div>`}).join('')}</div>
 <div class="card"><b>語音</b><p class="mut">語音檔 ${typeof AUD!=='undefined'?Object.keys(AUD.u).length+Object.keys(AUD.b).length+Object.keys(AUD.g).length:'0'} 個（英式僅單字）。缺檔時改用手機語音。</p>
 <button class="btn s l" onclick="sayBtn(this,'Welcome to your daily business English practice.')">測試發音</button>
 <button class="btn s l" onclick="$('#setBtn').click()">⚙️ 開啟設定／下載語音</button>
 <button class="btn s r" onclick="if(confirm('確定清除所有學習紀錄？')){localStorage.clear();location.reload()}">清除紀錄</button></div>`}

// ---- 情境選詞 ----
let ctxQ=[],ci=0;
function cqWord(q){const a=q.a.toLowerCase();if(a in KMAP)return KMAP[a];const ws=wordsIn(q.f).filter(id=>W[id].k.some(k=>a.includes(k)||k.includes(a)));return ws.length?ws[0]:null}
function buildCtx(){const n=+cfg.daily,wr=LS.get('ctxw',[]),nc=Math.ceil(n*0.6);
 let c=shuf(wr).slice(0,Math.ceil(nc/2));c=c.concat(shuf(CQ.map((_,i)=>i).filter(i=>!c.includes(i)))).slice(0,nc).map(i=>({t:'c',i}));
 const au=shuf(set.ids.filter(id=>blank(W[id]))).slice(0,n-c.length).map(id=>({t:'a',id}));ctxQ=shuf(c.concat(au))}
function autoQ(w){const b=blank(w),pool=shuf(W.filter(x=>x.id!==w.id&&x.c===w.c&&!/\//.test(x.w))).slice(0,3);
 return{s:b[0],a:b[1],o:pool.map(x=>wHead(x)),f:w.e,e:`正確答案是「${b[1]}」（${w.m}）。適用情境：${w.s}。其他選項：`+pool.map(x=>`${wHead(x)}＝${x.m}`).join('；')+'，放進這句意思都不對。',id:w.id,sc:w.s}}
function wCtx(){if(ci>=ctxQ.length){WA().innerHTML=`<div class="card"><h3>🎉 情境選詞完成！</h3><div class="row"><button class="btn" onclick="ci=0;buildCtx();wCtx()">再來一組</button><button class="btn l" onclick="go('scene')">去場景</button></div></div>`;return}
 const it=ctxQ[ci],q=it.t==='c'?Object.assign({},CQ[it.i],{id:cqWord(CQ[it.i])}):autoQ(W[it.id]);
 const os=shuf([q.a,...q.o]);
 WA().innerHTML=`<p class="mut">第 ${ci+1}/${ctxQ.length} 題・${it.t==='c'?'精選易混淆題':'詞庫例句題'}</p><div class="card"><p>選出最適合填入空格的詞：</p>${q.sc?`<div class="scn">📍 ${esc(q.sc)}</div>`:''}<div class="ex" style="font-size:18px">${esc(q.s).replace(/___/g,'<b>_____</b>')}</div>
 ${os.map((o,j)=>`<button class="opt" data-j="${j}" data-k="${j+1}"><span class="mut">${j+1}.</span> ${esc(o)}</button>`).join('')}<div id="fb"></div></div>`;
 WA().querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const pick=os[+b.dataset.j],ok=pick===q.a;
  WA().querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(os[+x.dataset.j]===q.a)x.classList.add('ok')});if(!ok)b.classList.add('no');
  if(it.t==='c'){let wr=LS.get('ctxw',[]);wr=ok?wr.filter(i=>i!==it.i):[...new Set(wr.concat(it.i))];LS.set('ctxw',wr)}
  if(q.id!=null)grade(q.id,ok);else{const t=today();if(!log[t])log[t]={ops:0,words:[]};log[t].ops++;save()}
  stopAll();say(q.f);
  const safe=JSON.stringify(q.f).replace(/"/g,'&quot;');
  $('#fb').innerHTML=`<p>${ok?'✅ 答對了！':'❌ 正確答案：<b>'+esc(q.a)+'</b>'}</p><div class="ex">${hl(q.f)}</div>
  <div class="row"><button class="btn l" onclick="sayBtn(this,${safe})">🔊 再聽一次</button><button class="btn" onclick="ci++;wCtx()">下一題</button></div>
  <div class="scn">💡 ${esc(q.e)}</div>${!ok&&q.id!=null?'<p class="mut">已加入複習：'+esc(W[q.id].w)+'</p>':(!ok?'<p class="mut">這題會在下次情境選詞再出現</p>':'')}`;
  $('#fb').querySelectorAll('.hl').forEach(e=>e.onclick=()=>pop(+e.dataset.w))})}

// ---- download all audio ----
async function downloadAll(){if(typeof AUD==='undefined'){alert('此版本沒有語音檔');return}
 const urls=new Set();['u','b','g'].forEach(k=>Object.values(AUD[k]||{}).forEach(u=>urls.add(u)));
 const list=[...urls],box=$('#dlProg'),lbl=$('#dlLbl'),pct=$('#dlPct'),bar=$('#dlBar');
 box.style.display='block';let ok=0,fail=0;
 const cache=await caches.open('be-v4');
 for(let i=0;i<list.length;i++){const u=list[i];lbl.textContent=`下載語音 ${i+1}/${list.length}`;pct.textContent=Math.round(i/list.length*100)+'%';bar.style.width=(i/list.length*100)+'%';
  try{const abs=new URL(u,location.href).href;const hit=await cache.match(abs);if(!hit){const res=await fetch(abs);if(res.ok)await cache.put(abs,res.clone());else fail++}ok++}catch(e){fail++}
  if(i%20===0)await wait(0)}
 lbl.textContent=`完成：成功 ${ok}，失敗 ${fail}`;pct.textContent='100%';bar.style.width='100%';alert(`語音下載完成\n成功 ${ok} 個${fail?`，失敗 ${fail} 個`:''}`)}

// ---- settings drawer ----
function openSet(on){$('#drawer').style.display=on?'block':'none'}
$('#setBtn').onclick=()=>openSet(1);$('#drawerMask').onclick=()=>openSet(0);$('#closeSet').onclick=()=>openSet(0);
$('#dlAll').onclick=()=>downloadAll();

// ---- keyboard ----
document.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')return;
 if(e.code==='Space'){e.preventDefault();replay();return}
 if(e.key>='1'&&e.key<='4'){const b=document.querySelector(`.opt[data-k="${e.key}"]:not([disabled])`);if(b)b.click()}
 if(e.key==='Enter'){const n=[...document.querySelectorAll('button')].find(b=>/下一題|翻開/.test(b.textContent));if(n)n.click()}
});

$('#cat').innerHTML='<option value="all">全部</option>'+CATS.map(c=>`<option>${c}</option>`).join('');
['cat','daily','accent','rate','autoplay','reviewOnly','favOnly'].forEach(k=>{const e=$('#'+k);if(!e)return;e.value=String(cfg[k]??0);

document.addEventListener('click',e=>{const P=$('#pop');if(P.style.display==='block'&&!P.contains(e.target)&&!e.target.classList.contains('hl'))P.style.display='none'});
setupGate();
if(resumeSession()){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));render()}else go('today');
