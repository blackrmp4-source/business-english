<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#163a5f">
<title>商務英文每日練習</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f1724;--card:#182636;--card2:#1e3148;--line:#2a415c;--txt:#e8eef6;--mut:#8fa3bb;--acc:#3b9eff;--acc2:#1f6fbf;--ok:#2ecc71;--bad:#e74c3c;--warn:#f0b429}
body{margin:0;font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#0b1220,#121c2c 40%,#0f1724);color:var(--txt);font-size:16px;min-height:100vh}
header{background:rgba(15,28,45,.92);backdrop-filter:blur(10px);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
header .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:17px;margin:0;font-weight:700}
.iconbtn{border:0;background:var(--card2);color:var(--txt);border-radius:10px;padding:8px 12px;font-size:15px}
nav{display:flex;background:rgba(15,28,45,.97);border-top:1px solid var(--line);position:fixed;left:0;right:0;bottom:0;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:12px;color:var(--mut);line-height:1.3;min-height:56px}
nav button.on{color:var(--acc);font-weight:700}
main{padding:12px;max-width:640px;margin:auto;padding-bottom:96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px #0004}
.big{font-size:28px;font-weight:700;color:#fff;margin:4px 0;letter-spacing:.3px}
.mean{font-size:19px;margin:6px 0;color:#d7e6f7}.ex{font-size:16px;color:#c5d4e6;line-height:1.55}
.tag{display:inline-block;background:#243b55;color:#9ec9ff;border-radius:10px;padding:2px 8px;font-size:12px;margin:0 4px 4px 0}
.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--acc2);color:#fff;margin:4px 4px 4px 0;font-size:15px;font-weight:600}
.btn.g{background:#1e7a45}.btn.r{background:#a33b35}.btn.l{background:#243b55;color:#d7e6f7}.btn.s{padding:7px 10px;font-size:13px;font-weight:500}
.btn.pri{background:linear-gradient(135deg,#2f8fff,#1a5fbf);font-size:17px;padding:14px;width:100%;margin:8px 0}
.btn.playing{outline:2px solid var(--warn);box-shadow:0 0 0 4px #f0b42933;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #f0b42911}}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-width:40%}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:13px;margin:6px 0;font-size:16px;color:var(--txt)}
.opt.ok{border-color:var(--ok);background:#1a3d2c}.opt.no{border-color:var(--bad);background:#3d1a1a}
.mut{color:var(--mut);font-size:13px}.hint{color:#7eb6ef;font-size:12px;margin:2px 0 8px}
.scn{background:#2a2414;border-left:4px solid var(--warn);padding:8px 10px;border-radius:8px;margin:8px 0;font-size:14px;color:#f3e2a8}
.line{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .who{min-width:28px;height:28px;border-radius:14px;background:var(--acc2);color:#fff;text-align:center;line-height:28px;font-size:13px;flex-shrink:0}
.line.B .who{background:#b8860b}.line .tx{flex:1;line-height:1.5}.line.now{background:#1a3350;margin:0 -8px;padding:10px 8px;border-radius:10px}
.hl{border-bottom:2px solid var(--warn);cursor:pointer}.hl.kn{background:#1a3d2c;border-color:var(--ok)}
.list .it{padding:10px 0;border-bottom:1px solid var(--line)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat b{display:block;font-size:22px;color:var(--acc)}
.pbar{height:8px;background:#243040;border-radius:4px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#5ad48a);width:0;transition:width .3s}
#pop{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -8px 30px #0008;padding:16px;border-radius:18px 18px 0 0;z-index:9;display:none;max-width:640px;margin:auto;border-top:1px solid var(--line)}
input[type=text],select{font:inherit;padding:10px;border:2px solid var(--line);border-radius:10px;width:100%;background:var(--card2);color:var(--txt)}
.sub{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.sub button{white-space:nowrap;border:1px solid var(--line);background:var(--card2);color:#c5d4e6;border-radius:16px;padding:7px 12px;font-size:13px}
.sub button.on{background:var(--acc2);color:#fff;border-color:var(--acc)}
#gate{position:fixed;inset:0;background:rgba(8,14,24,.88);z-index:20;display:flex;align-items:center;justify-content:center;padding:24px}
#gate .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center;max-width:320px}
#gate .box h2{margin:0 0 8px;font-size:20px}#gate .box p{color:var(--mut);margin:0 0 18px;line-height:1.5}
#drawer{position:fixed;inset:0;z-index:15;display:none}
#drawer .mask{position:absolute;inset:0;background:#000a}
#drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(340px,92vw);background:var(--card);border-left:1px solid var(--line);padding:18px;overflow:auto}
#drawer label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}
#turn{position:sticky;top:60px;z-index:3;display:none;background:linear-gradient(135deg,#8a6d12,#5c4a0a);color:#fff;text-align:center;padding:12px;border-radius:12px;margin-bottom:10px;font-weight:700;font-size:18px;box-shadow:0 6px 20px #0005}
#turn .cd{font-size:36px;display:block;margin-top:4px}
.more{margin-top:8px}.more summary{cursor:pointer;color:var(--acc);font-weight:600;padding:8px 0}
.progbox{margin:10px 0}.progbox .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:4px}
.steps{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:4px 0 6px}.steps span.on{color:#fff;font-weight:700}.steps span.past{color:var(--ok)}
.task{min-height:300px}.task .opt{min-height:54px;font-size:17px}
.fbx{background:var(--card2);border-radius:12px;padding:12px;margin:10px 0;font-size:16px}.fbx.ok{background:#1a3d2c}.fbx.no{background:#3d1a1a}
.rate{display:flex;gap:8px}.rate .btn{flex:1;min-height:52px;font-size:16px}
.hintbox{color:var(--warn);font-size:20px;letter-spacing:2px;min-height:28px;margin:8px 0}
.big-play{width:100%;min-height:64px;font-size:20px}
.btn.huge{min-height:64px;font-size:20px}.hero{text-align:center;padding:28px 18px}.plan{color:#cfe0f5;font-size:16px;margin:0 0 14px}
#task input[type=text],.task input[type=text]{font-size:18px;min-height:52px;margin:8px 0}
.ev{border-bottom:2px dotted #9b8cff;cursor:pointer}.evdemo{border-bottom:2px dotted #9b8cff}
.dl{display:flex;gap:8px;align-items:flex-start;padding:10px 6px;border-bottom:1px dashed var(--line)}.dl.me{background:#14304d;border-radius:10px}
.dl.now{background:#1a3350;border-radius:10px}.who2{min-width:34px;height:34px;border-radius:17px;color:#fff;text-align:center;line-height:34px;font-size:12px;flex-shrink:0}
.dl .tx{flex:1}.dl .nm{font-size:12px;color:#9ec9ff;margin-bottom:2px}.dl .en{font-size:17px;line-height:1.5}.dl .dz{font-size:14px;margin-top:3px}.dl .pl{flex:0 0 auto;margin:0}
.dd{color:var(--warn);font-size:14px;padding:8px 4px}.dq{border-color:var(--acc)}.cliff{background:#2a1f33;border-color:#6c4a8a}.ep.lock{opacity:.45}.ep{cursor:pointer}
.abbr{background:#13283f;border-left:4px solid var(--acc);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}.abbr>div+div{margin-top:6px}
</style></head><body>
<div id="gate"><div class="box"><h2>🎧 商務英文練習</h2><p>iPhone 需先點一下才能播放聲音。<br>點下方按鈕開始，之後即可自動播放。</p><button class="btn pri" id="gateBtn" aria-label="點一下開始聽">點一下開始聽</button></div></div>
<header><div class="top"><h1>📘 商務英文每日練習</h1><button class="iconbtn" id="setBtn" type="button" aria-label="開啟設定">⚙️ 設定</button></div></header>
<nav id="nav"><button data-t="today">🏠<br>今日</button><button data-t="drama">🎬<br>劇場</button><button data-t="lib">📚<br>詞庫</button><button data-t="stats">📈<br>進度</button></nav>
<div id="turn"></div>
<main id="main"></main>
<div id="pop"></div>
<div id="drawer"><div class="mask" id="drawerMask"></div><div class="panel">
<h3 style="margin-top:0">設定</h3>
<label>分類</label><select id="cat"></select>
<label>每日題數（更多模式）</label><select id="daily"><option>10</option><option>20</option><option>30</option></select>
<label>口音</label><select id="accent"><option value="en-US">美式</option><option value="en-GB">英式</option></select>
<p class="hint">英式僅單字有獨立語音；例句與對話仍為美式。</p>
<label>語速</label><select id="rate"><option value="1">1x（預設）</option><option value="0.7">0.7x（慢）</option></select>
<label>閃卡翻開前自動播音</label><select id="autoplay"><option value="0">關閉（建議）</option><option value="1">開啟</option></select>
<label>每日新詞上限</label><select id="newCap"><option value="5">5 個</option><option value="6">6 個（預設）</option><option value="8">8 個</option></select>
<label>練習範圍（更多模式）</label><select id="reviewOnly"><option value="0">全部單字</option><option value="1">只練待複習</option></select>
<label>收藏篩選</label><select id="favOnly"><option value="0">不限</option><option value="1">只練收藏 ★</option></select>

<hr style="border-color:var(--line);margin:16px 0">
<button class="btn l" style="width:100%" id="dlAll">⬇ 下載全部語音（約 60MB）</button>
<div class="progbox" id="dlProg" style="display:none"><div class="lbl"><span id="dlLbl">準備中…</span><span id="dlPct">0%</span></div><div class="pbar"><i id="dlBar"></i></div></div>
<p class="mut" style="margin-top:12px">下載後可離線練習已快取的語音。進度存在本機瀏覽器。</p>
<button class="btn r" style="width:100%;margin-top:16px" id="closeSet">完成</button>
</div></div>
<script>
const DATA={"cats":["會議","Email","簡報","談判","專案管理","財務／財報","客戶往來","人資","出差旅行","寒暄閒聊","科技／供應鏈","投資理財","行銷","法務／合約","客服","物流","辦公日常","電話溝通","管理領導","策略／創業","職場溝通"],"words":[{"id":0,"c":"會議","w":"agenda","m":"議程","e":"Let's go through today's agenda first.","s":"會議開始前確認討論項目時","d":["Do we have an agenda for today?","Yes, I'll share it on screen now."],"k":["agenda"],"ab":[]},{"id":1,"c":"會議","w":"minutes","m":"會議記錄","e":"Could you take the minutes for today's meeting?","s":"指派會議記錄人員時","d":["Who's taking the minutes today?","I can do it and send them out after."],"k":["minutes"],"ab":[]},{"id":2,"c":"會議","w":"action item","m":"待辦事項、行動項目","e":"I'll send out the action items after the call.","s":"會議結束整理分工時","d":["What are the action items from today?","Mark will update the budget, and I'll call the client."],"k":["action item"],"ab":[]},{"id":3,"c":"會議","w":"follow up (on)","m":"後續追蹤","e":"I'll follow up on the budget issue by Friday.","s":"承諾會後追蹤某件事時","d":["Any update on the contract?","Not yet, but I'll follow up on it tomorrow."],"k":["follow up"],"ab":[]},{"id":4,"c":"會議","w":"touch base","m":"簡短聯繫、碰個面","e":"Let's touch base again next Tuesday.","s":"約同事簡短同步進度時","d":["Can we touch base this afternoon?","Sure, how about three o'clock?"],"k":["touch base"],"ab":[]},{"id":5,"c":"會議","w":"circle back","m":"稍後再回來討論","e":"Can we circle back to this point later?","s":"會議中想把話題延後處理時","d":["What about the pricing issue?","Let's circle back to that after the demo."],"k":["circle back"],"ab":[]},{"id":6,"c":"會議","w":"on the same page","m":"想法一致、有共識","e":"I want to make sure we're all on the same page.","s":"確認團隊理解一致時","d":["Are we all on the same page about the deadline?","Yes, everything is due on the 15th."],"k":["on the same page"],"ab":[]},{"id":7,"c":"會議","w":"take the floor","m":"發言","e":"Jason, would you like to take the floor?","s":"主持人邀請某人發言時","d":["Lisa, would you like to take the floor?","Thank you. I'd like to share our Q3 results."],"k":["take the floor"],"ab":[]},{"id":8,"c":"會議","w":"wrap up","m":"收尾、總結","e":"Let's wrap up with a quick summary.","s":"會議接近尾聲時","d":["We're almost out of time.","Okay, let's wrap up and review the next steps."],"k":["wrap up"],"ab":[]},{"id":9,"c":"會議","w":"reschedule","m":"改期","e":"Can we reschedule the meeting to Thursday?","s":"需要更改會議時間時","d":["Something came up. Can we reschedule?","No problem. Does Thursday morning work?"],"k":["reschedule"],"ab":[]},{"id":10,"c":"會議","w":"quorum","m":"法定人數","e":"We don't have a quorum, so we can't vote today.","s":"董事會或正式表決前","d":["Can we vote on this now?","Not yet. We still don't have a quorum."],"k":["quorum"],"ab":[]},{"id":11,"c":"會議","w":"brainstorm","m":"腦力激盪","e":"Let's brainstorm some ideas for the campaign.","s":"團隊發想新點子時","d":["We need fresh ideas for the launch.","Let's brainstorm for ten minutes."],"k":["brainstorm"],"ab":[]},{"id":12,"c":"會議","w":"consensus","m":"共識","e":"We need to reach a consensus before the launch.","s":"需要大家同意才能推進時","d":["Can we move forward with the plan?","Only if we reach a consensus first."],"k":["consensus"],"ab":[]},{"id":13,"c":"會議","w":"table (a topic)","m":"擱置（美式）議題","e":"Let's table this discussion until next week.","s":"議題太複雜需延後時","d":["This is taking too long.","Agreed. Let's table it until next week."],"k":["table"],"ab":[]},{"id":14,"c":"會議","w":"sidetracked","m":"離題","e":"Sorry, we're getting sidetracked. Back to the agenda.","s":"會議離題要拉回時","d":["And then we talked about the holiday party...","Sorry, we're getting sidetracked. Back to the agenda."],"k":["sidetracked"],"ab":[]},{"id":15,"c":"會議","w":"key takeaway","m":"重點收穫","e":"The key takeaway is that we need more resources.","s":"總結會議重點時","d":["So what's the key takeaway?","We need two more engineers on this project."],"k":["key takeaway"],"ab":[]},{"id":16,"c":"會議","w":"dial in","m":"撥入（電話／線上會議）","e":"Please dial in five minutes early.","s":"提醒大家參加線上會議時","d":["How do I join the call?","Just dial in with the number in the invite."],"k":["dial in"],"ab":[]},  you staying?","I booked the Hilton."],"k":["hotel booking"],"ab":[]},{"id":1011,"c":"出差旅行","w":"car rental","m":"租車","e":"I need a car rental.","s":"出差交通時","d":["How will you get around?","A car rental."],"k":["car rental"],"ab":[]},{"id":1012,"c":"寒暄閒聊","w":"nice weather","m":"好天氣","e":"Nice weather, isn't it?","s":"開場閒聊時","d":["Nice weather, isn't it?","Yes, finally sunny."],"k":["nice weather"],"ab":[]},{"id":1013,"c":"寒暄閒聊","w":"safe travels","m":"一路平安","e":"Safe travels!","s":"送別時","d":["I fly tomorrow.","Safe travels!"],"k":["safe travels"],"ab":[]},{"id":1014,"c":"科技／供應鏈","w":"data center","m":"資料中心","e":"They're building a data center.","s":"談 AI 投資時","d":["Why so many servers?","For a new data center."],"k":["data center"],"ab":[]},{"id":1015,"c":"科技／供應鏈","w":"edge computing","m":"邊緣運算","e":"Edge computing reduces delay.","s":"談技術時","d":["Why process locally?","Edge computing."],"k":["edge computing"],"ab":[]},{"id":1016,"c":"投資理財","w":"rebalance","m":"再平衡","e":"I rebalance my portfolio yearly.","s":"調整配置時","d":["How often do you adjust?","Once a year."],"k":["rebalance"],"ab":[]},{"id":1017,"c":"投資理財","w":"index fund","m":"指數型基金","e":"Index funds have low fees.","s":"推薦投資時","d":["Which fund?","A low-cost index fund."],"k":["index fund"],"ab":[]}],"scenes":[{"t":"週會進度回報","c":"會議","r":["主管 Manager","你 You"],"l":[["A","Good morning, everyone. Let's go through today's agenda."],["B","Sure. First, a status update on the website project."],["A","Are we on track?"],["B","Mostly. Testing is the bottleneck, so we're two days behind schedule."],["A","What's the workaround?"],["B","We'll allocate two more people to testing. I'll follow up on it by Friday."],["A","Good. Let's wrap up. Who's taking the minutes?"],["B","I am. I'll send out the action items after the call."]]},{"t":"線上視訊會議","c":"會議","r":["同事 Colleague","你 You"],"l":[["A","Hi, can you hear me? I think you're on mute."],["B","Sorry about that. Can you hear me now?"],["A","Yes, loud and clear. Let me share my screen."],["B","Great, I can see the slide deck."],["A","Before we start, are we all on the same page about the deadline?"],["B","Yes. Everything is due by EOD Friday."],["A","Perfect. Any blockers?"],["B","Just one. Let's take it offline after the meeting."]]},{"t":"Email 追蹤客戶","c":"Email","r":["客戶 Client","你 You"],"l":[["A","Hi, I'm writing regarding the quote you sent last week."],["B","Thank you for your inquiry. Please find the attached updated quote."],["A","Thanks. Could you clarify the payment terms?"],["B","Sure. Our payment terms are net thirty days."],["A","Noted. I'll loop in our finance team."],["B","Great. Please reply at your earliest convenience. I look forward to hearing from you."]]},{"t":"季度業績簡報","c":"簡報","r":["聽眾 Audience","你 You (Presenter)"],"l":[["B","Good afternoon. Let me start with a quick overview."],["B","As you can see on this chart, revenue surged in the third quarter."],["A","Could you elaborate on the reasons?"],["B","Of course. Demand for AI servers doubled, and our gross margin improved."],["A","What's the bottom line?"],["B","In a nutshell, we beat expectations. To sum up, we're raising our guidance."],["B","That's the end of my talk. Let's move on to the Q&A session."]]},{"t":"價格談判","c":"談判","r":["採購 Buyer","你 You (Seller)"],"l":[["A","Thanks for the proposal. Honestly, your price is too high for us."],["B","I understand. What did you have in mind?"],["A","If we order ten thousand units, can you give us a volume discount?"],["B","We can offer five percent. That's a big concession for us."],["A","How about we meet halfway at seven percent?"],["B","Seven percent works if you pay 30 percent upfront."],["A","Deal. Let's close the deal and sign off on the contract next week."],["B","Great. It's a win-win for both of us."]]},{"t":"客訴處理","c":"客戶往來","r":["客戶 Client","你 You"],"l":[["A","Hi, I'm calling with a complaint. The shipment arrived with a defect."],["B","I'm very sorry. We apologize for the inconvenience."],["A","We need a replacement as soon as possible."],["B","Of course. I'll expedite a replacement today and send you the tracking number."],["A","Thank you. This has happened twice."],["B","I understand. Our after-sales team will resolve the root cause. Thank you for your understanding."]]},{"t":"客戶報價與下單","c":"客戶往來","r":["客戶 Client","你 You"],"l":[["A","Could you send us a quote for five hundred units?"],["B","Sure. Our MOQ is two hundred, so that's fine. The lead time is four weeks."],["A","Can we get a sample first?"],["B","Of course. I'll mail one today."],["A","If it looks good, we'll send a purchase order."],["B","Great. We look forward to a long-term partnership."]]},{"t":"專案啟動會議","c":"專案管理","r":["專案經理 PM","你 You"],"l":[["A","Welcome to the kick-off meeting. Let's define the scope first."],["B","Is the mobile app in scope?"],["A","Not in phase one. The key deliverables are the website and a report."],["B","What's the timeline?"],["A","Eight weeks, with a milestone every two weeks. Let's add a one-week buffer."],["B","Who's in charge of testing?"],["A","I'll assign it to you. Do you have the bandwidth?"],["B","Yes, I can prioritize it."]]},{"t":"法說會與財報","c":"財務／財報","r":["分析師 Analyst","你 You (IR)"],"l":[["A","Thanks for joining the earnings call. Revenue is up 20 percent YoY."],["B","Congratulations. What drove the gross margin higher?"],["A","Better yield rates and lower costs."],["B","And EPS?"],["A","EPS beat expectations. We'll also raise CapEx next year."],["B","What's your guidance for next quarter?"],["A","We expect steady growth, with some risk from tariffs."]]},{"t":"面試","c":"人資","r":["面試官 Interviewer","你 You (Candidate)"],"l":[["A","Thanks for coming in. Tell me about yourself."],["B","Thanks for having me. I've worked in finance for five years."],["A","What's your biggest strength?"],["B","Teamwork. I'm also very deadline-driven."],["A","What are you looking for in a compensation package?"],["B","A fair salary, good benefits, and a clear career path."],["A","Great. HR will contact you about the job offer."]]},{"t":"加薪與考核","c":"人資","r":["主管 Manager","你 You"],"l":[["A","Let's start your performance review. You did great this year."],["B","Thank you. I'd like to talk about a raise."],["A","Sure. Your KPIs were strong."],["B","I also hope to get a promotion to team lead."],["A","I'll discuss it with HR. You'll hear back before the year-end bonus."]]},{"t":"機場與飯店","c":"出差旅行","r":["櫃台 Staff","你 You"],"l":[["A","Good evening. Do you have a reservation?"],["B","Yes, under Lee. I'd like to check in."],["A","Here's your key. Breakfast is from 7 to 10."],["B","Thanks. Can I get a wake-up call at six?"],["A","Of course. What time is check out?"],["B","Twelve noon. Is there a shuttle bus to the airport?"],["A","Yes, every thirty minutes."]]},{"t":"展覽上的寒暄","c":"寒暄閒聊","r":["新朋友 New contact","你 You"],"l":[["A","Hi, nice to meet you. What brings you here?"],["B","Nice to meet you too. I'm here for the trade show. What do you do?"],["A","I work in supply chain for a laptop ODM."],["B","Interesting! How's business?"],["A","Pretty good, but the chip shortage was tough."],["B","Let's grab a coffee and catch up later."],["A","Sounds good. Let's keep in touch."]]},{"t":"供應商交期協調","c":"科技／供應鏈","r":["供應商 Supplier","你 You"],"l":[["A","I'm afraid there's a delay on the wafers."],["B","What's the new lead time?"],["A","About six weeks. The factory is at full capacity."],["B","That's a problem. Our inventory is low."],["A","We can ship half now as a workaround."],["B","Okay. Please expedite the rest and keep me updated."]]},{"t":"聊投資理財","c":"投資理財","r":["朋友 Friend","你 You"],"l":[["A","The market is so volatile lately."],["B","Yes. I'm a long-term investor, so I just diversify."],["A","Do you buy individual stocks?"],["B","Mostly ETFs and some blue chips with a good dividend yield."],["A","What about bonds?"],["B","With interest rates falling, bonds look good. Asset allocation is key."]]},{"t":"新品行銷會議","c":"行銷","r":["行銷經理 Marketing Manager","你 You"],"l":[["A","Let's talk about the launch. Who's our target audience?"],["B","Young professionals. Market research shows strong demand."],["A","What's the plan to build brand awareness?"],["B","We'll work with an influencer and run ads on social media."],["A","How will we measure success?"],["B","We'll track the conversion rate and run an A/B test on the landing page."],["A","Great. Let's also prepare a press release."]]},{"t":"合約條款審閱","c":"法務／合約","r":["法務 Legal Counsel","你 You"],"l":[["A","I've reviewed the draft contract. There are two issues."],["B","What are they?"],["A","First, the penalty clause is too strict. Second, there's an exclusivity clause."],["B","Can we ask for an amendment?"],["A","Yes. Also, make sure the NDA is legally binding."],["B","Understood. What about disputes?"],["A","We suggest arbitration in Singapore, and force majeure should cover typhoons."]]},{"t":"客服電話","c":"客服","r":["客戶 Customer","你 You (Support)"],"l":[["B","Thank you for calling customer support. How can I help?"],["A","I can't log in. I already tried to reset my password."],["B","I'm sorry about that. First, I need to verify your identity. May I have your account number?"],["A","Sure, it's 4471-2208."],["B","Thank you. Let's troubleshoot step by step. I'll look into it."],["A","Thanks. If it takes long, can you give me a callback?"],["B","Of course. Is there anything else I can help with?"]]},{"t":"跨國出貨追蹤","c":"物流","r":["客戶 Buyer","你 You (Seller)"],"l":[["A","Hi, what's the ETA for our order?"],["B","The goods are in transit by sea freight. The ETA is next Friday."],["A","Have you sent the bill of lading?"],["B","Yes, with the packing list and commercial invoice."],["A","Good. Who handles customs clearance?"],["B","Our freight forwarder and customs broker will take care of it."]]},{"t":"接聽商務電話","c":"電話溝通","r":["來電者 Caller","你 You"],"l":[["B","Good morning, ABC Company. Qq speaking."],["A","Hi, I'm calling about the invoice. May I speak to Mr. Lin?"],["B","May I ask who's calling?"],["A","This is Amy from Delta Trading."],["B","I'm afraid he's on another line. Would you like to leave a message?"],["A","Yes, please ask him to call me back."],["B","Sure. Could you spell your company name, please?"]]},{"t":"一對一面談","c":"管理領導","r":["員工 Team Member","你 You (Manager)"],"l":[["B","Thanks for coming to our one-on-one. How's your workload?"],["A","To be honest, it's heavy. I'm worried about burnout."],["B","I hear you. Let's prioritize and delegate some tasks."],["A","That makes sense. Can I get some constructive feedback too?"],["B","Sure. You show great initiative. Try to keep me in the loop more."],["A","Point taken. I'll keep you posted every week."]]},{"t":"新創募資簡報","c":"策略／創業","r":["投資人 Investor","你 You (Founder)"],"l":[["A","So, what's your business model?"],["B","We sell subscriptions to small businesses."],["A","Do you have any traction?"],["B","Yes, five thousand users and strong growth every month."],["A","What's your burn rate?"],["B","About fifty thousand a month. This funding round gives us two years."],["A","And your competitive advantage?"],["B","Speed. We have a first-mover advantage in Taiwan."]]}]};

const CQ=[{"s":"The client is sick, so we need to ___ the meeting to next week.","a":"postpone","o":["cancel","suspend","delay"],"e":"postpone 是主動把活動「改到之後的時間」。cancel 是直接取消、不再舉行；suspend 多指暫停營運或權利；delay 多指「非預期地延誤」，較少用於主動改期。","f":"The client is sick, so we need to postpone the meeting to next week."},{"s":"Our flight was ___ by two hours because of the storm.","a":"delayed","o":["postponed","canceled","suspended"],"e":"delay 指非預期的延誤，航班最常用。postpone 是主動改期；canceled 是取消、不飛了；suspended 用於服務或營運暫停。","f":"Our flight was delayed by two hours because of the storm."},{"s":"Due to low ticket sales, the concert was ___. There will be no new date.","a":"canceled","o":["postponed","delayed","rescheduled"],"e":"沒有新日期＝取消 canceled。postponed / rescheduled 都表示會改到其他時間；delayed 是延誤。","f":"Due to low ticket sales, the concert was canceled. There will be no new date."},{"s":"The factory ___ production for a month after the fire.","a":"suspended","o":["postponed","canceled","delayed"],"e":"suspend 指正在進行的營運「暫停一段時間」。postpone 用於尚未開始的活動；cancel 是永久取消；delay 是延誤，不強調暫停。","f":"The factory suspended production for a month after the fire."},{"s":"Can we ___ the call to 3 p.m.? Something came up.","a":"reschedule","o":["cancel","suspend","delay"],"e":"reschedule 是「改到新時間」，最適合。cancel 取消；suspend 暫停營運；delay 雖可用但語意是延後而不指定新時間，較不自然。","f":"Can we reschedule the call to 3 p.m.? Something came up."},{"s":"I'd like to ___ my order. I don't need it anymore.","a":"cancel","o":["postpone","suspend","reschedule"],"e":"不需要了＝取消 cancel。postpone / reschedule 表示之後還要；suspend 是暫停。","f":"I'd like to cancel my order. I don't need it anymore."},{"s":"Please ___ the attached file and let me know your thoughts.","a":"review","o":["revise","preview","reread"],"e":"review 是「審閱並給意見」。revise 是修改；preview 是預先看一眼；reread 只是再讀一次，沒有給意見的意思。","f":"Please review the attached file and let me know your thoughts."},{"s":"Could you ___ the report based on my comments?","a":"revise","o":["review","preview","check"],"e":"根據意見修改＝revise。review 是審閱；preview 是預覽；check 是檢查，不含修改。","f":"Could you revise the report based on my comments?"},{"s":"Thank you for your ___. We'll reply within 24 hours.","a":"inquiry","o":["requirement","request form","complaint"],"e":"客戶來信詢問＝inquiry。requirement 是需求規格；request form 是表單；complaint 是抱怨，語氣不符。","f":"Thank you for your inquiry. We'll reply within 24 hours."},{"s":"Please ___ receipt of this email.","a":"acknowledge","o":["admit","recognize","accept"],"e":"acknowledge receipt 是固定說法「確認收到」。admit 是承認錯誤；recognize 是認出／認可；accept 是接受（提議、條件）。","f":"Please acknowledge receipt of this email."},{"s":"I'm writing to ___ our meeting on Monday at 10.","a":"confirm","o":["affirm","assure","ensure"],"e":"confirm 是確認時間、安排。affirm 是斷言、肯定；assure 是向人保證；ensure 是確保某事發生。","f":"I'm writing to confirm our meeting on Monday at 10."},{"s":"I can ___ you that the goods will arrive on time.","a":"assure","o":["ensure","insure","confirm"],"e":"assure + 人 = 向某人保證。ensure 後面接事情（ensure that...），不直接接人；insure 是投保；confirm 是確認。","f":"I can assure you that the goods will arrive on time."},{"s":"Please ___ that all doors are locked before you leave.","a":"ensure","o":["assure","insure","confirm"],"e":"ensure that... = 確保某事。assure 需要接人；insure 是保險；confirm 是事後確認，不是事前確保。","f":"Please ensure that all doors are locked before you leave."},{"s":"We need to ___ the shipment against damage.","a":"insure","o":["ensure","assure","secure"],"e":"insure 是「投保」。ensure 是確保；assure 是保證給某人；secure 是固定、取得，不是保險。","f":"We need to insure the shipment against damage."},{"s":"The new policy will ___ all employees.","a":"affect","o":["effect","infect","effort"],"e":"affect 是動詞「影響」。effect 多為名詞「效果」；infect 是感染；effort 是努力（名詞）。","f":"The new policy will affect all employees."},{"s":"The new rules will take ___ next month.","a":"effect","o":["affect","effort","impact"],"e":"take effect 是固定片語「生效」。affect 是動詞；effort 是努力；impact 不與 take 搭配成「生效」。","f":"The new rules will take effect next month."},{"s":"Sales ___ sharply in Q3, up 40 percent.","a":"rose","o":["raised","arose","lifted"],"e":"rise 是不及物「上升」（rose 為過去式）。raise 需要受詞（raise prices）；arise 是「出現（問題）」；lift 也需要受詞。","f":"Sales rose sharply in Q3, up 40 percent."},{"s":"We plan to ___ prices by five percent next year.","a":"raise","o":["rise","arise","grow"],"e":"raise 是及物「提高某物」。rise 不接受詞；arise 指問題發生；grow 多指自然成長，不用於主動調價。","f":"We plan to raise prices by five percent next year."},{"s":"If any problems ___, please contact me.","a":"arise","o":["rise","raise","happen to"],"e":"arise 指「問題、狀況出現」，正式且常用。rise 是上升；raise 要受詞；happen to 後面要接人，句構不對。","f":"If any problems arise, please contact me."},{"s":"Could you ___ me the file by email?","a":"send","o":["borrow","lend","give back"],"e":"send 是寄送。borrow 是「向別人借」；lend 是借出，但 email 文件用 send；give back 是歸還。","f":"Could you send me the file by email?"},{"s":"Can I ___ your charger for a minute?","a":"borrow","o":["lend","rent","loan"],"e":"向別人借＝borrow。lend 是借給別人；rent 是付費租；loan 多用於錢、正式借貸。","f":"Can I borrow your charger for a minute?"},{"s":"Could you ___ me your pen?","a":"lend","o":["borrow","rent","owe"],"e":"借給我＝lend me。borrow 是我向你借（Can I borrow...）；rent 是租；owe 是欠。","f":"Could you lend me your pen?"},{"s":"The meeting room can ___ up to 20 people.","a":"hold","o":["contain","include","consist"],"e":"hold 指容納人數，最自然。contain 多指裝東西／成分；include 是包含項目；consist 需接 of。","f":"The meeting room can hold up to 20 people."},{"s":"The price ___ shipping and tax.","a":"includes","o":["contains","holds","consists"],"e":"includes 是「包含（項目）」。contains 多指容器內物或成分；holds 是容納；consists 要接 of 且指組成。","f":"The price includes shipping and tax."},{"s":"The team ___ of five engineers and two designers.","a":"consists","o":["includes","contains","comprises of"],"e":"consist of 指「由…組成」。includes 不必列出全部；contains 是裝有；comprise 不加 of（comprises of 是常見錯誤）。","f":"The team consists of five engineers and two designers."},{"s":"I look forward to ___ from you.","a":"hearing","o":["hear","heard","be hearing"],"e":"look forward to 的 to 是介系詞，後接動名詞 hearing。hear 原形是常見錯誤；heard 為過去式；be hearing 句構不對。","f":"I look forward to hearing from you."},{"s":"We ___ the problem in the meeting yesterday.","a":"discussed","o":["discussed about","talked","spoke"],"e":"discuss 是及物動詞，直接接受詞，不加 about。talked 要接 about；spoke 也要加 about。","f":"We discussed the problem in the meeting yesterday."},{"s":"Let me ___ my manager before I answer.","a":"consult","o":["consult with to","advise","suggest"],"e":"consult 某人＝徵詢其意見。advise 是給建議；suggest 不接人當受詞；consult with to 文法錯誤。","f":"Let me consult my manager before I answer."},{"s":"I ___ that we hire a consultant.","a":"suggest","o":["advise","recommend to","propose to"],"e":"suggest that... 最自然。advise that 偏正式且多用於專業建議；recommend to / propose to 後面不能直接接 that 子句。","f":"I suggest that we hire a consultant."},{"s":"Our lawyer ___ us not to sign the contract.","a":"advised","o":["suggested","proposed","recommended"],"e":"advise + 人 + not to do 是正確句型。suggest / propose / recommend 不能接「人 + to do」。","f":"Our lawyer advised us not to sign the contract."},{"s":"We need to ___ a decision by Friday.","a":"make","o":["do","take on","get"],"e":"make a decision 是固定搭配。do 不和 decision 連用；take on 是承擔；get 不自然。","f":"We need to make a decision by Friday."},{"s":"Can you ___ me a favor?","a":"do","o":["make","give","take"],"e":"do someone a favor 是固定說法。make / give / take 都不和 favor 這樣搭配。","f":"Can you do me a favor?"},{"s":"I'll ___ a presentation on Monday.","a":"give","o":["make","do","say"],"e":"give a presentation 最常見（make 也可，但 give 最自然）。do 偏口語；say 不和 presentation 搭配。","f":"I'll give a presentation on Monday."},{"s":"Could you ___ the minutes today?","a":"take","o":["write down","make","do"],"e":"take minutes 是固定說法「做會議記錄」。write down 是寫下；make / do 不和 minutes 搭配。","f":"Could you take the minutes today?"},{"s":"The project is ___ schedule; we'll finish early.","a":"ahead of","o":["behind","on","in front of"],"e":"提前完成＝ahead of schedule。behind schedule 是落後；on schedule 是準時；in front of 是空間上的「在前面」。","f":"The project is ahead of schedule; we'll finish early."},{"s":"We're two weeks ___ schedule because of the supplier.","a":"behind","o":["ahead of","beyond","after"],"e":"落後進度＝behind schedule。ahead of 是超前；beyond / after 不和 schedule 這樣搭配。","f":"We're two weeks behind schedule because of the supplier."},{"s":"Please reply ___ Friday.","a":"by","o":["until","till","on to"],"e":"by + 時間 = 最遲在那時之前。until 表示持續到那時（Wait until Friday）；till 同 until；on to 文法錯誤。","f":"Please reply by Friday."},{"s":"I'll be out of office ___ October 20.","a":"until","o":["by","on","since"],"e":"until 表示狀態持續到某時。by 是截止期限；on 是在某天；since 是從過去某時起。","f":"I'll be out of office until October 20."},{"s":"I've worked here ___ 2019.","a":"since","o":["for","from","during"],"e":"since + 時間點 搭配現在完成式。for 接一段時間（for five years）；from 要搭配 to；during 是在某期間內。","f":"I've worked here since 2019."},{"s":"The office is closed ___ the holiday.","a":"during","o":["while","for","within"],"e":"during + 名詞（期間）。while 後接子句；for 接時間長度；within 是「在…之內」。","f":"The office is closed during the holiday."},{"s":"We'll deliver ___ three working days.","a":"within","o":["during","since","until"],"e":"within + 時間 = 在…之內完成。during 是在期間中；since 是從…起；until 是持續到。","f":"We'll deliver within three working days."},{"s":"Our ___ is to double revenue in two years.","a":"goal","o":["vision","mission","dream"],"e":"具體、可衡量＝goal。vision 是長遠願景；mission 是存在的使命；dream 太口語、不正式。","f":"Our goal is to double revenue in two years."},{"s":"Can you give me a rough ___ of the cost?","a":"estimate","o":["evaluation","assessment","quotation"],"e":"粗估成本＝estimate。evaluation / assessment 是評估好壞；quotation 是正式報價，不是粗估。","f":"Can you give me a rough estimate of the cost?"},{"s":"Please send us a formal ___ for 1,000 units.","a":"quotation","o":["estimate","price tag","invoice"],"e":"正式報價單＝quotation。estimate 是粗估；price tag 是商品標籤；invoice 是交貨後請款的發票。","f":"Please send us a formal quotation for 1,000 units."},{"s":"We'll send the ___ after the goods are shipped.","a":"invoice","o":["quotation","receipt","purchase order"],"e":"出貨後請款＝invoice。quotation 是報價；receipt 是付款後收據；purchase order 是買方下的訂單。","f":"We'll send the invoice after the goods are shipped."},{"s":"Here's your ___. Thank you for your payment.","a":"receipt","o":["invoice","bill of lading","quotation"],"e":"付款後給的是 receipt 收據。invoice 是請款單；bill of lading 是提單；quotation 是報價。","f":"Here's your receipt. Thank you for your payment."},{"s":"The customer sent us a ___ for 500 units.","a":"purchase order","o":["invoice","quotation","receipt"],"e":"買方下單＝purchase order。invoice 是賣方請款；quotation 是賣方報價；receipt 是收據。","f":"The customer sent us a purchase order for 500 units."},{"s":"Our ___ rose 10 percent, but costs rose even faster.","a":"revenue","o":["profit","income tax","margin"],"e":"營收＝revenue（未扣成本）。profit 是扣成本後的利潤，與句意矛盾；income tax 是所得稅；margin 是比率。","f":"Our revenue rose 10 percent, but costs rose even faster."},{"s":"After costs, our ___ was only two million.","a":"profit","o":["revenue","turnover","sales"],"e":"扣除成本後＝profit。revenue / turnover / sales 都是營收，尚未扣成本。","f":"After costs, our profit was only two million."},{"s":"The company's ___ is 30 percent, meaning it keeps 30 cents of every dollar.","a":"margin","o":["revenue","volume","price"],"e":"利潤率＝margin。revenue 是營收金額；volume 是數量；price 是售價。","f":"The company's margin is 30 percent, meaning it keeps 30 cents of every dollar."},{"s":"We're ___ budget, so we must cut costs.","a":"over","o":["above of","beyond of","out"],"e":"超出預算＝over budget。above of / beyond of 文法錯誤；out 不和 budget 這樣用。","f":"We're over budget, so we must cut costs."},{"s":"The project came in ___ budget, saving 5,000 dollars.","a":"under","o":["below of","less","lower"],"e":"低於預算＝under budget。below of 錯誤；less / lower 是形容詞或副詞，不能這樣搭配。","f":"The project came in under budget, saving 5,000 dollars."},{"s":"I'm afraid I'm not ___ to share that information.","a":"allowed","o":["permitted to","able for","let"],"e":"be allowed to 是「被允許」。permitted to 與 not 之後句構重複 to；able for 錯誤；let 不能這樣用被動。","f":"I'm afraid I'm not allowed to share that information."},{"s":"Let me ___ you to our CEO, Ms. Chen.","a":"introduce","o":["present to","show","meet"],"e":"introduce A to B 是介紹。present 偏正式頒發或簡報；show 是展示；meet 是見面，不是介紹。","f":"Let me introduce you to our CEO, Ms. Chen."},{"s":"It was nice to ___ you today.","a":"meet","o":["see you","know","introduce"],"e":"初次見面用 meet。see 用於再次見面；know 是認識（狀態）；introduce 是介紹他人。","f":"It was nice to meet you today."},{"s":"We need to ___ our market share in Japan.","a":"increase","o":["rise","arise","grow up"],"e":"及物「提高」＝increase。rise 不接受詞；arise 是出現；grow up 是人長大。","f":"We need to increase our market share in Japan."},{"s":"Please ___ the form and return it to HR.","a":"fill out","o":["fill","fill up","write in"],"e":"填寫表格＝fill out（或 fill in）。fill 只是裝滿；fill up 是加滿；write in 不是填表的說法。","f":"Please fill out the form and return it to HR."},{"s":"I'm calling to ___ about your new product.","a":"ask","o":["inquire for","request","question"],"e":"ask about 最自然。inquire 要用 inquire about；request 是要求某物；question 是質疑。","f":"I'm calling to ask about your new product."},{"s":"Could you ___ the price a little?","a":"lower","o":["reduce down","decrease to down","cheapen"],"e":"lower the price 自然。reduce down 重複；decrease to down 錯誤；cheapen 是讓東西變廉價、降低品質。","f":"Could you lower the price a little?"},{"s":"We'd like a 10 percent ___ for bulk orders.","a":"discount","o":["sale","cheap price","reduction off"],"e":"折扣＝discount。sale 是特賣活動；cheap price 不自然；reduction off 搭配錯誤。","f":"We'd like a 10 percent discount for bulk orders."},{"s":"Our products are ___ priced compared to competitors.","a":"competitively","o":["competitive","competing","competed"],"e":"修飾 priced（形容詞）要用副詞 competitively。competitive 是形容詞；competing / competed 意思不對。","f":"Our products are competitively priced compared to competitors."},{"s":"The contract will ___ on December 31.","a":"expire","o":["finish","terminate by","dead"],"e":"合約到期＝expire。finish 用於完成工作；terminate 是提前終止；dead 不能用於合約。","f":"The contract will expire on December 31."},{"s":"Either party may ___ the agreement with 30 days' notice.","a":"terminate","o":["expire","finish","end up"],"e":"主動提前終止＝terminate。expire 是自然到期，無法「主動」；finish 用於工作；end up 是最後變成。","f":"Either party may terminate the agreement with 30 days' notice."},{"s":"We'd like to ___ the contract for another year.","a":"renew","o":["extend to","repeat","restart"],"e":"續約＝renew。extend 也可但不接 to；repeat 是重複；restart 是重新啟動。","f":"We'd like to renew the contract for another year."},{"s":"Can we ___ the deadline by one week?","a":"extend","o":["renew","expand","enlarge"],"e":"延長期限＝extend。renew 是續約；expand / enlarge 是擴大規模或尺寸。","f":"Can we extend the deadline by one week?"},{"s":"We plan to ___ into Southeast Asia next year.","a":"expand","o":["extend","enlarge","spread out"],"e":"擴展市場＝expand into。extend 用於時間、期限；enlarge 是放大尺寸；spread out 是散開。","f":"We plan to expand into Southeast Asia next year."},{"s":"I need to ___ my presentation skills.","a":"improve","o":["develop up","raise","progress"],"e":"improve 是提升能力。develop 也可但不加 up；raise 是提高（價格、手）；progress 是名詞或不及物「進展」。","f":"I need to improve my presentation skills."},{"s":"Our team made great ___ this week.","a":"progress","o":["process","procedure","progression"],"e":"有進展＝make progress。process 是流程；procedure 是程序；progression 是遞進，較抽象。","f":"Our team made great progress this week."},{"s":"Please follow the ___ for expense claims.","a":"procedure","o":["progress","process of","proceeding"],"e":"規定步驟＝procedure。progress 是進展；process 也可但 process of 不完整；proceeding 是訴訟程序。","f":"Please follow the procedure for expense claims."},{"s":"The hiring ___ takes about four weeks.","a":"process","o":["progress","procedure for","proceed"],"e":"整個流程＝process。progress 是進度；procedure for 後缺受詞；proceed 是動詞。","f":"The hiring process takes about four weeks."},{"s":"I'm ___ in the new position. Please tell me more.","a":"interested","o":["interesting","interest","interests"],"e":"人感到有興趣＝interested。interesting 是「事物有趣」；interest / interests 是名詞或動詞原形。","f":"I'm interested in the new position. Please tell me more."},{"s":"The data was really ___. It changed our plan.","a":"interesting","o":["interested","interest","interestingly"],"e":"事物有趣＝interesting。interested 用於人的感受；interest 名詞；interestingly 副詞。","f":"The data was really interesting. It changed our plan."},{"s":"We were ___ by the poor results.","a":"disappointed","o":["disappointing","disappoint","disappointment"],"e":"人感到失望＝disappointed。disappointing 描述事物令人失望；其他是原形或名詞。","f":"We were disappointed by the poor results."},{"s":"The results were ___.","a":"disappointing","o":["disappointed","disappoint","disappointedly"],"e":"事物令人失望＝disappointing。disappointed 用於人。","f":"The results were disappointing."},{"s":"Who is ___ for the budget?","a":"responsible","o":["in charge","accountable to","charged"],"e":"be responsible for 最自然。in charge 要接 of；accountable to 是對某人負責；charged 是被收費／被起訴。","f":"Who is responsible for the budget?"},{"s":"Kevin is in ___ of the marketing team.","a":"charge","o":["responsible","lead","control"],"e":"in charge of 是固定片語「負責」。responsible / lead / control 都不能放在 in ___ of 中。","f":"Kevin is in charge of the marketing team."},{"s":"I'm ___ to inform you that your application was not successful.","a":"sorry","o":["regretful","apologize","sad"],"e":"I'm sorry to inform you 是委婉正式說法。regretful 很少這樣用（應為 I regret to）；apologize 是動詞；sad 太情緒化。","f":"I'm sorry to inform you that your application was not successful."},{"s":"We ___ for any inconvenience caused.","a":"apologize","o":["sorry","excuse","regret for"],"e":"apologize for 是正確動詞片語。sorry 是形容詞，缺 are；excuse 是原諒；regret 不加 for。","f":"We apologize for any inconvenience caused."},{"s":"Please ___ me, I have another meeting.","a":"excuse","o":["apologize","sorry","forgive about"],"e":"excuse me 用於禮貌離席。apologize 是道歉；sorry 不接 me；forgive about 錯誤。","f":"Please excuse me, I have another meeting."},{"s":"I ___ your help with this project.","a":"appreciate","o":["thank","grateful","appreciate for"],"e":"appreciate + 事物 直接接受詞。thank 接人；grateful 是形容詞；appreciate for 多了 for。","f":"I appreciate your help with this project."},{"s":"Thank you ___ your quick reply.","a":"for","o":["to","about","of"],"e":"thank you for + 事物。to / about / of 都不正確。","f":"Thank you for your quick reply."},{"s":"The meeting is ___ Monday ___ 10 a.m.","a":"on / at","o":["in / at","at / on","on / in"],"e":"星期幾用 on，幾點用 at。in 用於月份、年份或一段時間。","f":"The meeting is on Monday at 10 a.m."},{"s":"Our office is ___ the 12th floor.","a":"on","o":["in","at","to"],"e":"樓層用 on。in 用於建築物裡；at 用於地點點位；to 是方向。","f":"Our office is on the 12th floor."},{"s":"I'll call you ___ the morning.","a":"in","o":["on","at","by"],"e":"in the morning 是固定說法。on 用於特定日期；at 用於時刻；by 是期限。","f":"I'll call you in the morning."},{"s":"We've had a lot of ___ from customers.","a":"feedback","o":["feedbacks","advices","informations"],"e":"feedback 是不可數名詞，不加 s。advice、information 同樣不可數，加 s 是錯誤。","f":"We've had a lot of feedback from customers."},{"s":"Can you give me some ___ on my résumé?","a":"advice","o":["advices","advise","suggest"],"e":"建議（名詞，不可數）＝advice。advices 錯誤；advise 是動詞；suggest 是動詞。","f":"Can you give me some advice on my résumé?"},{"s":"I need more ___ about the product.","a":"information","o":["informations","inform","news"],"e":"information 不可數，不加 s。inform 是動詞；news 指新聞消息，不是產品資料。","f":"I need more information about the product."},{"s":"We have too much ___ in the warehouse.","a":"inventory","o":["inventories of","store","storage"],"e":"庫存＝inventory。inventories of 句構不對；store 是商店；storage 是儲存空間。","f":"We have too much inventory in the warehouse."},{"s":"The goods are kept in our ___ in Taoyuan.","a":"warehouse","o":["inventory","store","factory"],"e":"存放貨物的地方＝warehouse。inventory 是庫存品本身；store 是零售店；factory 是生產工廠。","f":"The goods are kept in our warehouse in Taoyuan."},{"s":"We have 500 units in ___.","a":"stock","o":["storage","store","stuck"],"e":"in stock 是固定片語「有現貨」。storage 是儲存；store 是商店；stuck 是卡住。","f":"We have 500 units in stock."},{"s":"The item is out of ___ until next month.","a":"stock","o":["store","stuck","storage"],"e":"out of stock＝缺貨。其他都不是固定搭配。","f":"The item is out of stock until next month."},{"s":"We need to ___ the shipment; the client needs it tomorrow.","a":"expedite","o":["expand","expose","export"],"e":"加急處理＝expedite。expand 擴大；expose 暴露；export 出口。","f":"We need to expedite the shipment; the client needs it tomorrow."},{"s":"Taiwan ___ a lot of semiconductors.","a":"exports","o":["expedites","expands","imports to"],"e":"出口＝exports。expedite 是加速；expand 是擴大；imports to 是進口且句構錯。","f":"Taiwan exports a lot of semiconductors."},{"s":"Our main ___ just cut prices by 20 percent.","a":"competitor","o":["competition","competence","compatriot"],"e":"競爭對手（某公司）＝competitor。competition 是競爭（抽象）；competence 是能力；compatriot 是同胞。","f":"Our main competitor just cut prices by 20 percent."},{"s":"___ in this market is very strong.","a":"Competition","o":["Competitor","Competence","Compete"],"e":"市場競爭（抽象概念）＝competition。competitor 是對手；competence 是能力；compete 是動詞。","f":"Competition in this market is very strong."},{"s":"She has strong ___ in data analysis.","a":"skills","o":["abilities in","talents to","capability"],"e":"skills in... 是最自然的說法。abilities in 少用；talents to 錯誤；capability 是單數抽象，不與 strong ... in 這樣搭配。","f":"She has strong skills in data analysis."},{"s":"We need to ___ a new supplier.","a":"find","o":["seek for","search","look"],"e":"找到＝find。seek 不加 for；search 要接 for；look 要接 for。","f":"We need to find a new supplier."},{"s":"I'm ___ a new job.","a":"looking for","o":["looking","finding","searching"],"e":"正在找＝looking for。looking 缺 for；finding 是找到的結果，不用進行式；searching 要加 for。","f":"I'm looking for a new job."},{"s":"Let's ___ the problem together.","a":"solve","o":["solute","resolve to","answer"],"e":"解決問題＝solve。solute 是溶質；resolve to 是決心去做；answer 是回答問題。","f":"Let's solve the problem together."},{"s":"We ___ the dispute without going to court.","a":"resolved","o":["solved to","dissolved","answered"],"e":"解決紛爭＝resolve a dispute。solve 多用於問題、謎題；dissolved 是溶解、解散；answered 是回答。","f":"We resolved the dispute without going to court."},{"s":"The board ___ the merger.","a":"approved","o":["approved of","proved","improved"],"e":"核准＝approve（正式批准不加 of）。approve of 是「贊同」態度；proved 是證明；improved 是改善。","f":"The board approved the merger."},{"s":"Can you ___ that the data is correct?","a":"verify","o":["clarify","certify to","justify"],"e":"核實＝verify。clarify 是釐清說明；certify 是正式認證；justify 是證明合理。","f":"Can you verify that the data is correct?"},{"s":"Could you ___ what you mean by \"soon\"?","a":"clarify","o":["verify","classify","declare"],"e":"說明清楚＝clarify。verify 是核實真偽；classify 是分類；declare 是宣布。","f":"Could you clarify what you mean by \"soon\"?"},{"s":"We had a ___ with the supplier about late delivery.","a":"dispute","o":["discussion about","disagree","quarrel"],"e":"商業糾紛＝dispute。discussion about 中性；disagree 是動詞；quarrel 偏私人吵架。","f":"We had a dispute with the supplier about late delivery."},{"s":"Let's ___ base next week to check progress.","a":"touch","o":["keep","catch","reach"],"e":"touch base 是固定片語「簡短聯繫」。keep in touch 是保持聯絡；catch up 是敘舊；reach out 是主動聯繫。","f":"Let's touch base next week to check progress."},{"s":"I'll ___ you in on the email so you know what's happening.","a":"loop","o":["keep","cc","put"],"e":"loop someone in 是「把某人拉進討論」。keep in 意思不對；cc 不接 in；put in 是放入。","f":"I'll loop you in on the email so you know what's happening."},{"s":"Let's ___ back to this topic after lunch.","a":"circle","o":["turn","come","go"],"e":"circle back 是商務慣用語「稍後再回來討論」。come back 可用但不加 to this topic 時常指人回來；turn back 是掉頭；go back 指返回原處。","f":"Let's circle back to this topic after lunch."},{"s":"Let's ___ up the meeting with a summary.","a":"wrap","o":["close","end","finish"],"e":"wrap up 是「收尾」。close up / end up / finish up 意思不同：end up 是最後變成。","f":"Let's wrap up the meeting with a summary."},{"s":"Can you bring me up to ___ on the project?","a":"speed","o":["date","line","track"],"e":"bring someone up to speed 是「幫人跟上進度」。up to date 是最新的；on track 是按進度。","f":"Can you bring me up to speed on the project?"},{"s":"Let's take this ___; it's not relevant to everyone.","a":"offline","o":["online","outside","away"],"e":"take it offline 是「會後私下討論」。online 相反；outside / away 沒有這個慣用意思。","f":"Let's take this offline; it's not relevant to everyone."},{"s":"I want to make sure we're all on the same ___.","a":"page","o":["line","side","book"],"e":"on the same page 是「想法一致」。on the same side 是同一陣營；line / book 不是慣用語。","f":"I want to make sure we're all on the same page."},{"s":"We're on ___ to finish by Friday.","a":"track","o":["time","line","schedule to"],"e":"on track 是「進度正常」。on time 是準時（單一事件）；on schedule 不加 to。","f":"We're on track to finish by Friday."},{"s":"Just a ___: the client is arriving early.","a":"heads-up","o":["warning out","notice of","reminder of"],"e":"Just a heads-up 是輕鬆的「先提醒一下」。warning out / notice of 句構錯；reminder of 後缺受詞。","f":"Just a heads-up: the client is arriving early."},{"s":"This is a friendly ___ that the invoice is due.","a":"reminder","o":["remainder","remind","memory"],"e":"提醒＝reminder。remainder 是剩餘部分（常見拼錯）；remind 是動詞；memory 是記憶。","f":"This is a friendly reminder that the invoice is due."},{"s":"Please pay the ___ of 2,000 dollars by Friday.","a":"remainder","o":["reminder","remain","rest of"],"e":"剩餘金額＝remainder（或 the rest）。reminder 是提醒；remain 是動詞；rest of 後缺受詞。","f":"Please pay the remainder of 2,000 dollars by Friday."},{"s":"Please find ___ the agenda for tomorrow.","a":"attached","o":["attaching","attach","attachment"],"e":"Please find attached... 是固定書信用法。其他詞性不對。","f":"Please find attached the agenda for tomorrow."},{"s":"I've ___ my manager on this email.","a":"cc'd","o":["copied to","carbon","added to"],"e":"cc 當動詞「副本給某人」。copied to 句構錯；carbon 是碳；added to 缺受詞。","f":"I've cc'd my manager on this email."},{"s":"We're ___ budget constraints this year.","a":"facing","o":["meeting","facing to","encountering with"],"e":"face budget constraints 自然。meet 是滿足；facing to / encountering with 多了介系詞。","f":"We're facing budget constraints this year."},{"s":"This is our ___ offer. We can't go lower.","a":"final","o":["last time","end","finally"],"e":"最終報價＝final offer。last time 是上次；end 是名詞；finally 是副詞。","f":"This is our final offer. We can't go lower."},{"s":"Price is not the ___; delivery time is.","a":"deal-breaker","o":["deadline","bottleneck","breakthrough"],"e":"導致交易破局的關鍵＝deal-breaker。deadline 是期限；bottleneck 是瓶頸；breakthrough 是突破。","f":"Price is not the deal-breaker; delivery time is."},{"s":"Testing is the ___ that slows down the whole project.","a":"bottleneck","o":["deal-breaker","milestone","deadline"],"e":"拖慢整體的環節＝bottleneck。milestone 是里程碑；deadline 是截止日。","f":"Testing is the bottleneck that slows down the whole project."},{"s":"Finishing the prototype is a major ___.","a":"milestone","o":["deadline","bottleneck","timeline"],"e":"重要階段成果＝milestone。deadline 是期限；timeline 是時程表。","f":"Finishing the prototype is a major milestone."},{"s":"The client keeps adding features. This is scope ___.","a":"creep","o":["crawl","growth","increase"],"e":"scope creep 是專案管理術語「範圍蔓延」。其他詞不構成此術語。","f":"The client keeps adding features. This is scope creep."},{"s":"Sorry, I don't have the ___ to take on another project.","a":"bandwidth","o":["band","capacity of","space"],"e":"bandwidth（餘力）是職場常用比喻。band 是樂團；capacity of 後缺名詞；space 太字面。","f":"Sorry, I don't have the bandwidth to take on another project."},{"s":"Our factory is at full ___.","a":"capacity","o":["ability","capability","volume"],"e":"產能滿載＝at full capacity。ability / capability 指能力；volume 是量，不與 at full 搭配。","f":"Our factory is at full capacity."},{"s":"We need to ___ this issue to senior management.","a":"escalate","o":["elevate","raise up","promote"],"e":"將問題上報＝escalate。elevate 多指提升地位；raise up 重複；promote 是升職或推廣。","f":"We need to escalate this issue to senior management."},{"s":"She was ___ to manager last month.","a":"promoted","o":["escalated","raised","upgraded"],"e":"升職＝be promoted。escalated 是問題升級；raised 是加薪（got a raise）；upgraded 用於產品、座位。","f":"She was promoted to manager last month."},{"s":"I got a 5 percent ___ this year.","a":"raise","o":["rise up","promotion","bonus up"],"e":"加薪＝raise（美式）。rise up 錯；promotion 是升職；bonus up 錯。","f":"I got a 5 percent raise this year."},{"s":"We ___ ten new engineers this quarter.","a":"hired","o":["employed to","fired","recruited for"],"e":"聘用＝hired。employed to 句構錯；fired 是開除；recruited for 後缺受詞。","f":"We hired ten new engineers this quarter."},{"s":"He was ___ for missing work too often.","a":"fired","o":["laid off","resigned","retired"],"e":"因個人原因被開除＝fired。laid off 是公司因經營裁員；resigned 是自己辭職；retired 是退休。","f":"He was fired for missing work too often."},{"s":"Due to the downturn, 200 workers were ___.","a":"laid off","o":["fired","resigned","quit"],"e":"因景氣裁員＝laid off。fired 是因個人表現開除；resigned / quit 是自願離職。","f":"Due to the downturn, 200 workers were laid off."},{"s":"I've decided to ___ and join another company.","a":"resign","o":["retire","lay off","fire"],"e":"主動離職＝resign。retire 是退休；lay off / fire 是被公司解僱。","f":"I've decided to resign and join another company."},{"s":"Our ___ rate is high; many people leave within a year.","a":"turnover","o":["turnaround","turnout","overturn"],"e":"離職率＝turnover rate。turnaround 是好轉或周轉時間；turnout 是出席人數；overturn 是推翻。","f":"Our turnover rate is high; many people leave within a year."},{"s":"The ___ for the event was great; over 300 people came.","a":"turnout","o":["turnover","attendance to","output"],"e":"出席人數＝turnout。turnover 是離職率；attendance to 錯；output 是產出。","f":"The turnout for the event was great; over 300 people came."},{"s":"Can you give me a ___ figure? It doesn't need to be exact.","a":"ballpark","o":["baseball","rough out","exact"],"e":"大概數字＝ballpark figure。baseball 錯；rough out 錯；exact 意思相反。","f":"Can you give me a ballpark figure? It doesn't need to be exact."},{"s":"We need ___ from the client before we launch.","a":"sign-off","o":["sign-up","sign-in","signal"],"e":"核准＝sign-off。sign-up 是註冊；sign-in 是登入；signal 是信號。","f":"We need sign-off from the client before we launch."},{"s":"Please ___ up for the training by Friday.","a":"sign","o":["log","sign off","check"],"e":"報名＝sign up。log up 錯；sign off 是批准或結束；check up 是檢查。","f":"Please sign up for the training by Friday."},{"s":"Let's ___ a compromise: 45 days instead of 60.","a":"reach","o":["arrive","get to at","make up"],"e":"reach a compromise 是自然搭配。arrive 要接 at；get to at 錯；make up 是和好或編造。","f":"Let's reach a compromise: 45 days instead of 60."},{"s":"They gave us a big ___ on delivery time.","a":"concession","o":["confession","concert","conception"],"e":"談判讓步＝concession。confession 是坦白；concert 是音樂會；conception 是概念。","f":"They gave us a big concession on delivery time."},{"s":"We have ___ because we're their biggest customer.","a":"leverage","o":["level","leave","lever up"],"e":"談判籌碼＝leverage。level 是水準；leave 是離開；lever up 錯。","f":"We have leverage because we're their biggest customer."},{"s":"This deal is good for both sides; it's a ___.","a":"win-win","o":["win-lose","zero-sum","lose-lose"],"e":"雙贏＝win-win。win-lose 一方得利；zero-sum 零和；lose-lose 雙輸。","f":"This deal is good for both sides; it's a win-win."},{"s":"Our ___ to Q3 was revenue growth of 20 percent.","a":"guidance","o":["guide","guideline","guidebook"],"e":"公司財測＝guidance。guide 是指南或導遊；guideline 是規範；guidebook 是旅遊書。","f":"Our guidance to Q3 was revenue growth of 20 percent."},{"s":"Please follow the brand ___ when making the poster.","a":"guidelines","o":["guidance","guides","guidebook"],"e":"品牌規範＝brand guidelines。guidance 是指導或財測；guides 是導遊；guidebook 是書。","f":"Please follow the brand guidelines when making the poster."},{"s":"Earnings ___ expectations, so the stock jumped.","a":"beat","o":["won","defeated","overcame"],"e":"財報優於預期＝beat expectations。won / defeated / overcame 不和 expectations 搭配。","f":"Earnings beat expectations, so the stock jumped."},{"s":"The company ___ estimates; the stock fell 8 percent.","a":"missed","o":["lost","failed","lacked"],"e":"不如預期＝missed estimates。lost / failed / lacked 不和 estimates 這樣搭配。","f":"The company missed estimates; the stock fell 8 percent."},{"s":"Revenue grew 15 percent ___, compared with the same quarter last year.","a":"year over year","o":["month over month","quarter over quarter","day to day"],"e":"和去年同期比較＝year over year（YoY）。MoM 是月增；QoQ 是季增；day to day 是日常。","f":"Revenue grew 15 percent year over year, compared with the same quarter last year."},{"s":"We expect to ___ even next year.","a":"break","o":["get","make","reach"],"e":"損益兩平＝break even。get / make / reach 不與 even 搭配。","f":"We expect to break even next year."},{"s":"Please submit your ___ report after the trip.","a":"expense","o":["expensive","expenditure","spend"],"e":"報帳＝expense report。expensive 是昂貴；expenditure 是支出（較正式，不用於此搭配）；spend 是動詞。","f":"Please submit your expense report after the trip."},{"s":"The company will ___ you for the taxi fare.","a":"reimburse","o":["refund","return","repay to"],"e":"公司報銷＝reimburse。refund 是商家退款；return 是歸還；repay to 錯。","f":"The company will reimburse you for the taxi fare."},{"s":"The store gave me a full ___ for the broken item.","a":"refund","o":["reimbursement","return","repayment"],"e":"商家退錢給消費者＝refund。reimbursement 是公司報銷；return 是退貨行為；repayment 是還款。","f":"The store gave me a full refund for the broken item."},{"s":"Can I ___ this shirt for a larger size?","a":"exchange","o":["change to","return","refund"],"e":"換貨＝exchange A for B。change to 錯；return 是退貨不換；refund 是退款。","f":"Can I exchange this shirt for a larger size?"},{"s":"The product comes with a two-year ___.","a":"warranty","o":["guarantee to","insurance","promise"],"e":"產品保固＝warranty。guarantee to 錯；insurance 是保險；promise 是承諾，不正式。","f":"The product comes with a two-year warranty."},{"s":"Please sign the ___ before we share the design.","a":"NDA","o":["MOU","PO","KPI"],"e":"保密協議＝NDA。MOU 是合作備忘錄；PO 是訂單；KPI 是績效指標。","f":"Please sign the NDA before we share the design."},{"s":"Our main ___ this year is customer retention.","a":"KPI","o":["ROI","EPS","MOQ"],"e":"績效指標＝KPI。ROI const DRAMA=[{"n":1,"t":"第一天就上場","it":[{"s":"OREN","e":"Morning! You must be Fancia. Welcome aboard. Did you find the place okay?","z":"早！你一定是 Fancia。歡迎加入。路上好找嗎？","a":"audio/db752542dc9.mp3"},{"s":"F","e":"Yes, thanks. The {commute|通勤} was easier than I expected.","z":"好找，謝謝。通勤比我想的輕鬆。","a":"audio/db4271fcbfc.mp3"},{"s":"OREN","e":"Great. Here's your badge. Reception will give you a visitor pass until it's activated.","z":"太好了。這是你的識別證，啟用前櫃台會先給你訪客證。","a":"audio/d51de0aacab.mp3"},{"s":"OREN","e":"Let me introduce the team. Linnea runs finance, Vicky manages the warehouse, and Elaine handles shipping and receiving.","z":"我來介紹一下。Linnea 管財務，Vicky 管倉庫，Elaine 負責出貨和收貨。","a":"audio/de8b8dea1de.mp3"},{"s":"LIN","e":"Hi Fancia. If you need anything about invoices or expense reports, I'm your person.","z":"嗨 Fancia。發票或報帳的事找我就對了。","a":"audio/d0d51daf181.mp3"},{"s":"VIC","e":"And if a client asks whether something is in stock, ask me before you promise anything.","z":"客戶問有沒有現貨的話，答應之前先問我。","a":"audio/d0ce45bf730.mp3"},{"s":"ELA","e":"Same with delivery dates. {Rule of thumb|經驗法則}: never guess an ETA.","z":"交期也一樣。經驗法則：永遠別亂猜到貨時間。","a":"audio/dd14a990a77.mp3"},{"s":"OREN","e":"Ben will be here soon. He chairs the weekly sales meeting at nine. Have you seen the agenda?","z":"Ben 等等就到，他九點主持每週業務會議。你看過議程了嗎？","a":"audio/d8aec78bbd3.mp3"},{"q":"Oren 問你看過議程沒。你還沒看到，最好怎麼回？","o":[{"e":"Not yet. Could you forward me the calendar invite so I can go over it before nine?","ok":true,"fb":"誠實又主動，要求轉寄邀請並說會先看過。","r":{"s":"OREN","e":"Sure, sending it now. Good instinct.","z":"好，馬上寄。反應很好。","a":"audio/df6bf4d9b97.mp3"},"a":"audio/dcb2524cace.mp3"},{"e":"No. I don't need it.","ok":false,"fb":"太衝，聽起來不在乎。","r":{"s":"OREN","e":"Hmm, Ben likes people to come prepared.","z":"嗯，Ben 喜歡大家有備而來。","a":"audio/daac351c300.mp3"},"a":"audio/d0115c7ad09.mp3"},{"e":"Agenda is not my business.","ok":false,"fb":"很失禮，議程跟每個人都有關。","r":{"s":"VIC","e":"{Oof|哎呀}. Don't say that in front of Ben.","z":"哎呀，別在 Ben 面前這樣說。","a":"audio/de6f32ec8c7.mp3"},"a":"audio/da2d9d84ac3.mp3"}]},{"s":"BEN","e":"Morning, all. Fancia? Ben. Nice to meet you. Quick heads-up: Halden Electronics is our key account, and their order is behind schedule.","z":"早。Fancia？我是 Ben，幸會。先提醒一下：Halden Electronics 是我們的大客戶，他們的訂單進度落後了。","a":"audio/dd9d30f5d2d.mp3"},{"s":"BEN","e":"You'll take the floor after me and give a status update.","z":"我講完換你上台做進度報告。","a":"audio/d4c2149c51c.mp3"},{"s":"F","e":"Today? On my first day?","z":"今天？我第一天耶？","a":"audio/d292c51548c.mp3"},{"s":"BEN","e":"Sink or swim. The meeting starts in ten minutes.","z":"不游就沉。會議十分鐘後開始。","a":"audio/db67aff44cd.mp3"}],"h":"📍 週一早上 8:50｜台北辦公室・開放式辦公區｜在場：Oren、Linnea、Vicky、Elaine｜你是新來的業務 Fancia，剛拿到識別證｜目標：認識團隊，搞懂今天的會議議程","c":"Fancia 打開共用資料夾，發現 Halden 的出貨表格裡有一欄寫著紅字：「延遲—原因不明」。"},{"n":2,"t":"延遲的原因","it":[{"s":"BEN","e":"Okay, let's get started. First item on the agenda: the Halden order. Fancia, the floor is yours.","z":"好，開始吧。議程第一項：Halden 的訂單。Fancia，換你。","a":"audio/da5fb0ffd76.mp3"},{"s":"F","e":"Thanks, Ben. In a nutshell, the order of twenty thousand units is behind schedule.","z":"謝謝 Ben。簡單說，這筆兩萬件的訂單進度落後。","a":"audio/d5a6eed08ae.mp3"},{"s":"BEN","e":"How far behind? Give me a number.","z":"落後多少？給我數字。","a":"audio/df50ba67302.mp3"},{"q":"Ben 要數字，但你還不確定。最好的回答？","o":[{"e":"About a week, as far as I know. Elaine, could you confirm the ETD?","ok":true,"fb":"給出估計並點名專業的人確認，最穩。","r":{"s":"ELA","e":"Yes, the ETD moved from the 10th to the 17th.","z":"對，預計出貨日從 10 號延到 17 號。","a":"audio/d4cfcb5ec43.mp3"},"a":"audio/dad2d019c13.mp3"},{"e":"Maybe one month? I'm not sure.","ok":false,"fb":"亂猜數字，風險很大。","r":{"s":"BEN","e":"Maybe? I need facts, not guesses.","z":"也許？我要事實不要猜測。","a":"audio/dfa6f6b4341.mp3"},"a":"audio/ddbc535682e.mp3"},{"e":"It's not my fault.","ok":false,"fb":"推卸責任，在會議上很扣分。","r":{"s":"BEN","e":"Nobody said it was. Just the facts.","z":"沒人說是你的錯。講事實就好。","a":"audio/d8e4adb1aba.mp3"},"a":"audio/d7dc17e7961.mp3"}]},{"s":"OREN","e":"What's causing the delay?","z":"延遲原因是什麼？","a":"audio/db75d37ce9f.mp3"},{"s":"VIC","e":"We have a shortage of one component. Our supplier's capacity is fully booked.","z":"有一個零件缺料，供應商產能全滿。","a":"audio/d201ae5a468.mp3"},{"s":"BEN","e":"Then it's a bottleneck. Who's the owner of this issue?","z":"那就是瓶頸。這件事誰負責？","a":"audio/df7d6d1d829.mp3"},{"s":"OREN","e":"Let's not point fingers. Fancia owns the client side, Vicky owns inventory. Let's sync up after this.","z":"先別互相指責。Fancia 負責客戶端，Vicky 負責庫存。會後我們對一下。","a":"audio/de44c858040.mp3"},{"s":"BEN","e":"Fine. Action item: Fancia sends Halden a follow-up email by EOD. Keep it short and don't over-promise.","z":"好。待辦：Fancia 今天下班前寄追蹤信給 Halden。簡短、別過度承諾。","a":"audio/db0e1f47b1d.mp3"},{"s":"F","e":"Got it. I'm on it.","z":"了解，我來處理。","a":"audio/d43c20fa35d.mp3"},{"s":"OREN","e":"Good. Let's move on. Next item…","z":"好，下一項……","a":"audio/d5fda22c4b4.mp3"},{"s":"ELA","e":"{Psst|噓}, Fancia. Want to {grab lunch|一起吃午餐} later? I'll tell you what really happened with this supplier.","z":"噓，Fancia，等下一起吃午餐？我跟你說這家供應商到底怎麼了。","a":"audio/d1de64408c3.mp3"},{"s":"ELA","e":"(群組) How was your weekend, by the way? Mine was all laundry.","z":"（群組）對了，週末過得如何？我的週末全在洗衣服。","a":"audio/df1bad3fe0a.mp3"},{"s":"F","e":"(群組) Quiet. I had no weekend plans, so I read the employee handbook.","z":"（群組）很平靜。我沒什麼週末計畫，所以讀了員工手冊。","a":"audio/dd40502171a.mp3"}],"h":"📍 週一早上 9:00｜會議室 A｜在場：Ben、Oren、Elaine、Vicky｜你要在週會上報告 Halden 訂單的進度｜目標：說清楚現況，不亂承諾","c":"午餐時，Elaine 壓低聲音：「上次也是他們，而且 Ben 差點因此丟了 Halden。」"},{"n":3,"t":"一封不能寫錯的信","it":[{"s":"F","e":"Ben, could you proofread my draft before I send it? The subject line is \"Update regarding PO 4471.\"","z":"Ben，寄之前能幫我校對草稿嗎？主旨是「關於訂單 4471 的最新進度」。","a":"audio/d085a6be41e.mp3"},{"s":"BEN","e":"Read me the opening.","z":"念開頭給我聽。","a":"audio/d298d592e8b.mp3"},{"s":"F","e":"\"Dear Marcus, I hope this email finds you well. I'm writing to give you a heads-up about your shipment.\"","z":"「親愛的 Marcus，希望您一切安好。來信是想先提醒您關於貨物的狀況。」","a":"audio/dd694a05782.mp3"},{"s":"BEN","e":"Good. Now the bad news. Be clear, don't bury it.","z":"好，現在講壞消息。要清楚，別藏起來。","a":"audio/d06add90f95.mp3"},{"q":"要怎麼寫延遲那句最好？","o":[{"e":"Unfortunately, the delivery date will move to the 24th due to a component shortage. We apologize for the inconvenience.","ok":true,"fb":"清楚說明新日期與原因，並道歉。","r":{"s":"BEN","e":"That's it. Clear and honest.","z":"就是這樣，清楚又誠實。","a":"audio/d2542d1bc9b.mp3"},"a":"audio/d22d47b5175.mp3"},{"e":"There may be some small problems, maybe.","ok":false,"fb":"太模糊，客戶看不懂。","r":{"s":"BEN","e":"Marcus will call in five minutes asking what that means.","z":"Marcus 五分鐘內就會打來問這是什麼意思。","a":"audio/d0323706a04.mp3"},"a":"audio/ddd38ab39fa.mp3"},{"e":"Your order is late. Sorry.","ok":false,"fb":"太簡短生硬，不夠專業。","r":{"s":"BEN","e":"Too blunt. He's our biggest client.","z":"太直接了，他是我們最大的客戶。","a":"audio/d6fc1c921fc.mp3"},"a":"audio/db81b3677f3.mp3"}]},{"s":"LIN","e":"Also cc me and attach the revised invoice. Their accounts payable team will ask.","z":"也 cc 我，並附上修改後的發票。他們應付帳款部門會問。","a":"audio/d41a3a60925.mp3"},{"s":"F","e":"Should I bcc Oren?","z":"要密件副本給 Oren 嗎？","a":"audio/d42a8a143b2.mp3"},{"s":"BEN","e":"No, just loop him in openly. Hidden recipients make people nervous.","z":"不用，直接公開把他加進來。看不到的收件人會讓人緊張。","a":"audio/d0403c5b4da.mp3"},{"s":"F","e":"And the sign-off: \"Please let me know if you have any questions. Best regards, Fancia.\"","z":"結尾：「如有任何問題請告訴我。敬祝商祺，Fancia。」","a":"audio/d9550ff8481.mp3"},{"s":"BEN","e":"Fine. One typo: \"recieve.\" Fix it, then send.","z":"可以。有個錯字「recieve」，改好就寄。","a":"audio/d6c52f522ed.mp3"},{"s":"F","e":"Good catch. Sent.","z":"抓得好。寄出了。","a":"audio/db026a49905.mp3"},{"s":"LIN","e":"{You survived day one|你撐過第一天了}. {Fancy a bubble tea|要不要來杯珍奶}?","z":"你撐過第一天了。要不要來杯珍奶？","a":"audio/da18aa155db.mp3"},{"s":"LIN","e":"And don't put customer emails on your personal account. Always use your work email.","z":"還有別用私人信箱寄客戶信，一律用公司信箱。","a":"audio/ddaa6015a67.mp3"}],"h":"📍 週一下午 4:30｜你的座位｜在場：Ben（隔壁）、Linnea｜你要在下班前寄出給 Halden 的延遲通知信｜目標：語氣專業、不過度承諾","c":"十分鐘後，信箱跳出一封自動回覆：「Marcus 休假中（OOO）。緊急事項請聯絡 Halden 採購總監——Diana Wu。」"},{"n":4,"t":"打給不認識的總監","it":[{"s":"RECEP","e":"Halden Electronics, good morning. Who's calling, please?","z":"Halden 電子早安，請問哪位？","a":"audio/d2cf1f1796f.mp3"},{"s":"F","e":"This is Fancia from Northwind. I'm calling about an order. Could you put me through to Diana Wu?","z":"我是 Northwind 的 Fancia，打來是關於一筆訂單。可以幫我轉給 Diana Wu 嗎？","a":"audio/d4112ac8992.mp3"},{"s":"RECEP","e":"Hold on, please. I'm afraid she's on another line. Would you like to leave a message?","z":"請稍等。不好意思，她正在講另一通電話。要留言嗎？","a":"audio/d831c30a023.mp3"},{"q":"你想確保對方會回電，最好怎麼說？","o":[{"e":"Yes, please. Could you ask her to call me back? My extension is 2-1-7.","ok":true,"fb":"清楚留言並給分機，最實際。","r":{"s":"RECEP","e":"Of course. Could you spell your name for me?","z":"好的，可以拼一下您的名字嗎？","a":"audio/d6e42f1a990.mp3"},"a":"audio/d6b1dbc31be.mp3"},{"e":"No, I'll just call again and again.","ok":false,"fb":"聽起來有點煩人。","r":{"s":"OREN","e":"Maybe don't say \"again and again.\"","z":"也許別說「一直打」。","a":"audio/d230eced8c2.mp3"},"a":"audio/d7d7981af29.mp3"},{"e":"Tell her it's urgent, very urgent!","ok":false,"fb":"太激動，會讓人緊張。","r":{"s":"RECEP","e":"Um… okay. I'll let her know.","z":"呃……好，我會轉告她。","a":"audio/da9829f264a.mp3"},"a":"audio/d2e39ff000e.mp3"}]},{"s":"F","e":"Sure. F-A-N-C-I-A. Thank you.","z":"好。F-A-N-C-I-A。謝謝。","a":"audio/d890a144f7a.mp3"},{"s":"OREN","e":"Nice and calm. Phone calls are half tone, half content.","z":"很冷靜。講電話一半靠語氣，一半靠內容。","a":"audio/de99531e4d0.mp3"},{"d":"二十分鐘後，電話響了"},{"s":"F","e":"Fancia speaking.","z":"我是 Fancia。","a":"audio/d3324ab2616.mp3"},{"s":"DIANA","e":"Hi, it's Diana Wu, returning your call. Sorry, it's a bad line, I'm in the car.","z":"嗨，我是 Diana Wu，回你電話。抱歉收訊不好，我在車上。","a":"audio/dd773ea636a.mp3"},{"s":"F","e":"No worries. Is this a good time to talk? I'll keep it short.","z":"沒關係。現在方便講嗎？我長話短說。","a":"audio/d31624e6c27.mp3"},{"s":"DIANA","e":"You're breaking up a little. Could you speak up?","z":"你斷斷續續的，可以大聲一點嗎？","a":"audio/d5156fcf3d5.mp3"},{"s":"F","e":"Sure. Your shipment will arrive one week later than planned. I sent the details by email.","z":"好。您的貨會比預計晚一週到，細節我已經寄信了。","a":"audio/d00039ebc5b.mp3"},{"s":"DIANA","e":"A week? Our production line can't wait. If Northwind can't deliver, we have a second source.","z":"一週？我們的產線等不了。如果 Northwind 交不了貨，我們有第二供應來源。","a":"audio/d8f665a796a.mp3"},{"s":"F","e":"I understand. Let me get back to you on that today.","z":"我了解。這件事今天之內回覆您。","a":"audio/d296afa170a.mp3"},{"s":"DIANA","e":"Today. Not tomorrow.","z":"今天，不是明天。","a":"audio/d4cf494f862.mp3"},{"d":"她掛了電話"},{"s":"RECEP","e":"She'll be on another line for a while. I'll take your message.","z":"她還會在另一條線上一陣子，我幫您留言。","a":"audio/dc9bcfa1de6.mp3"}],"h":"📍 週二早上 10:00｜小會議室（電話）｜在場：你、Oren 在旁聽｜Marcus 休假，你要打給 Halden 採購總監 Diana｜目標：禮貌自我介紹，說明延遲並約好下次聯繫","c":"Oren 拍拍你：「她說的第二供應商，是我們的對手 Vexa。」"},{"n":5,"t":"供應商的底線","it":[{"s":"RAJ","e":"Can you hear me? Let me share my screen.","z":"聽得到嗎？我分享一下畫面。","a":"audio/d1d7a23caa2.mp3"},{"s":"BEN","e":"Yes. Raj, let's get to the point. We need ten thousand units by Friday.","z":"聽得到。Raj，直接講重點。我們週五前需要一萬件。","a":"audio/d047b5ff981.mp3"},{"s":"RAJ","e":"Ben, you know our capacity. The yield rate on that line dropped to eighty percent.","z":"Ben，你知道我們的產能。那條產線良率掉到八成。","a":"audio/d3ccd558a0d.mp3"},{"s":"VIC","e":"Our inventory covers maybe three thousand. The rest is on backorder.","z":"我們庫存大概只夠三千，其他都是待補貨。","a":"audio/d78c8388c77.mp3"},{"q":"Ben 很強硬，氣氛僵。你想緩和並找到可行方案，說什麼？","o":[{"e":"Would it be possible to ship a partial shipment first, say five thousand, and the rest next week?","ok":true,"fb":"提出分批出貨，給雙方台階下。","r":{"s":"RAJ","e":"Five thousand… that's feasible if we add overtime.","z":"五千……加班的話可行。","a":"audio/d5791f6587e.mp3"},"a":"audio/d8ae2960652.mp3"},{"e":"If you can't do it, we'll find another vendor.","ok":false,"fb":"威脅供應商，關係會變差。","r":{"s":"RAJ","e":"Then go ahead. Good luck finding one this month.","z":"那請便。祝你這個月找得到。","a":"audio/d924360db31.mp3"},"a":"audio/d612d479889.mp3"},{"e":"Okay, whatever you can do is fine.","ok":false,"fb":"太快放棄，沒有爭取。","r":{"s":"BEN","e":"No, it isn't fine.","z":"不，不行。","a":"audio/df7af9773c0.mp3"},"a":"audio/d2cc0aa8045.mp3"}]},{"s":"BEN","e":"Overtime costs money. Who pays?","z":"加班要花錢。誰付？","a":"audio/d09cc17d705.mp3"},{"s":"RAJ","e":"We could split it. Meet halfway.","z":"我們可以分攤，各退一步。","a":"audio/de7328cabf6.mp3"},{"s":"BEN","e":"Fine, in principle. Send me the numbers in writing.","z":"原則上可以。把數字書面寄給我。","a":"audio/d5244c4f81c.mp3"},{"s":"RAJ","e":"Will do. And to be honest, raw materials prices are going up. Expect a price increase next quarter.","z":"沒問題。老實說，原物料在漲價，下一季預計會調價。","a":"audio/d85c4ab6f83.mp3"},{"s":"BEN","e":"We'll talk about that later. One fire at a time.","z":"那以後再談，一次滅一個火。","a":"audio/d366206b678.mp3"},{"s":"VIC","e":"I'll update the stock level in the system once we confirm.","z":"確認後我會更新系統裡的庫存量。","a":"audio/d7616d62e0b.mp3"},{"s":"F","e":"And I'll call Diana with the new plan.","z":"那我打給 Diana 說明新方案。","a":"audio/dc8cc2e5369.mp3"},{"s":"BEN","e":"Good. {Nice save|救得好}, rookie.","z":"好。救得漂亮，菜鳥。","a":"audio/d42c87c7d94.mp3"}],"h":"📍 週二下午 2:00｜視訊會議｜在場：Ben、Vicky、供應商 Raj（Delta Parts）｜你要說服 Raj 提前出貨給 Halden 的零件｜目標：了解對方限制，爭取方案","c":"你剛要撥給 Diana，Elaine 衝過來：「等等！貨櫃的報關文件有問題——這五千件週五可能出不了港。」"},{"n":6,"t":"報關文件的錯","it":[{"s":"ELA","e":"Look at this. The packing list says five thousand units, but the commercial invoice says five hundred.","z":"你看，裝箱單寫五千件，商業發票卻寫五百。","a":"audio/d9088dc3230.mp3"},{"s":"F","e":"That's a typo, right?","z":"那是打錯字吧？","a":"audio/d2b5ff788ea.mp3"},{"s":"ELA","e":"A typo that customs won't forgive. If the numbers don't match, customs clearance gets stuck at the port.","z":"一個海關不會原諒的錯字。數字對不上，清關就會卡在港口。","a":"audio/d0d49ccb367.mp3"},{"s":"VIC","e":"And the pallets are already labeled. I don't want to relabel two hundred boxes.","z":"棧板都貼好標籤了，我可不想重貼兩百箱。","a":"audio/d8d0bc3d32e.mp3"},{"s":"ELA","e":"We don't need to. I'll ask Linnea to reissue the invoice and tell our customs broker.","z":"不用。我請 Linnea 重開發票，再通知報關行。","a":"audio/d5e165f46b6.mp3"},{"s":"F","e":"What about the bill of lading?","z":"那提單呢？","a":"audio/d606c5cecf4.mp3"},{"s":"ELA","e":"The freight forwarder hasn't issued it yet. Good timing, actually.","z":"貨代還沒開，其實時機剛好。","a":"audio/dd9e8eda44f.mp3"},{"q":"你要不要現在就通知 Diana？最好的做法是？","o":[{"e":"Let's fix it first, then I'll give Diana one clear update with the new ETA.","ok":true,"fb":"先解決再一次給清楚的更新，避免反覆。","r":{"s":"ELA","e":"Smart. Clients hate ten small updates.","z":"聰明，客戶最討厭一直收到小更新。","a":"audio/ddd00f9ed4a.mp3"},"a":"audio/d729fc6903b.mp3"},{"e":"I'll tell her everything right now, every detail.","ok":false,"fb":"細節太多會讓客戶更焦慮。","r":{"s":"ELA","e":"She doesn't need to know about our typo.","z":"她不需要知道我們的錯字。","a":"audio/dae589ef69a.mp3"},"a":"audio/ded6342843f.mp3"},{"e":"Let's hide it and hope it works.","ok":false,"fb":"隱瞞有風險，萬一出事更糟。","r":{"s":"VIC","e":"Hope is not a plan, Fancia.","z":"希望不是計畫，Fancia。","a":"audio/d0489c0a41d.mp3"},"a":"audio/d7a1b9d25c2.mp3"}]},{"s":"ELA","e":"Also, this is sea freight. If Halden is that worried, air freight is faster but the shipping cost triples.","z":"還有，這是海運。如果 Halden 真的很急，空運比較快，但運費會變三倍。","a":"audio/d26e9d3837e.mp3"},{"s":"F","e":"Who decides that?","z":"這要誰決定？","a":"audio/d52eb7edcdb.mp3"},{"s":"ELA","e":"Ben. And he'll ask who pays. He always asks who pays.","z":"Ben 決定。他會問誰付錢，他永遠問誰付錢。","a":"audio/d4c06b87c66.mp3"},{"s":"VIC","e":"{Speaking of paying|說到付錢}, you owe me a coffee for not making me relabel.","z":"說到付錢，你欠我一杯咖啡，因為不用重貼標籤。","a":"audio/df0beb7257e.mp3"},{"s":"F","e":"{Deal|成交}.","z":"成交。","a":"audio/d37308a46ce.mp3"}],"h":"📍 週二下午 4:00｜出貨區・裝卸碼頭｜在場：Elaine、Vicky｜你要搞懂報關卡在哪裡｜目標：找出問題，決定要不要先通知客戶","c":"晚上 7 點，你準備下班，收到 Diana 的訊息：「明天早上九點，我想親自去你們辦公室談。帶你的主管。」"},{"n":7,"t":"Diana 親自來了","it":[{"s":"F","e":"Good morning, Diana. Great to see you in person. Thanks for coming all the way here.","z":"Diana 早安，很高興見到您本人，謝謝您專程過來。","a":"audio/db5cf764bb5.mp3"},{"s":"DIANA","e":"Thanks for having me. Nice weather today, at least.","z":"謝謝邀請。至少今天天氣不錯。","a":"audio/db4a4129ba1.mp3"},{"s":"OREN","e":"Can I get you something? Coffee, tea? Please, help yourself to the snacks.","z":"要喝點什麼嗎？咖啡、茶？點心請自便。","a":"audio/d7770f125c3.mp3"},{"s":"DIANA","e":"Coffee, thanks. So, let's not waste time. What's your proposal?","z":"咖啡，謝謝。那我們別浪費時間了，你們的提案是什麼？","a":"audio/d70fc4c2b88.mp3"},{"s":"F","e":"Let me walk you through it. We'll send a partial shipment of five thousand units by Friday, and the rest within ten days.","z":"我來說明。週五先出五千件，剩下的十天內出。","a":"audio/dccd0e24ebf.mp3"},{"s":"DIANA","e":"Ten days still hurts. Our lead time to our own customer is fixed.","z":"十天還是很痛。我們給自己客戶的交期是固定的。","a":"audio/d99b5e462e2.mp3"},{"q":"Diana 不滿意。你想展現誠意又不亂讓價，怎麼說？","o":[{"e":"I hear you. To make up for it, we could expedite the second batch by air freight at our cost.","ok":true,"fb":"先同理，再給具體補償。","r":{"s":"BEN","e":"(小聲) …At our cost. Okay. We can do that.","z":"（小聲）……我們出錢。好，可以。","a":"audio/d64a1b84aec.mp3"},"a":"audio/d67b125a202.mp3"},{"e":"Then we'll give you a fifty percent discount.","ok":false,"fb":"隨口大幅降價，Ben 會抓狂。","r":{"s":"BEN","e":"Hold on. Nobody approved a discount.","z":"等等，沒人批准折扣。","a":"audio/da9bf055280.mp3"},"a":"audio/dcda55b2128.mp3"},{"e":"It's the supplier's problem, not ours.","ok":false,"fb":"把責任推給供應商，客戶不在乎。","r":{"s":"DIANA","e":"Your supplier isn't my supplier. You are.","z":"你的供應商不是我的供應商，你們才是。","a":"audio/d647e58b077.mp3"},"a":"audio/dab88cee3e1.mp3"}]},{"s":"DIANA","e":"Air freight. Okay, that's a concession I can accept. But I want it in writing, and an order confirmation by today.","z":"空運。好，這個讓步我可以接受。但我要書面確認，今天就給訂單確認書。","a":"audio/d87e46013f0.mp3"},{"s":"OREN","e":"Absolutely. And for the record, we value this long-term partnership. We'll go the extra mile.","z":"當然。也要說明，我們很重視這段長期合作，一定會多做一步。","a":"audio/d229f0a0849.mp3"},{"s":"DIANA","e":"Words are cheap, Oren. By the way, Vexa sent us a quote last week. A competitive price.","z":"嘴上說說很容易，Oren。對了，Vexa 上週給我們報價，價格很有競爭力。","a":"audio/d8f539dfa90.mp3"},{"s":"BEN","e":"I'm sure it was.","z":"想必是。","a":"audio/db85b3e9b61.mp3"},{"s":"DIANA","e":"I'll let you go. Take care.","z":"不耽誤你們了，保重。","a":"audio/daeb85318e1.mp3"},{"s":"OREN","e":"You too. Have a good one.","z":"你也是，祝順利。","a":"audio/d293d236564.mp3"}],"h":"📍 週三早上 9:00｜會議室 B｜在場：Ben、Oren、Halden 採購總監 Diana｜客戶親自上門興師問罪｜目標：先寒暄降溫，再提出分批出貨方案","c":"送走 Diana，Ben 關上門：「空運費誰算的？Linnea 會殺了我。」Linnea 從門外探頭：「我聽到了。」"},{"n":8,"t":"Linnea 的試算表","it":[{"s":"LIN","e":"Okay, sit down. Let me show you the spreadsheet. Air freight adds about two dollars per unit.","z":"好，坐。我給你看試算表。空運每件大約多兩塊美金。","a":"audio/dd6cfd9f974.mp3"},{"s":"F","e":"What does that do to our margin?","z":"這對毛利有什麼影響？","a":"audio/df2ab957632.mp3"},{"s":"LIN","e":"Our gross margin on this order drops from twenty-two percent to fifteen. Still a profit, but thin.","z":"這筆單的毛利從 22% 掉到 15%。還有賺，但很薄。","a":"audio/db71b54d372.mp3"},{"s":"BEN","e":"Fifteen is fine. Losing Halden is a loss of about thirty percent of our revenue.","z":"15% 可以。丟掉 Halden 等於少掉三成營收。","a":"audio/d74b409358e.mp3"},{"s":"LIN","e":"Fine. But I need the quotation updated and the payment terms checked. Their invoice is still net sixty.","z":"好吧。但報價要更新，付款條件也要確認。他們的發票還是 60 天付款。","a":"audio/d1978c05ba7.mp3"},{"s":"F","e":"Is that bad?","z":"這樣不好嗎？","a":"audio/d29e5da608e.mp3"},{"s":"LIN","e":"It hurts our cash flow. We pay Raj in thirty days but Halden pays us in sixty.","z":"會影響現金流。我們 30 天就要付 Raj，Halden 卻 60 天才付我們。","a":"audio/dbe6057fbdb.mp3"},{"q":"你想請 Linnea 協助又不想讓她更煩，怎麼說最好？","o":[{"e":"That makes sense. I'd appreciate it if you could check the numbers before I send the quote.","ok":true,"fb":"先表示理解，再禮貌請求。","r":{"s":"LIN","e":"Of course. Send me the draft by three.","z":"當然，三點前把草稿給我。","a":"audio/d123ac492c1.mp3"},"a":"audio/da061d0d75a.mp3"},{"e":"Can you just do it for me?","ok":false,"fb":"把工作丟給別人，不太好。","r":{"s":"LIN","e":"I have my own to-do list, Fancia.","z":"我也有自己的待辦清單，Fancia。","a":"audio/d3cee98f01a.mp3"},"a":"audio/db2240de9c8.mp3"},{"e":"Numbers are boring.","
