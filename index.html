ok":false,"fb":"對財務說數字很無聊……超失禮。","r":{"s":"LIN","e":"Numbers pay your salary.","z":"數字付你的薪水。","a":"audio/de094357b41.mp3"},"a":"audio/d03ae9f5a81.mp3"}]},{"s":"LIN","e":"Also, the outstanding balance from their last order is overdue. Twelve thousand dollars.","z":"還有，他們上一張單的未付餘額逾期了，一萬兩千美元。","a":"audio/d58bc65c583.mp3"},{"s":"BEN","e":"Seriously? Who's following up on that?","z":"真的假的？誰在追？","a":"audio/d349dca892b.mp3"},{"s":"LIN","e":"I sent a gentle reminder twice. No response.","z":"我寄過兩次溫和提醒，都沒回。","a":"audio/d59c4fe2a74.mp3"},{"s":"F","e":"I'll mention it to Diana. Nicely.","z":"我會跟 Diana 提，委婉地。","a":"audio/de9457d3bba.mp3"},{"s":"BEN","e":"Very nicely. {Don't poke the bear|別去惹毛她} this week.","z":"非常委婉。這週別去惹她。","a":"audio/d31699b712f.mp3"}],"h":"📍 週三下午 1:30｜財務部座位｜在場：Linnea、Ben｜你要算清楚空運的成本，並重開報價｜目標：讀懂毛利，學會跟財務溝通","c":"你在 Halden 的舊信件串裡搜尋付款紀錄，卻發現一封半年前的信：Ben 曾答應 Halden「明年漲價前一定先通知」——而 Raj 下季就要漲價了。"},{"n":9,"t":"電話地獄的一天","it":[{"s":"F","e":"Northwind, Fancia speaking.","z":"Northwind，我是 Fancia。","a":"audio/d1a67f22c1f.mp3"},{"s":"CALLER","e":"Hi, is this the switchboard? I'm trying to reach someone in procurement.","z":"嗨，這是總機嗎？我想找採購部。","a":"audio/deaf685f0c6.mp3"},{"s":"F","e":"I'm sorry, I think you have the wrong number. This is the sales department. Let me transfer you. Please hold the line.","z":"抱歉，您可能打錯了，這裡是業務部。我幫您轉接，請稍候。","a":"audio/d486071a631.mp3"},{"s":"ELA","e":"You're a natural.","z":"你很上手嘛。","a":"audio/d4e2d6f2b69.mp3"},{"s":"F","e":"My desk phone has six missed calls already. And a voicemail from Japan.","z":"我的桌機已經有六通未接來電了，還有一通日本來的語音留言。","a":"audio/d01aebaa02d.mp3"},{"s":"ELA","e":"Check the area code first. Some of those are spam.","z":"先看區碼，有些是垃圾電話。","a":"audio/dfe6aa96ab8.mp3"},{"d":"電話又響了"},{"s":"MARCUS","e":"Fancia? It's Marcus from Halden. I'm back from vacation. Did I get through to the right person?","z":"Fancia？我是 Halden 的 Marcus，我休假回來了。我有打對人嗎？","a":"audio/d6cdcbfe491.mp3"},{"s":"F","e":"Yes! Welcome back, Marcus. How have you been?","z":"有！歡迎回來，Marcus。最近好嗎？","a":"audio/d77d3280eb2.mp3"},{"s":"MARCUS","e":"Good, but my inbox isn't. Long story short, I need to catch up. Could you repeat the new delivery date?","z":"我很好，但我的信箱不好。長話短說，我需要跟上進度。可以再說一次新的交期嗎？","a":"audio/d185b1116d6.mp3"},{"s":"F","e":"Sure. Five thousand units on Friday, the rest by air on the 20th.","z":"好的。週五五千件，其餘 20 號空運。","a":"audio/d1da8e5cc97.mp3"},{"s":"MARCUS","e":"Sorry, could you spell that again? The line…","z":"抱歉，可以再說一次嗎？收訊……","a":"audio/d4ffdd6eb34.mp3"},{"q":"收訊很差，對方聽不清楚，怎麼處理最好？","o":[{"e":"The line is bad. Let me hang up and call you back on your mobile.","ok":true,"fb":"主動提出回撥，解決問題。","r":{"s":"MARCUS","e":"Great idea. Text me if I don't pick up.","z":"好主意，我沒接的話傳訊息給我。","a":"audio/df0c1155b9c.mp3"},"a":"audio/d3f9792d23d.mp3"},{"e":"(更大聲) FIVE! THOUSAND! FRIDAY!","ok":false,"fb":"用吼的不太專業。","r":{"s":"ELA","e":"The whole office heard that.","z":"整個辦公室都聽到了。","a":"audio/dcc5ad1f42f.mp3"},"a":"audio/dfd940bde7f.mp3"},{"e":"Never mind, it's not important.","ok":false,"fb":"交期很重要，不能算了。","r":{"s":"MARCUS","e":"It's important to me.","z":"對我很重要。","a":"audio/dd9bd146c53.mp3"},"a":"audio/d37e323e1cb.mp3"}]},{"s":"MARCUS","e":"Thanks for calling. And Fancia, call me anytime. Diana can be tough, but I'm on your side.","z":"謝謝你的電話。Fancia，隨時打給我。Diana 很難搞，但我站你這邊。","a":"audio/d2d4cb7e4a9.mp3"},{"s":"VIC","e":"{Phone's been ringing off the hook|電話響個不停}, huh? Lunch? My treat.","z":"電話響不停吧？吃午餐？我請。","a":"audio/d0bc49074da.mp3"},{"s":"MARCUS","e":"You're starting to break up again.","z":"你又開始斷斷續續了。","a":"audio/dac41168fe6.mp3"}],"h":"📍 週四早上 10:00｜你的座位｜在場：Elaine、Vicky（不時經過）｜Ben 出差，電話全轉到你這｜目標：冷靜處理每一通電話","c":"午餐時，你收到 Ben 從機場傳的訊息：「明天早上 one-on-one。我們談談你這週的表現。」"},{"n":10,"t":"第一次 one-on-one","it":[{"s":"BEN","e":"Have a seat. I'll be direct. You did well with Raj and Diana. But you promised air freight without checking the cost first.","z":"坐。我直說：你處理 Raj 和 Diana 做得不錯，但你沒先查成本就答應空運。","a":"audio/dda9d63f8d7.mp3"},{"s":"F","e":"Fair enough. I should have checked with Linnea first.","z":"說得對，我應該先跟 Linnea 確認。","a":"audio/d6f3e11089a.mp3"},{"s":"BEN","e":"Good. That's constructive feedback, not criticism. I want you to take ownership, but be accountable for the numbers.","z":"很好。這是建設性的回饋，不是批評。我要你勇於負責，但也要為數字負責。","a":"audio/d258665293f.mp3"},{"s":"OREN","e":"(敲門) Mind if I join?","z":"（敲門）介意我加入嗎？","a":"audio/d579a099a29.mp3"},{"s":"BEN","e":"Come in. Oren is the one who'll coach you on the client side. I'm more hands-off.","z":"進來。Oren 會在客戶端帶你，我比較放手。","a":"audio/dacb9eeaa9f.mp3"},{"s":"OREN","e":"Ben says hands-off, but he'll micromanage your expense reports.","z":"Ben 說放手，但他會盯你的報帳盯到細節。","a":"audio/dbe8bbfc314.mp3"},{"s":"BEN","e":"Only because people put karaoke on them.","z":"那是因為有人把唱 KTV 報進去。","a":"audio/df4d609385f.mp3"},{"s":"OREN","e":"Fancia, what's your goal for the next three months?","z":"Fancia，你未來三個月的目標是什麼？","a":"audio/df214348cfd.mp3"},{"q":"Oren 問你的目標。最好的回答是？","o":[{"e":"To win Halden's trust back and bring in one new client. I'd also like to learn the supply side.","ok":true,"fb":"具體、跟團隊目標一致，又展現學習心。","r":{"s":"OREN","e":"Concrete and ambitious. I like it.","z":"具體又有企圖心，我喜歡。","a":"audio/df207204908.mp3"},"a":"audio/db99510d0f0.mp3"},{"e":"I don't know. Whatever you tell me.","ok":false,"fb":"沒有主見，主管會擔心。","r":{"s":"BEN","e":"That's not a goal. Think about it and come back to me.","z":"那不是目標。想清楚再來找我。","a":"audio/dd0d3634108.mp3"},"a":"audio/d3e8e323ef1.mp3"},{"e":"To get promoted as soon as possible.","ok":false,"fb":"太急功近利，時機不對。","r":{"s":"OREN","e":"Ha. Let's start with the first quarter.","z":"哈，先從第一季開始吧。","a":"audio/de2bb190794.mp3"},"a":"audio/de65095b5d9.mp3"}]},{"s":"BEN","e":"Good. We use OKRs here. Write one objective and three key results, and send them to me by Monday.","z":"好。我們用 OKR。寫一個目標和三個關鍵成果，週一前寄給我。","a":"audio/d1675672fe2.mp3"},{"s":"OREN","e":"And remember, morale matters. Give credit to Elaine and Vicky. They saved you this week.","z":"還有，士氣很重要。功勞要分給 Elaine 和 Vicky，這週是她們救了你。","a":"audio/d6cbad9b267.mp3"},{"s":"F","e":"I couldn't agree more.","z":"我完全同意。","a":"audio/d0408543eeb.mp3"},{"s":"BEN","e":"One more thing. Off the record: HQ is reviewing our branch's performance. Trust me, this quarter matters.","z":"還有一件事，私下講：總部在檢視我們分公司的績效。相信我，這一季很關鍵。","a":"audio/dff8ce8531b.mp3"}],"h":"📍 週五早上 9:30｜Ben 的辦公室｜在場：Ben，稍後 Oren 加入｜第一週的回顧面談｜目標：接受回饋、說出自己的想法","c":"你走出辦公室，在印表機旁看到一張忘了拿走的文件，標題是：「Restructure plan — Taipei branch — CONFIDENTIAL」。"},{"n":11,"t":"印表機旁的秘密","it":[{"s":"VIC","e":"Morning! Why do you look like you've seen a ghost?","z":"早！你怎麼像看到鬼一樣？","a":"audio/d89e82911d8.mp3"},{"s":"F","e":"Nothing. Someone left something on the printer.","z":"沒事。有人把東西留在印表機上。","a":"audio/daed43a6104.mp3"},{"q":"你看到機密文件，最專業的處理方式？","o":[{"e":"I'll put it in an envelope and give it back to Ben. Let's not talk about it.","ok":true,"fb":"尊重機密、不八卦，最專業。","r":{"s":"VIC","e":"…Okay. You're a good one, Fancia.","z":"……好。你人真好，Fancia。","a":"audio/dee8f346a0e.mp3"},"a":"audio/dce327ecfbb.mp3"},{"e":"Look, it says restructure! Are we getting fired?","ok":false,"fb":"公開散播，會造成恐慌。","r":{"s":"ELA","e":"Shh! Not in the pantry!","z":"噓！別在茶水間講！","a":"audio/d7a7a020d42.mp3"},"a":"audio/de3fa2b6a2a.mp3"},{"e":"I'll take a photo and send it to the group chat.","ok":false,"fb":"洩漏機密，可能違反員工手冊。","r":{"s":"VIC","e":"Are you crazy? That's against the employee handbook.","z":"你瘋了嗎？這違反員工手冊。","a":"audio/de83618f47c.mp3"},"a":"audio/db11e030524.mp3"}]},{"s":"ELA","e":"Anyway, did you fill in your leave request for the public holiday? The deadline is today.","z":"對了，國定假日的請假單你填了嗎？今天截止。","a":"audio/dcd87580446.mp3"},{"s":"F","e":"I can't even log in. My password expired.","z":"我連登入都不行，密碼過期了。","a":"audio/db3bb177ba5.mp3"},{"s":"ELA","e":"Call IT support, extension 300. Kevin is great.","z":"打給 IT，分機 300。Kevin 很厲害。","a":"audio/d41aef09f90.mp3"},{"s":"KEVIN","e":"IT, Kevin speaking. Let me guess, reset password?","z":"IT，我是 Kevin。我猜，重設密碼？","a":"audio/d33ce4f5ed3.mp3"},{"s":"F","e":"How did you know?","z":"你怎麼知道？","a":"audio/dab687aa9ca.mp3"},{"s":"KEVIN","e":"It's Friday. Okay, I've reset it. Don't save files on your desktop, by the way. Use the shared drive, it has a daily backup.","z":"今天週五嘛。好，重設了。對了，檔案別存桌面，用共用磁碟，每天有備份。","a":"audio/d6be0ae8b04.mp3"},{"s":"F","e":"Got it. And where are the templates for quotes?","z":"了解。報價的範本在哪？","a":"audio/dd27ded3236.mp3"},{"s":"KEVIN","e":"Shared drive, Sales folder, then Templates.","z":"共用磁碟，業務資料夾，再點範本。","a":"audio/d034c76c66a.mp3"},{"s":"VIC","e":"Also, there's a fire drill at three. Don't panic when the alarm goes off.","z":"還有三點有消防演習，警報響了別緊張。","a":"audio/dc3849f5f4f.mp3"},{"s":"ELA","e":"And the dress code for Monday is formal. HQ visitors.","z":"週一服裝要正式，總部有人來。","a":"audio/d190dd2df85.mp3"},{"s":"F","e":"HQ visitors? On Monday?","z":"總部的人？週一？","a":"audio/dd0b0d811ae.mp3"},{"s":"ELA","e":"There was an announcement in the internal newsletter. Didn't you read it?","z":"內部電子報有公告啊，你沒看？","a":"audio/d4e801fb4b9.mp3"},{"s":"KEVIN","e":"And my office hours are nine to six on working days. After that, email the help desk.","z":"我的服務時間是工作日九點到六點，之後請寄信給服務台。","a":"audio/de90f25398f.mp3"},{"s":"VIC","e":"Also, Ben left a memo on your desk. Something about a meeting in the conference room.","z":"還有，Ben 在你桌上留了一張備忘錄，好像是會議室開會的事。","a":"audio/dedda8e5a38.mp3"}],"h":"📍 週五早上 10:15｜茶水間與印表機區｜在場：Vicky、Elaine，IT 的 Kevin｜你看到一份機密文件｜目標：處理好敏感資訊，順便搞定電腦問題","c":"你打開內部電子報，來訪名單上第一個名字是：「Sharon Blake — VP, Asia Pacific — 負責分公司重組評估」。"},{"n":12,"t":"漲價通知","it":[{"s":"RAJ","e":"Thanks for joining. I'll share my screen. As you can see, raw materials went up eighteen percent YoY.","z":"謝謝參加，我分享畫面。如各位所見，原物料年增 18%。","a":"audio/da791ec7a46.mp3"},{"s":"BEN","e":"And your offer?","z":"那你的方案呢？","a":"audio/d45dbc411ba.mp3"},{"s":"RAJ","e":"A twelve percent price increase from next quarter. It's non-negotiable, I'm afraid.","z":"下季起漲 12%。恐怕這沒得談。","a":"audio/d520b47cc13.mp3"},{"s":"LIN","e":"Twelve percent wipes out our margin on half our products.","z":"漲 12% 會吃掉我們一半產品的毛利。","a":"audio/d7fa1c8cf30.mp3"},{"s":"BEN","e":"Everything is negotiable, Raj. Give me a ballpark figure for a smaller increase if we sign a long-term contract.","z":"什麼都能談，Raj。如果我們簽長約，給我一個漲幅小一點的大概數字。","a":"audio/dc99466512c.mp3"},{"s":"RAJ","e":"Two years? Maybe eight percent.","z":"兩年？也許 8%。","a":"audio/d9dd4977f65.mp3"},{"q":"你想幫 Ben 爭取更好的條件，提出什麼最有效？","o":[{"e":"What if we commit to a higher volume? Would a volume discount bring it down to five percent?","ok":true,"fb":"用承諾量換折扣，是典型的交換條件。","r":{"s":"RAJ","e":"Five is tough. Six, with a two-year commitment.","z":"五很難，簽兩年的話六。","a":"audio/d6e289e1a86.mp3"},"a":"audio/db209d6bbcc.mp3"},{"e":"Five percent, take it or leave it.","ok":false,"fb":"太強硬，可能談判破局。","r":{"s":"RAJ","e":"Then I'll leave it.","z":"那我就不要了。","a":"audio/ddd24d4980c.mp3"},"a":"audio/db4b4b90310.mp3"},{"e":"Okay, twelve is fine.","ok":false,"fb":"直接接受，沒有爭取。","r":{"s":"LIN","e":"(傳訊息) WHAT?!","z":"（傳訊息）什麼？！","a":"audio/d2bf4379e12.mp3"},"a":"audio/d079c9143ce.mp3"}]},{"s":"BEN","e":"Six percent, but we want flexible payment terms. Net sixty.","z":"6%，但我們要彈性的付款條件，60 天。","a":"audio/d7dc0ee2985.mp3"},{"s":"RAJ","e":"Net forty-five. That's my final offer.","z":"45 天，這是我最後的條件。","a":"audio/de33b93b7ff.mp3"},{"s":"LIN","e":"(小聲) That works for our cash flow.","z":"（小聲）這樣我們現金流可以。","a":"audio/d91d136e374.mp3"},{"s":"BEN","e":"Deal, in principle. Send us the draft contract and we'll have legal review the fine print.","z":"原則上成交。把合約草稿寄來，我們請法務看細節。","a":"audio/dfa5b243a26.mp3"},{"s":"RAJ","e":"Pleasure doing business, as always.","z":"一如往常，合作愉快。","a":"audio/dac6ed5790d.mp3"},{"s":"BEN","e":"Fancia, nice move. A trade-off, not a surrender.","z":"Fancia，做得好。這叫交換條件，不是投降。","a":"audio/d7d5bcbc06d.mp3"},{"s":"F","e":"But Ben… we promised Halden we'd tell them before any price increase.","z":"可是 Ben……我們答應過 Halden，漲價前一定先通知。","a":"audio/dd60d3e4970.mp3"}],"h":"📍 週一下午 3:00｜視訊會議｜在場：Ben、Linnea、供應商 Raj｜Raj 正式提出下季漲價｜目標：談出對雙方都能接受的條件","c":"Ben 的表情僵住：「你怎麼知道這件事？」"},{"n":13,"t":"法務的紅筆","it":[{"s":"PRIYA","e":"I've done a legal review of Delta's draft. Overall it's fine, but a few clauses worry me.","z":"我審完 Delta 的草稿了。整體可以，但有幾條讓我擔心。","a":"audio/d9219832290.mp3"},{"s":"BEN","e":"Let me guess. The penalty clause.","z":"我猜，罰則條款。","a":"audio/d03b859c810.mp3"},{"s":"PRIYA","e":"Yes. If we order less than the minimum, we pay a penalty. But if they deliver late, they're not liable for anything.","z":"對。我們訂得少於最低量要罰錢，但他們晚交貨卻完全不用負責。","a":"audio/d5ef909374e.mp3"},{"s":"F","e":"That's a win-lose deal.","z":"那是一贏一輸的交易。","a":"audio/d1451367e6d.mp3"},{"s":"PRIYA","e":"Exactly. Also, the force majeure clause is too broad. \"Supply shortage\" counts as force majeure here.","z":"沒錯。另外不可抗力條款太寬，這裡連「供應短缺」都算不可抗力。","a":"audio/da4b4f31059.mp3"},{"s":"BEN","e":"That's a deal-breaker. A shortage is exactly what just happened.","z":"這是破局點。缺料正是剛剛發生的事。","a":"audio/d20280000a3.mp3"},{"s":"PRIYA","e":"I'll draft a clause amendment. We also need an NDA, since we'll share our forecast with them.","z":"我會擬條款修正。我們還要簽保密協議，因為要分享預測給他們。","a":"audio/da56b0fb512.mp3"},{"s":"F","e":"Is an MOU legally binding? Raj mentioned one.","z":"MOU 有法律約束力嗎？Raj 提過。","a":"audio/d05b4d1db52.mp3"},{"s":"PRIYA","e":"Usually not, except for the confidential parts. The contract is what's binding.","z":"通常沒有，機密條款除外。真正有約束力的是合約。","a":"audio/d0a93ff1484.mp3"},{"q":"Ben 要你負責追進度。你怎麼跟 Priya 確認下一步？","o":[{"e":"So the next steps are: you send the amendment, I forward it to Raj, and we aim to sign by Friday?","ok":true,"fb":"摘要下一步並確認時程，很清楚。","r":{"s":"PRIYA","e":"Exactly. And keep me in the loop on his reply.","z":"對，他回覆時記得讓我知道。","a":"audio/db3784bcdd9.mp3"},"a":"audio/d437c7ab354.mp3"},{"e":"Okay, bye.","ok":false,"fb":"沒確認任何事。","r":{"s":"BEN","e":"Wait. Who does what?","z":"等等，誰做什麼？","a":"audio/d36d12272b0.mp3"},"a":"audio/d0e22999d51.mp3"},{"e":"Can we skip legal and just sign?","ok":false,"fb":"跳過法務很危險。","r":{"s":"PRIYA","e":"Not unless you enjoy lawsuits.","z":"除非你喜歡打官司。","a":"audio/dd831fe2e7a.mp3"},"a":"audio/d89ae3de028.mp3"}]},{"s":"PRIYA","e":"One more thing. The effective date and expiration date are missing from the appendix. And the renewal is automatic.","z":"還有，附錄缺生效日和到期日，而且是自動續約。","a":"audio/dc88da9fd37.mp3"},{"s":"BEN","e":"Automatic renewal. Of course. Good job, Priya.","z":"自動續約，果然。Priya 做得好。","a":"audio/d7614b94480.mp3"},{"s":"BEN","e":"Fancia, about Halden and the price increase. Stay after this.","z":"Fancia，Halden 漲價的事，會後留下。","a":"audio/de470b1ba2c.mp3"}],"h":"📍 週二早上 10:00｜法務部小會議室｜在場：Ben、法務顧問 Priya｜審閱 Raj 的合約草稿｜目標：看懂關鍵條款，找出風險","c":"等 Priya 離開，Ben 坐下來：「那封信是我寫的。但當時我沒有權限做那個承諾——是 Oren 叫我寫的。」"},{"n":14,"t":"誰去告訴 Halden？","it":[{"s":"OREN","e":"This place has the best beef noodles in the area. {It's on me|我請客}.","z":"這家牛肉麵是這區最好吃的，我請。","a":"audio/d39f4509505.mp3"},{"s":"ELA","e":"Then I'll get the large one.","z":"那我要大碗的。","a":"audio/dd3236d9175.mp3"},{"s":"F","e":"Oren, can I ask you something? It's a bit sensitive.","z":"Oren，我可以問你一件事嗎？有點敏感。","a":"audio/d351b22ebd4.mp3"},{"s":"OREN","e":"Sure. Shoot.","z":"當然，說吧。","a":"audio/d3d7ddb33b5.mp3"},{"q":"你要問 Oren 關於漲價承諾，最得體的開場？","o":[{"e":"Ben mentioned the promise to Halden about price increases. I'd like to understand the background before we tell them.","ok":true,"fb":"客觀陳述、說明目的，不指責。","r":{"s":"OREN","e":"…Fair question. Here's what happened.","z":"……問得好。事情是這樣的。","a":"audio/d1b88cfecf6.mp3"},"a":"audio/db49f1aa241.mp3"},{"e":"Did you make Ben lie to Halden?","ok":false,"fb":"太像指控，會讓氣氛很僵。","r":{"s":"OREN","e":"Lie? That's a strong word.","z":"說謊？這詞很重。","a":"audio/d3c01772a12.mp3"},"a":"audio/d175c0a879a.mp3"},{"e":"Never mind, it's nothing.","ok":false,"fb":"逃避問題，事情不會消失。","r":{"s":"ELA","e":"It's clearly something.","z":"明明就有事。","a":"audio/dbfdc87ba54.mp3"},"a":"audio/d614debd221.mp3"}]},{"s":"OREN","e":"Two years ago we almost lost Halden. I asked Ben to reassure them. It was a win-back move, and it worked.","z":"兩年前我們差點丟了 Halden，我請 Ben 安撫他們。那是挽回客戶的一招，也成功了。","a":"audio/d453aba2c6e.mp3"},{"s":"OREN","e":"To be honest, I should have put it through legal. My bad.","z":"老實說，我應該先過法務。是我的錯。","a":"audio/d5524e39dae.mp3"},{"s":"F","e":"So now we need to tell them about the six percent before the contract with Delta is signed.","z":"所以我們得在跟 Delta 簽約前，先告訴他們漲 6% 的事。","a":"audio/d4ab6ccfaf9.mp3"},{"s":"OREN","e":"Right. Transparency is the only way. Will you do it with me? Diana trusts people who are straight with her.","z":"對。透明是唯一的方法。你願意跟我一起嗎？Diana 信任對她坦白的人。","a":"audio/dadfc032401.mp3"},{"s":"F","e":"Sure. But we need a sweetener. Maybe extended warranty or free samples of the new model?","z":"好。但我們需要一點甜頭，也許延長保固或新型號的免費樣品？","a":"audio/d2022ada0e9.mp3"},{"s":"OREN","e":"Now you're thinking like a salesperson.","z":"你現在像個業務了。","a":"audio/dacbc62d191.mp3"},{"s":"ELA","e":"{Can we eat now? My noodles are getting cold|可以吃了嗎？我的麵要冷了}.","z":"可以吃了嗎？我的麵要冷了。","a":"audio/d80a4dcd3ff.mp3"}],"h":"📍 週二中午 12:30｜公司樓下的麵店｜在場：Oren、Elaine｜午餐時跟 Oren 談漲價承諾｜目標：用委婉的方式提出敏感問題","c":"回到辦公室，Diana 的信先到了：「聽說你們供應商要漲價。是真的嗎？為什麼我是從 Vexa 那裡聽說的？」"},{"n":15,"t":"先發制人","it":[{"s":"DIANA","e":"I'll be honest, I'm frustrated. I don't like hearing about your prices from your competitor.","z":"老實說我很不爽，我不喜歡從你們對手那裡聽到你們的價格。","a":"audio/dcc9321c5b3.mp3"},{"s":"OREN","e":"I understand, and I apologize sincerely. You should have heard it from us first.","z":"我理解，我誠心道歉。你應該先從我們這裡聽到。","a":"audio/dfe9a24d3f8.mp3"},{"s":"F","e":"Let me clarify the numbers. Our supplier's increase is six percent. We're proposing to pass on only three percent to Halden.","z":"我來釐清數字。供應商漲 6%，我們提議只轉嫁 3% 給 Halden。","a":"audio/d0dde6a17a5.mp3"},{"s":"MARCUS","e":"Three percent from when?","z":"3% 從什麼時候開始？","a":"audio/d7b3f8f9a96.mp3"},{"s":"F","e":"From the next fiscal year, so you have six months to adjust your budget.","z":"從下個會計年度開始，你們有六個月可以調整預算。","a":"audio/db810d38219.mp3"},{"s":"DIANA","e":"And what do we get in exchange for accepting it?","z":"我們接受的話，換來什麼？","a":"audio/dc70069d2a0.mp3"},{"q":"Diana 要交換條件。你要提出補償，哪個最好？","o":[{"e":"A two-year warranty instead of one, and free samples of our new model for your engineers.","ok":true,"fb":"有價值、成本可控的補償。","r":{"s":"MARCUS","e":"Engineers love free samples. Diana, that's not bad.","z":"工程師最愛免費樣品。Diana，這不錯。","a":"audio/dd461ee82a7.mp3"},"a":"audio/d807af5f9ca.mp3"},{"e":"We'll give you everything for free.","ok":false,"fb":"不切實際，聽起來沒誠意。","r":{"s":"DIANA","e":"Nothing is free, Fancia.","z":"天下沒有白吃的午餐，Fancia。","a":"audio/dfc66e7502a.mp3"},"a":"audio/dbe942379dc.mp3"},{"e":"Nothing. That's the market.","ok":false,"fb":"太冷漠，客戶會走。","r":{"s":"DIANA","e":"Then the market has other suppliers.","z":"那市場上還有別的供應商。","a":"audio/d9dc88e9639.mp3"},"a":"audio/dbdb538d27b.mp3"}]},{"s":"DIANA","e":"Hmm. I'll need to reconsider our budget. I can't accept this today, but I won't reject it either.","z":"嗯，我得重新考慮預算。我今天不能接受，但也不會拒絕。","a":"audio/d3bf192d950.mp3"},{"s":"OREN","e":"That's fair. Shall we touch base next week?","z":"合理。我們下週再聯繫？","a":"audio/d118ec413f1.mp3"},{"s":"DIANA","e":"Fine. And Oren, one more surprise and we walk away.","z":"可以。Oren，再有一次驚喜，我們就走人。","a":"audio/dc5447278e0.mp3"},{"s":"OREN","e":"Point taken.","z":"收到。","a":"audio/d8110f6bc47.mp3"},{"s":"MARCUS","e":"(視訊結束前私訊) {Nicely done|做得漂亮}. She's softer than she sounds.","z":"（會後私訊）做得好。她其實沒聽起來那麼兇。","a":"audio/d40b9a00724.mp3"}],"h":"📍 週三早上 9:00｜視訊會議｜在場：Oren、Diana、Marcus｜在 Vexa 之前把漲價說清楚｜目標：坦白、提出補償方案、保住客戶","c":"Vicky 傳訊息來：「快來倉庫。Halden 退回一整個棧板——說是有瑕疵品。」"},{"n":16,"t":"瑕疵品","it":[{"s":"VIC","e":"Here it is. Two hundred units. The customer complaint log says \"connectors don't fit.\"","z":"就是這些，兩百件。客訴紀錄寫「接頭插不進去」。","a":"audio/dd463542658.mp3"},{"s":"TOM","e":"I'll troubleshoot. Step by step: first check the spec, then the batch number.","z":"我來排查。一步步來：先看規格，再看批號。","a":"audio/d960cd9d7fc.mp3"},{"s":"F","e":"Is it a defect from the factory or damaged goods from transport?","z":"是工廠的瑕疵，還是運送時的損壞？","a":"audio/d303f2a7535.mp3"},{"s":"TOM","e":"The boxes look fine, so probably not transport. Let me check the quality control records.","z":"箱子看起來沒事，應該不是運送問題。我查一下品管紀錄。","a":"audio/d1cb6b41ef8.mp3"},{"d":"十分鐘後"},{"s":"TOM","e":"Found it. Halden sent us a change request for a new connector size last month. Our production didn't update the BOM.","z":"找到了。Halden 上個月送了接頭尺寸的變更需求，我們生產端沒更新物料清單。","a":"audio/d6d2f0788e0.mp3"},{"s":"ELA","e":"So it's our mistake.","z":"所以是我們的錯。","a":"audio/db55939a1b4.mp3"},{"q":"這是我方錯誤。你要給 Halden 什麼處理方案？","o":[{"e":"We'll send a replacement for all two hundred units by courier, and I'll send an apology letter with the root cause.","ok":true,"fb":"換貨、快遞、附原因說明，負責任又具體。","r":{"s":"VIC","e":"I can dispatch the replacements tomorrow morning.","z":"我明早就能出換貨。","a":"audio/d667595328d.mp3"},"a":"audio/d49a3069757.mp3"},{"e":"Let's just give them a refund and forget it.","ok":false,"fb":"退款不能解決他們缺料的問題。","r":{"s":"ELA","e":"They need parts, not money.","z":"他們要的是零件，不是錢。","a":"audio/d8f850975fa.mp3"},"a":"audio/d2add2695bf.mp3"},{"e":"Let's say it's their fault, they changed the spec.","ok":false,"fb":"推卸責任，客戶會更生氣。","r":{"s":"TOM","e":"They told us. We missed it.","z":"他們有通知，是我們漏了。","a":"audio/d995e21de69.mp3"},"a":"audio/d880bfcfca5.mp3"}]},{"s":"F","e":"Do we have the new version in stock?","z":"新版有現貨嗎？","a":"audio/d16ddc3883a.mp3"},{"s":"VIC","e":"Only one hundred fifty. The rest is out of stock. I'll reorder today.","z":"只有一百五十件，其他沒貨了，我今天就補訂。","a":"audio/d8d4a0b1467.mp3"},{"s":"ELA","e":"I'll get a tracking number to Marcus as soon as it ships.","z":"一出貨我就把追蹤號碼給 Marcus。","a":"audio/d5e122f924e.mp3"},{"s":"F","e":"And this is a warranty claim, so Linnea should know.","z":"這也算保固索賠，Linnea 要知道。","a":"audio/d940331e9cf.mp3"},{"s":"VIC","e":"{Look at you|看看你}, two weeks in and already speaking our language.","z":"你看你，才來兩週就講我們的行話了。","a":"audio/d42300a8704.mp3"}],"h":"📍 週三下午 2:00｜倉庫・退貨區｜在場：Vicky、Elaine，品管的 Tom｜Halden 退回疑似瑕疵品｜目標：查清原因，安排換貨","c":"你寫完道歉信準備寄出，卻發現 Ben 已經回覆了 Marcus（全部回覆，副本總部）：「Halden 的變更需求從未被正式提交。」"},{"n":17,"t":"總部來的 VP","it":[{"s":"SHARON","e":"Good morning, everyone. Thanks for coming to this all-hands meeting. I'll give a quick overview, then open the floor.","z":"大家早安，謝謝參加全員大會。我先簡單概述，然後開放發言。","a":"audio/dc7032a5551.mp3"},{"s":"SHARON","e":"Headquarters wants every branch office to hit its KPIs. Taipei is slightly behind.","z":"總部要求每家分公司達成 KPI，台北稍微落後。","a":"audio/d38f6b1753a.mp3"},{"s":"BEN","e":"If I may make a point, the Halden situation accounts for most of that gap.","z":"容我說一點，差距大部分來自 Halden 的狀況。","a":"audio/df9de5c9566.mp3"},{"s":"SHARON","e":"Noted. But I'm not here to point fingers. I want input from everyone. Who'd like to weigh in?","z":"收到。但我不是來追究責任的，我想聽每個人的意見。誰想發表看法？","a":"audio/d0cb8dbfe80.mp3"},{"q":"Sharon 開放發言。你剛來不久，要不要說？怎麼說？","o":[{"e":"Quick question: could we get a cross-functional standup meeting each morning? Sales, warehouse and shipping often aren't on the same page.","ok":true,"fb":"提出具體、可行、跨部門的改善，很加分。","r":{"s":"SHARON","e":"Good idea. Ben, can we try that?","z":"好主意。Ben，可以試試嗎？","a":"audio/de584e5a071.mp3"},"a":"audio/d29fd185be1.mp3"},{"e":"(什麼都不說，滑手機)","ok":false,"fb":"大會上滑手機很扣分。","r":{"s":"OREN","e":"(小聲) Phone down.","z":"（小聲）手機放下。","a":"audio/d50cb4f7c1a.mp3"},"a":null},{"e":"Everything is Ben's fault.","ok":false,"fb":"公開怪主管，非常不專業。","r":{"s":"ELA","e":"(倒抽一口氣)","z":"（倒抽一口氣）","a":null},"a":"audio/dd5cc1ddcc8.mp3"}]},{"s":"VIC","e":"I second that. Half my problems come from late information.","z":"我附議。我一半的問題都來自資訊太晚。","a":"audio/d155fe0d0c1.mp3"},{"s":"SHARON","e":"Let's see a show of hands. Who supports a fifteen-minute daily standup?","z":"舉手表決一下，誰支持每天十五分鐘站立會議？","a":"audio/d10cf7ede71.mp3"},{"s":"SHARON","e":"Unanimous. Great. Ben, you'll be the facilitator. Let's stick to the agenda. Next item: headcount.","z":"全票通過。很好，Ben 你來主持。我們照議程走，下一項：人力編制。","a":"audio/dabf76981f2.mp3"},{"s":"OREN","e":"Sorry to interrupt, but should we take that offline? It's a sensitive topic.","z":"抱歉打斷，那個要不要會後再談？話題比較敏感。","a":"audio/d2ba181bcde.mp3"},{"s":"SHARON","e":"Fair. Let's take a break. Ten minutes.","z":"有道理。休息十分鐘。","a":"audio/dc6ff0e63f2.mp3"},{"d":"休息時間"},{"s":"SHARON","e":"Fancia, right? You spoke up. I like that. Let's grab a coffee sometime.","z":"你是 Fancia 對吧？你敢發言，我喜歡。找時間一起喝杯咖啡。","a":"audio/d460157a6b6.mp3"},{"s":"F","e":"My pleasure.","z":"很樂意。","a":"audio/d63e4ce8839.mp3"},{"s":"SHARON","e":"For the next session, we'll split into a breakout session of four groups.","z":"下一段我們分成四組進行分組討論。","a":"audio/db9476f7165.mp3"},{"s":"SHARON","e":"Every attendee, please speak into the microphone so people dialing in can hear you.","z":"每位與會者發言時請對著麥克風，讓線上的人聽得到。","a":"audio/d8123c7a305.mp3"},{"s":"OREN","e":"Who needs to dial in? I'll send the link.","z":"誰需要線上撥入？我來寄連結。","a":"audio/da4aa60871d.mp3"}],"h":"📍 週四早上 9:00｜大會議室・全員大會｜在場：總部 VP Sharon、Ben、Oren、全體同事｜Sharon 主持分公司全員大會｜目標：在大會上適時發言，替團隊說話","c":"會議結束時，Sharon 宣布：「下個月起，台北要接一個新專案——幫 Halden 客製新產品。專案經理……我想讓 Fancia 試試。」全場安靜。Ben 的臉色很難看。"},{"n":18,"t":"專案啟動","it":[{"s":"F","e":"Thanks, everyone. This is the kick-off for Project Falcon. Let me share the kickoff deck.","z":"謝謝各位。這是獵鷹專案的啟動會議，我分享一下啟動簡報。","a":"audio/d07a4b98bad.mp3"},{"s":"F","e":"Here's the project charter. The scope is a customized connector for Halden's new device. The first milestone is a prototype in six weeks.","z":"這是專案章程。範圍是幫 Halden 新設備客製一款接頭。第一個里程碑是六週內做出原型。","a":"audio/d1b2e817a06.mp3"},{"s":"MARCUS","e":"Six weeks works. What are the deliverables?","z":"六週可以。交付項目有哪些？","a":"audio/daa26ba441b.mp3"},{"s":"F","e":"A prototype, a test report and a mass production plan. Here's the timeline on the Gantt chart.","z":"原型、測試報告和量產計畫。時程在甘特圖上。","a":"audio/d43f8cba7a7.mp3"},{"s":"TOM","e":"The critical path is testing. If testing slips, everything slips.","z":"關鍵路徑是測試。測試延遲，全部都會延遲。","a":"audio/d795155dde9.mp3"},{"s":"BEN","e":"Then build in a buffer. Two weeks minimum.","z":"那就留緩衝，至少兩週。","a":"audio/d4c2b61ec7f.mp3"},{"s":"F","e":"Agreed. Now, roles. Tom is in charge of quality, Vicky owns materials, Elaine handles logistics. I'll be the project manager.","z":"同意。接下來是分工：Tom 負責品質，Vicky 負責物料，Elaine 負責物流，我擔任專案經理。","a":"audio/ddfcf1dbf81.mp3"},{"s":"VIC","e":"Fine, but my workload is already crazy. I don't have the bandwidth for daily reports.","z":"好，但我的工作量已經爆了，沒餘力每天寫報告。","a":"audio/da6817a48ad.mp3"},{"q":"Vicky 說她沒時間。你要怎麼回應才能兼顧進度和同事？","o":[{"e":"Understood. Let's do a weekly status report instead, and you just flag any blockers in the morning standup.","ok":true,"fb":"調整做法減輕負擔，同時保留風險預警。","r":{"s":"VIC","e":"That I can do. Thanks.","z":"這我做得到，謝謝。","a":"audio/d2ac9c0339e.mp3"},"a":"audio/dc958ce4810.mp3"},{"e":"Sorry, it's required. Do it anyway.","ok":false,"fb":"硬性要求，可能打擊士氣。","r":{"s":"VIC","e":"(翻白眼) Fine.","z":"（翻白眼）好啦。","a":"audio/d513145cae7.mp3"},"a":"audio/dfbc16cc9e0.mp3"},{"e":"Okay, then don't report anything.","ok":false,"fb":"完全不追蹤，專案會失控。","r":{"s":"BEN","e":"That's not how projects work.","z":"專案不是這樣做的。","a":"audio/db621146df9.mp3"},"a":"audio/dc7598745c7.mp3"}]},{"s":"BEN","e":"And the stakeholders? Sharon will want updates.","z":"那利害關係人呢？Sharon 會要進度。","a":"audio/d7a2950aaf3.mp3"},{"s":"F","e":"I'll send a status update every Friday. Any risk goes into our risk mitigation plan and gets escalated to you.","z":"我每週五寄進度更新。任何風險都會寫進風險控管計畫，並往上呈報給你。","a":"audio/d1f4f9f471a.mp3"},{"s":"BEN","e":"Fine. Don't let me find out about problems from someone else.","z":"好。別讓我從別人口中聽到問題。","a":"audio/dd939df1f4c.mp3"},{"s":"MARCUS","e":"Great start. Oh, one small thing…","z":"很好的開始。喔，有件小事……","a":"audio/d498b13630f.mp3"},{"s":"F","e":"And resource allocation: Tom's team gets two engineers, full-time, until the prototype.","z":"資源分配：Tom 的團隊在原型完成前有兩位全職工程師。","a":"audio/de16b7f2dc3.mp3"}],"h":"📍 週一早上 10:00｜會議室 A｜在場：Ben、Vicky、Elaine、品管 Tom、Halden 的 Marcus（視訊）｜你主持客製專案的啟動會議｜目標：講清楚範圍、時程與分工","c":"Marcus 笑著說：「我們的工程師想再加兩個功能。應該不會影響時程吧？」Tom 在桌下踢了你一腳——範圍蔓延開始了。"},{"n":19,"t":"範圍蔓延","it":[{"s":"MARCUS","e":"So, the two new features: waterproofing and a higher power rating. Our engineers say it's a small change.","z":"兩個新功能：防水和更高的額定功率。我們工程師說只是小改動。","a":"audio/d0ea090f4cc.mp3"},{"s":"TOM","e":"It isn't small. Waterproofing changes the materials. That's a new dependency on another supplier.","z":"不小。防水會改材料，這會多出對另一家供應商的依賴。","a":"audio/d2f2682c4ad.mp3"},{"q":"Marcus 想加功能。你怎麼回應最專業？","o":[{"e":"We can do it, but it's outside the original scope. Let's file a change request so we can estimate the impact on cost and timeline.","ok":true,"fb":"不拒絕，但走正式流程評估影響。","r":{"s":"MARCUS","e":"Fair enough. Send me the form.","z":"合理，表單寄給我。","a":"audio/da667168284.mp3"},"a":"audio/d067ccdd386.mp3"},{"e":"Sure, no problem, we'll add it for free.","ok":false,"fb":"隨口答應，專案會爆。","r":{"s":"TOM","e":"(靜音後) Are you kidding me?","z":"（關麥後）你在開玩笑嗎？","a":"audio/d899b6aa4ac.mp3"},"a":"audio/d2bd1ed9d8e.mp3"},{"e":"No. We won't change anything.","ok":false,"fb":"太強硬，客戶會不滿。","r":{"s":"MARCUS","e":"That's a bit inflexible.","z":"這有點沒彈性。","a":"audio/d06e6a83ef6.mp3"},"a":"audio/d01d295309c.mp3"}]},{"s":"MARCUS","e":"How much of a setback are we talking about?","z":"會延誤多少？","a":"audio/db550bb6bbe.mp3"},{"s":"TOM","e":"My estimate is three weeks. We'd need to redo the prototype phase.","z":"我估三週，原型階段要重做。","a":"audio/dbd697e0626.mp3"},{"s":"F","e":"Or there's a workaround. We could deliver the original design on time, then add waterproofing in phase two.","z":"或者有替代方案：原設計準時交，防水放到第二階段。","a":"audio/d7a892a4623.mp3"},{"s":"MARCUS","e":"Phase two. I like it. Our launch is in two stages anyway.","z":"第二階段，我喜歡。反正我們上市也分兩階段。","a":"audio/d9ef125d559.mp3"},{"s":"BEN","e":"(私訊你) That's how you avoid scope creep. Good.","z":"（私訊）這就是避免範圍蔓延的方法。很好。","a":"audio/dd3d9fcb7f0.mp3"},{"s":"F","e":"Great. I'll update the roadmap and the project scope statement, and send them for your sign-off.","z":"好，我會更新路線圖和範圍說明書，寄給您簽核。","a":"audio/d96a059f94f.mp3"},{"s":"MARCUS","e":"Perfect. Oh, and before I forget, quick question about the samples you promised Diana. Are they ahead of schedule?","z":"太好了。對了，問個問題，你答應 Diana 的樣品有提前嗎？","a":"audio/d309dd418d7.mp3"},{"s":"F","e":"Let me check and get back to you.","z":"我查一下再回覆你。","a":"audio/d1af33509a2.mp3"},{"d":"掛斷後"},{"s":"TOM","e":"{You owe me one|你欠我一次}. And a beer.","z":"你欠我一次，還有一杯啤酒。","a":"audio/d8e31253741.mp3"}],"h":"📍 週三下午 4:00｜視訊會議｜在場：Marcus、Tom、Ben（旁聽）｜Halden 要加功能｜目標：不得罪客戶，又守住範圍與時程","c":"你打給 Vicky 確認樣品，她語氣緊張：「樣品需要的晶片，晶圓廠剛說要延後一個月。整個半導體業都缺貨。」"},{"n":20,"t":"晶片危機","it":[{"s":"VIC","e":"You're on speaker, Raj. Fancia's here too.","z":"Raj，你在擴音上，Fancia 也在。","a":"audio/d1bb1eabc31.mp3"},{"s":"RAJ","e":"Hi both. Bad news. The foundry gave priority to bigger customers. Wafer supply is tight across the board.","z":"兩位好。壞消息：晶圓代工廠優先供貨給大客戶，晶圓供應全面吃緊。","a":"audio/de05686b57e.mp3"},{"s":"F","e":"Could you explain what that means for our lead time?","z":"可以解釋一下這對我們的交期有什麼影響嗎？","a":"audio/d0503c358af.mp3"},{"s":"RAJ","e":"Normally twelve weeks. Now it's twenty. Supply and demand. AI servers and data centers are buying everything.","z":"平常十二週，現在二十週。供需問題，AI 伺服器和資料中心把貨都買光了。","a":"audio/d97f0e3a217.mp3"},{"s":"ELA","e":"And with the new tariff, chips from some countries cost more to import.","z":"而且有了新關稅，從某些國家進口晶片更貴。","a":"audio/d7a52205888.mp3"},{"s":"VIC","e":"That's why everyone talks about reshoring and nearshoring now.","z":"所以現在大家都在談回流和近岸生產。","a":"audio/df9cf6e726e.mp3"},{"s":"F","e":"Do we have a second source?","z":"我們有第二供應來源嗎？","a":"audio/d01ca704a1e.mp3"},{"s":"RAJ","e":"An OEM in Malaysia. Slightly more expensive, but available.","z":"馬來西亞有一家代工廠，稍貴一點，但有貨。","a":"audio/d1f5c98f2f5.mp3"},{"q":"你需要決定要不要用第二供應來源。你該怎麼做？","o":[{"e":"Sounds good, but let me run the numbers with Linnea and check with Tom about the spec before we commit.","ok":true,"fb":"先確認成本與規格再決定，穩健。","r":{"s":"RAJ","e":"Smart. I'll send you their specification sheet.","z":"聰明，我把他們的規格表寄給你。","a":"audio/d4328c4c1d7.mp3"},"a":"audio/d533c894a93.mp3"},{"e":"Buy it now. Whatever the price.","ok":false,"fb":"不看成本就買，Linnea 會崩潰。","r":{"s":"VIC","e":"Linnea will kill you. Then me.","z":"Linnea 會殺了你，然後殺我。","a":"audio/d5d7f456941.mp3"},"a":"audio/dff822148c6.mp3"},{"e":"Let's just wait for the foundry.","ok":false,"fb":"被動等待，樣品會延誤。","r":{"s":"ELA","e":"Marcus won't wait twenty weeks.","z":"Marcus 不會等二十週的。","a":"audio/d8d08292451.mp3"},"a":"audio/d394d138a23.mp3"}]},{"s":"VIC","e":"This is why I hate just-in-time. No buffer stock, no mercy.","z":"這就是我討厭及時生產的原因。沒有安全庫存，就沒有活路。","a":"audio/da75e2e58a2.mp3"},{"s":"RAJ","e":"Also, our new automation line had some downtime. A software update had a bug.","z":"還有，我們新的自動化產線停機了一陣子，有個軟體更新有 bug。","a":"audio/d7f96bc7911.mp3"},{"s":"F","e":"Is it fixed?","z":"修好了嗎？","a":"audio/d6643a5bb53.mp3"},{"s":"RAJ","e":"The firmware patch is coming. Bear with me, I'll keep you posted.","z":"韌體修補程式快好了，請耐心等等，我會隨時通知你。","a":"audio/d0277ba52ad.mp3"},{"s":"VIC","e":"{Welcome to supply chain|歡迎來到供應鏈的世界}. Every day is a new disaster.","z":"歡迎來到供應鏈，每天都有新災難。","a":"audio/d6517a9c3d5.mp3"},{"s":"RAJ","e":"The whole semiconductor industry is short. Even the big players miss estimates this year.","z":"整個半導體產業都缺貨，今年連大廠都沒達到預估。","a":"audio/d2a275d9012.mp3"}],"h":"📍 週四早上 11:00｜倉庫辦公室｜在場：Vicky、Raj（電話擴音）、Elaine｜晶片缺貨影響樣品｜目標：了解供應鏈問題，找出替代方案","c":"下午，Sharon 寄來一封信：「Fancia，下個月新加坡電子展，我要你代表台北去參展。順便——帶 Oren 去見一位新創創辦人。」"},{"n":21,"t":"參展前的行銷會議","it":[{"s":"MIA","e":"Okay, the trade show. Our goal is brand awareness and lead generation. Who's our target audience?","z":"好，談展覽。目標是品牌知名度和開發潛在客戶。我們的目標受眾是誰？","a":"audio/d5e1821b788.mp3"},{"s":"OREN","e":"Mid-size electronics makers in Southeast Asia. That's a niche market, but it's growing fast.","z":"東南亞中型電子廠。那是利基市場，但成長很快。","a":"audio/db21fdf0fac.mp3"},{"s":"MIA","e":"Then our positioning is \"reliable parts, fast delivery.\" That's our USP.","z":"那我們的定位就是「可靠零件、快速交貨」，這是我們的獨特賣點。","a":"audio/d8a12d94c23.mp3"},{"s":"LIN","e":"And the budget allocation? The exhibition booth alone costs twenty thousand.","z":"預算怎麼分？光展位就要兩萬。","a":"audio/db387c83ebb.mp3"},{"s":"MIA","e":"I'd like to suggest we spend less on giveaways and more on a live demo.","z":"我建議贈品少花一點，多花在現場展示。","a":"audio/d9877a412ac.mp3"},{"s":"F","e":"Agreed. Pens with our logo don't win a client.","z":"同意。印了 logo 的筆贏不到客戶。","a":"audio/d58dc4b9a1e.mp3"},{"s":"MIA","e":"Ha. Also, a social media campaign before the show. A short video, maybe an influencer from the industry.","z":"哈。展前也要做社群行銷，短影片，或找業界網紅。","a":"audio/dd68bd0e6ad.mp3"},{"q":"Linnea 擔心花錢。你要怎麼支持 Mia 的提案又顧到預算？","o":[{"e":"Let's set a clear call to action, like booking a demo, and track the conversion rate. Then we can measure the ROI on ads.","ok":true,"fb":"用數據衡量成效，財務最愛聽。","r":{"s":"LIN","e":"Measurable. Now you're speaking my language.","z":"可衡量。你在講我的語言了。","a":"audio/d3574ab395c.mp3"},"a":"audio/dbd7d47ea0d.mp3"},{"e":"Money doesn't matter. Marketing is about feelings.","ok":false,"fb":"忽略預算，財務會反對。","r":{"s":"LIN","e":"Feelings don't go on the balance sheet.","z":"感覺不會出現在資產負債表上。","a":"audio/d46f6b4ca14.mp3"},"a":"audio/d6353a78e38.mp3"},{"e":"Let's cancel the trade show.","ok":false,"fb":"太極端，錯失商機。","r":{"s":"OREN","e":"Sharon would cancel us.","z":"Sharon 會先把我們取消掉。","a":"audio/d91a39d8fdc.mp3"},"a":"audio/da64b1ad185.mp3"}]},{"s":"MIA","e":"Exactly. We'll A/B test two headlines and use retargeting for people who click.","z":"沒錯。我們會測兩個標題，對點擊的人再行銷。","a":"audio/d87caa652e3.mp3"},{"s":"OREN","e":"What's our tagline?","z":"我們的標語是什麼？","a":"audio/d929b07c2c4.mp3"},{"s":"MIA","e":"\"Built to connect.\"","z":"「為連結而生。」","a":"audio/d5e1660fe42.mp3"},{"s":"F","e":"I love it. Short and memorable.","z":"我喜歡，簡短好記。","a":"audio/dbd22ba73cc.mp3"},{"s":"OREN","e":"Great. Fancia, you'll give a ten-minute talk on the main stage. A case study about Halden.","z":"很好。Fancia，你要在主舞台講十分鐘，用 Halden 當案例。","a":"audio/d18187d8998.mp3"},{"s":"F","e":"On stage? In English?","z":"上台？用英文？","a":"audio/d069e5971be.mp3"},{"s":"OREN","e":"{Piece of cake|小事一樁}. You'll rehearse with me.","z":"小事一樁，你跟我排練。","a":"audio/d78fccd52d5.mp3"},{"s":"MIA","e":"Our target customer is the engineering manager. The creative team will make the video. Let's look at the market trend first.","z":"我們的目標客戶是工程經理，創意團隊會做影片。先看市場趨勢。","a":"audio/d49439fcfb4.mp3"}],"h":"📍 週一下午 2:00｜會議室 B｜在場：Oren、行銷的 Mia、Linnea｜規劃新加坡電子展｜目標：定出目標客群與預算，學會行銷語言","c":"晚上，Diana 傳訊息：「聽說你要在新加坡講 Halden 的案例。在講之前，我要看你的簡報。所有內容。」"},{"n":22,"t":"排練","it":[{"s":"F","e":"Good afternoon, everyone. Thank you for coming. Today I'll talk about how we cut lead time for a major client. Here's the outline.","z":"各位午安，謝謝蒞臨。今天要談我們如何為大客戶縮短交期。這是大綱。","a":"audio/da48c06d83f.mp3"},{"s":"OREN","e":"Good opening. But start with a story, not an outline. Storytelling keeps the audience awake.","z":"開場不錯，但先講故事，不要先講大綱。說故事能讓觀眾不睡著。","a":"audio/d3529b0ed65.mp3"},{"s":"F","e":"Okay. \"Three months ago, our biggest client almost walked away…\"","z":"好。「三個月前，我們最大的客戶差點離開……」","a":"audio/d6b181205f0.mp3"},{"s":"OREN","e":"Better! Now the chart.","z":"好多了！現在講圖表。","a":"audio/d489c60a372.mp3"},{"s":"F","e":"As you can see on this bar graph, our on-time delivery was steady, then dipped in March. After the changes, it recovered and peaked in June.","z":"從這張長條圖可以看到，我們的準時交貨率原本穩定，三月下滑，改善後回升，六月達到高峰。","a":"audio/d2e77f9501f.mp3"},{"s":"OREN","e":"Highlight the key figures. Use the pointer. Don't read the slide.","z":"強調關鍵數字，用簡報筆，別念投影片。","a":"audio/d1dd77c885f.mp3"},{"s":"F","e":"Moving on to the next slide. This pie chart shows the breakdown of delays by cause. Supplier issues account for sixty percent.","z":"下一張投影片。這張圓餅圖顯示延遲原因的分布，供應商問題佔六成。","a":"audio/d65526840e6.mp3"},{"s":"BEN","e":"(走進來) Compared to what? Last year? Give them a benchmark.","z":"（走進來）跟什麼比？去年嗎？給個比較基準。","a":"audio/d98f56c806c.mp3"},{"s":"F","e":"Compared to last year, delays were cut by half.","z":"跟去年比，延遲減少了一半。","a":"audio/d786f8b1ac1.mp3"},{"s":"BEN","e":"Better. Numbers make the point.","z":"好多了，數字才有說服力。","a":"audio/dd90563b790.mp3"},{"s":"OREN","e":"Now I'm the audience. Q&A session. \"Isn't this just luck?\"","z":"現在我當觀眾，問答時間。「這不就是運氣嗎？」","a":"audio/d449a2fc141.mp3"},{"q":"遇到帶刺的提問，你怎麼回最好？","o":[{"e":"That's a good question. Luck helps, but the data shows a pattern. Let me elaborate on two changes we made.","ok":true,"fb":"先肯定問題，再用數據回答。","r":{"s":"OREN","e":"Perfect. Calm and confident.","z":"完美，冷靜又自信。","a":"audio/d3c32d82fdc.mp3"},"a":"audio/df9dd2d0463.mp3"},{"e":"No, it's not luck! You're wrong!","ok":false,"fb":"太防衛，觀眾會不舒服。","r":{"s":"BEN","e":"Easy, tiger.","z":"冷靜點，老虎。","a":"audio/da38645e25d.mp3"},"a":"audio/d5548a73fd9.mp3"},{"e":"Um… I don't know. Next question.","ok":false,"fb":"沒有回答，可信度下降。","r":{"s":"OREN","e":"Never say \"I don't know\" like that on stage.","z":"在台上別這樣說不知道。","a":"audio/d58cf3c680e.mp3"},"a":"audio/dc814d46bf3.mp3"}]},{"s":"OREN","e":"Now, wrap up.","z":"現在收尾。","a":"audio/d359c2ee76a.mp3"},{"s":"F","e":"To sum up, three key takeaways: share data early, have a second source, and talk to your client before they talk to your competitor. Thank you for your attention.","z":"總結三個重點：及早分享數據、要有第二來源、在客戶跟你的對手談之前先跟他談。謝謝聆聽。","a":"audio/d982c06a4df.mp3"},{"s":"BEN","e":"Not bad. Don't digress on stage and you'll be fine.","z":"不錯。在台上別離題就好。","a":"audio/d158e851ba8.mp3"},{"s":"OREN","e":"You don't need a visual aid for every point. And when the numbers level off, say why.","z":"不是每個重點都需要視覺輔助。數字趨於平穩時，要說明原因。","a":"audio/d1a9329f1b1.mp3"}],"h":"📍 週三晚上 6:30｜空的大會議室｜在場：Oren、Ben（晚到）｜第一次排練主舞台簡報｜目標：開場、轉場、圖表說明與問答都要順","c":"你把簡報寄給 Diana。五分鐘後她回：「第七頁的數字是錯的。如果你在台上講這個，我們就終止合作。」"},{"n":23,"t":"機場一團亂","it":[{"s":"OREN","e":"Morning! Ready for your first business trip? Got your passport?","z":"早！準備好第一次出差了嗎？護照帶了嗎？","a":"audio/dc4f8103160.mp3"},{"s":"F","e":"Passport, boarding pass, itinerary. And a laptop with a wrong slide seven.","z":"護照、登機證、行程表。還有一台第七頁錯誤的筆電。","a":"audio/d15c5b959c6.mp3"},{"s":"OREN","e":"Fix it at the gate. Did you check in online?","z":"到登機門再修。線上報到了嗎？","a":"audio/da5a5d05ff0.mp3"},{"s":"F","e":"Yes. I booked an aisle seat. Oren, you have a window seat.","z":"報了。我訂了走道位，Oren 你是靠窗。","a":"audio/dc3b2bd1584.mp3"},{"s":"STAFF","e":"Good morning. I'm sorry, flight 213 to Singapore is a delayed flight. The new departure time is 11:30.","z":"早安，抱歉，飛往新加坡的 213 班機延誤，新的起飛時間是 11:30。","a":"audio/dc626b678a7.mp3"},{"s":"OREN","e":"That means we'll miss our connecting flight? No wait, it's direct. Phew.","z":"那我們會錯過轉機嗎？不對，是直飛。呼。","a":"audio/d2a01c98ca6.mp3"},{"q":"航班延誤，你想爭取一點補償，怎麼問最得體？","o":[{"e":"I see. Is there anything you can offer, like lounge access, since we'll be waiting four hours?","ok":true,"fb":"禮貌詢問具體補償，合情合理。","r":{"s":"STAFF","e":"Of course. Here are two passes for the departure lounge.","z":"當然，這是兩張貴賓室的通行證。","a":"audio/d223e0df653.mp3"},"a":"audio/d4025010a39.mp3"},{"e":"This is unacceptable! I want to speak to your manager!","ok":false,"fb":"太激動，對地勤沒幫助。","r":{"s":"STAFF","e":"Ma'am, the weather caused it.","z":"女士，是天氣造成的。","a":"audio/d0b9b51902c.mp3"},"a":"audio/da466ec9653.mp3"},{"e":"Okay. (默默坐在地上四小時)","ok":false,"fb":"沒爭取任何協助。","r":{"s":"OREN","e":"My back hurts already.","z":"我的背已經開始痛了。","a":"audio/d4fab8c5cf4.mp3"},"a":"audio/d12c00e78c9.mp3"}]},{"s":"OREN","e":"Lounge! Free breakfast. {This is the life|這才叫生活}.","z":"貴賓室！免費早餐。這才叫生活。","a":"audio/dc3d4af7ff2.mp3"},{"s":"F","e":"Let me fix slide seven. Diana said our on-time number was wrong.","z":"我來修第七頁。Diana 說我們的準時率數字錯了。","a":"audio/df1e48cbe79.mp3"},{"s":"OREN","e":"Was it?","z":"是錯的嗎？","a":"audio/d482644f22f.mp3"},{"s":"F","e":"We used our data, not theirs. Their number is lower because of the partial shipment.","z":"我們用的是自己的數據，不是他們的。因為分批出貨，他們的數字比較低。","a":"audio/d57d387be42.mp3"},{"s":"OREN","e":"Then use both and explain the difference. Transparency again.","z":"那就兩個都放並解釋差異，又是透明原則。","a":"audio/d671478fa78.mp3"},{"s":"F","e":"Also, is my per diem in SGD or USD? And should I buy travel insurance?","z":"對了，我的出差日支費是新幣還是美金？要買旅平險嗎？","a":"audio/d2c5a46aa0a.mp3"},{"s":"OREN","e":"USD, check the exchange rate. Company covers insurance. Keep every receipt or Ben will make you cry.","z":"美金，查一下匯率。保險公司付。每張收據都要留，不然 Ben 會讓你哭。","a":"audio/db8bb763535.mp3"}],"h":"📍 週日早上 7:00｜桃園機場・出境大廳｜在場：Oren｜出發去新加坡參展｜目標：辦好報到、處理班機延誤，順便修好第七頁","c":"登機前，你收到 Diana 的回覆：「改得好。另外——你在新加坡會遇到 Vexa 的業務總監 Leo。小心他。他曾經是 Oren 的部下。」"},{"n":24,"t":"新加坡的第一晚","it":[{"s":"F","e":"Hi, I have a reservation under Fancia Lin. Two nights.","z":"你好，我有訂房，名字是 Fancia Lin，兩晚。","a":"audio/d2dc52ba47a.mp3"},{"s":"CLERK","e":"Welcome. Here's your key. Would you like a wake-up call? Breakfast is from six, and the shuttle bus to the venue leaves at eight.","z":"歡迎。這是您的房卡，需要叫醒服務嗎？早餐六點開始，往會場的接駁車八點出發。","a":"audio/de8707431e6.mp3"},{"s":"F","e":"A wake-up call at six-thirty, please. And could I get directions to the convention center?","z":"六點半叫醒，謝謝。可以告訴我去會展中心怎麼走嗎？","a":"audio/d864bb4282d.mp3"},{"s":"CLERK","e":"It's ten minutes on foot. There's also a taxi stand outside.","z":"走路十分鐘，外面也有計程車招呼站。","a":"audio/dd90066b9d3.mp3"},{"s":"LEO","e":"Oren? Is that you? Long time no see!","z":"Oren？是你嗎？好久不見！","a":"audio/d8c19137b3a.mp3"},{"s":"OREN","e":"Leo. What a small world. How's work?","z":"Leo，世界真小。工作怎樣？","a":"audio/d7da68416d2.mp3"},{"s":"LEO","e":"Busy. Vexa is growing fast. And who's this?","z":"很忙，Vexa 成長很快。這位是？","a":"audio/d17dfd0c4c7.mp3"},{"s":"F","e":"Fancia. Nice to meet you.","z":"我是 Fancia，幸會。","a":"audio/dea79dd4eaa.mp3"},{"s":"LEO","e":"So, what brings you to Singapore? Let me guess, Halden?","z":"那是什麼風把你們吹來新加坡？我猜，Halden？","a":"audio/d37e4f94f96.mp3"},{"q":"Leo 在套話。你想友善但不透露客戶資訊，怎麼回？","o":[{"e":"The trade show, same as you, I guess. It's a great place to meet new people.","ok":true,"fb":"友善、模糊帶過，不透露客戶。","r":{"s":"LEO","e":"Ha. Fair enough. You trained her well, Oren.","z":"哈，好吧。Oren 你把她教得很好。","a":"audio/d849386ed41.mp3"},"a":"audio/d93fef1eacc.mp3"},{"e":"Yes! We're working on a big Halden project.","ok":false,"fb":"洩漏客戶資訊給對手，大忌。","r":{"s":"OREN","e":"(咳嗽) Let's get some rest, Fancia.","z":"（咳嗽）我們去休息吧，Fancia。","a":"audio/d04a021aa7b.mp3"},"a":"audio/d925884bb20.mp3"},{"e":"That's none of your business.","ok":false,"fb":"太衝，顯得防衛心重。","r":{"s":"LEO","e":"Whoa. Touchy.","z":"哇，這麼敏感。","a":"audio/d390677f0d5.mp3"},"a":"audio/dd0baebc5cf.mp3"}]},{"s":"LEO","e":"Well, if you ever want a change, Vexa is hiring. Here's my business card.","z":"如果哪天想換跑道，Vexa 在徵人。這是我的名片。","a":"audio/dc5a5a364f9.mp3"},{"s":"OREN","e":"Good night, Leo.","z":"晚安，Leo。","a":"audio/dab799a3cf4.mp3"},{"d":"Leo 離開後"},{"s":"F","e":"Oren, what happened between you two?","z":"Oren，你們之間發生過什麼事？","a":"audio/d452eaf67dd.mp3"},{"s":"OREN","e":"Long story. Jet lag isn't the only thing that keeps me up at night. Get some sleep. Big day tomorrow.","z":"說來話長。讓我睡不著的不只是時差。去睡吧，明天是大日子。","a":"audio/db487b1852d.mp3"},{"s":"LEO","e":"So, what brings you here? I mean, to this hotel, of all places.","z":"所以是什麼風把你吹來？我是說，偏偏是這間飯店。","a":"audio/d8c1a1a03b2.mp3"}],"h":"📍 週日晚上 8:00（當地時間）｜新加坡飯店大廳｜在場：Oren，偶遇 Vexa 的 Leo｜辦入住、找會場，碰上對手｜目標：得體地閒聊，不洩漏資訊","c":"你回到房間，叫了客房服務。打開信箱，Leo 已經寄來一封信，主旨：「Quick question about your career.」"},{"n":25,"t":"展位上的一天","it":[{"s":"VISITOR","e":"Hi there. What do you do, exactly?","z":"嗨，你們到底是做什麼的？","a":"audio/d5b1b5eebbf.mp3"},{"s":"F","e":"We make custom connectors for electronics makers. Built to connect. Can I show you a quick demo?","z":"我們幫電子廠做客製接頭，為連結而生。可以給您看個簡短展示嗎？","a":"audio/d6b009a472f.mp3"},{"s":"VISITOR","e":"Sure. I'm Hana, procurement at Kinto Devices in Vietnam.","z":"好啊。我是 Hana，越南 Kinto Devices 的採購。","a":"audio/dac6ebaaa92.mp3"},{"s":"F","e":"Nice to meet you, Hana. How's the show so far?","z":"幸會，Hana。展覽目前覺得怎樣？","a":"audio/d55f083cb9a.mp3"},{"s":"HANA","e":"Exhausting. Everyone pitches the same thing. Why should I care about you?","z":"好累。每個人推銷的都一樣，我為什麼要在乎你們？","a":"audio/d3cab819db6.mp3"},{"q":"Hana 很直接。你怎麼用一句話抓住她？","o":[{"e":"Fair question. What's the biggest headache with your current supplier? I'd rather hear your customer needs before I pitch.","ok":true,"fb":"先問痛點，以客戶需求為主，很高明。","r":{"s":"HANA","e":"Ha. Lead time. Always lead time.","z":"哈，交期，永遠是交期。","a":"audio/d5697ef0937.mp3"},"a":"audio/de3fa414ff0.mp3"},{"e":"Because we're the best in the world!","ok":false,"fb":"空泛的吹噓，沒說服力。","r":{"s":"HANA","e":"That's what the last ten booths said.","z":"前十個攤位都這樣說。","a":"audio/dcbf14ebf6a.mp3"},"a":"audio/d174b4ad81f.mp3"},{"e":"Here's our catalog. Read it.","ok":false,"fb":"太被動，錯失對話。","r":{"s":"HANA","e":"(把型錄放進一疊型錄裡)","z":"（把型錄放進一疊型錄裡）","a":null},"a":"audio/d5e59145c2a.mp3"}]},{"s":"F","e":"Then you'll like our case study. We cut lead time by thirty percent for a major client. I'm presenting it at two.","z":"那您會喜歡我們的案例，我們幫大客戶縮短三成交期。我兩點會上台分享。","a":"audio/d3ed13a33d8.mp3"},{"s":"HANA","e":"Okay, you've got my attention. Do you have an MOQ? We're a small company.","z":"好，你引起我的注意了。你們有最低訂購量嗎？我們是小公司。","a":"audio/d671b0fd076.mp3"},{"s":"F","e":"Five hundred units, but for a first order we can be flexible. I can send you a quotation and free samples.","z":"五百件，但首單可以有彈性。我可以寄報價和免費樣品給您。","a":"audio/db5356776d1.mp3"},{"s":"HANA","e":"Sounds good. Here's my card. Follow up next week.","z":"聽起來不錯，這是我的名片，下週再聯繫。","a":"audio/d5b333d38eb.mp3"},{"s":"MIA","e":"(視訊) Nice! That's our tenth prospect today. I'll add her to our mailing list.","z":"（視訊）讚！這是今天第十個潛在客戶，我把她加入郵寄名單。","a":"audio/d07b8a7f74c.mp3"},{"s":"OREN","e":"Our booth traffic is great. Word of mouth, I think. People heard about the demo.","z":"展位人潮很好，應該是口碑。大家聽說了我們的展示。","a":"audio/d24f9ba17dc.mp3"},{"s":"LEO","e":"(經過) Nice booth. Shame about the location. Near the restrooms.","z":"（經過）展位不錯，可惜位置在廁所旁邊。","a":"audio/d6fe65b3947.mp3"},{"s":"OREN","e":"At least people come back often.","z":"至少大家常常回來。","a":"audio/d1fca38f523.mp3"},{"s":"HANA","e":"Every day I get a cold call from someone selling parts. You're the first one I want to call back.","z":"我每天都接到推銷零件的陌生電話，你是第一個我想回電的。","a":"audio/dc626faf87b.mp3"}],"h":"📍 週一早上 10:00｜新加坡電子展・Northwind 展位｜在場：Oren、Mia（視訊支援）、多位訪客｜在展位接待訪客、開發潛在客戶｜目標：用閒聊打開話題，把訪客變成潛在客戶","c":"一點五十分，你準備上台。投影機突然壞了。主持人說：「Fancia，麥克風可以用，但沒有投影片。你還要講嗎？」"},{"n":26,"t":"沒有投影片的演講","it":[{"q":"投影機壞了，你要怎麼開場？","o":[{"e":"Good afternoon. The projector has taken a day off, so let me tell you a story instead.","ok":true,"fb":"幽默化解尷尬，再接到故事，很漂亮。","r":{"s":"HANA","e":"(笑)","z":"（笑）","a":null},"a":"audio/d25054b2d0f.mp3"},{"e":"Sorry, sorry, this is a disaster…","ok":false,"fb":"一直道歉，會讓觀眾緊張。","r":{"s":"OREN","e":"(小聲) Breathe.","z":"（小聲）呼吸。","a":"audio/d91b86a46d3.mp3"},"a":"audio/d05ad1eb93c.mp3"},{"e":"I'll wait until it's fixed.","ok":false,"fb":"讓觀眾乾等，會走掉一半。","r":{"s":"HOST","e":"We have five minutes, Fancia.","z":"只剩五分鐘了，Fancia。","a":"audio/d4f5461aad4.mp3"},"a":"audio/d839f712429.mp3"}]},{"s":"F","e":"Three months ago, our biggest client told us: \"If you can't deliver, we have a second source.\"","z":"三個月前，我們最大的客戶說：「你們交不出貨，我們有第二來源。」","a":"audio/d4543ec4320.mp3"},{"s":"F","e":"Imagine a chart. Our on-time delivery: a steady line, then a plunge in March, a sharp dip.","z":"想像一張圖。我們的準時交貨率：一條平穩的線，三月突然暴跌，掉得很深。","a":"audio/d2bbe7bdc8d.mp3"},{"s":"F","e":"Then we did three things. We shared data with our client every week. We found a second source. And we talked about problems early, before they became crises.","z":"然後我們做了三件事：每週和客戶分享數據、找到第二來源、在問題變成危機前就提出來。","a":"audio/dbabcbbb052.mp3"},{"s":"F","e":"By June, on-time delivery surged back to ninety-six percent. Our client's numbers are lower, ninety-one, because they count partial shipments. Both numbers are honest.","z":"到了六月，準時率回升到 96%。客戶算出來是 91%，因為他們把分批出貨算進去。兩個數字都是真的。","a":"audio/d9ce638ed8c.mp3"},{"s":"F","e":"The bottom line? Trust is a supply chain too. If it breaks, nothing moves.","z":"重點是什麼？信任也是一條供應鏈。斷了，什麼都動不了。","a":"audio/d8bf6aab856.mp3"},{"s":"F","e":"In conclusion, I'd love to take questions.","z":"最後，歡迎提問。","a":"audio/d73fa23fd5e.mp3"},{"s":"LEO","e":"(舉手) Isn't it risky to tell your audience your client almost left you?","z":"（舉手）告訴觀眾你的客戶差點離開，不是很冒險嗎？","a":"audio/dde0736ebce.mp3"},{"s":"F","e":"That's a good question. I think hiding problems is riskier. Our client is here because we didn't hide them.","z":"好問題。我認為隱藏問題更冒險。客戶還在，就是因為我們沒有隱瞞。","a":"audio/d44257801f9.mp3"},{"d":"掌聲"},{"s":"OREN","e":"That was the best keynote I've seen without slides.","z":"這是我看過最好的、沒有投影片的主題演講。","a":"audio/d6bf08cfd76.mp3"},{"s":"HANA","e":"Fancia, my CEO wants to meet you. Tonight, if possible.","z":"Fancia，我們執行長想見你，可以的話今晚。","a":"audio/d804da6c9d1.mp3"}],"h":"📍 週一下午 2:00｜展覽主舞台｜在場：約兩百位聽眾、Oren、Hana、Leo｜投影機壞了，你要徒手演講｜目標：用故事和數字撐完十分鐘","c":"晚上，Oren 帶你去見新創創辦人 Kai。Kai 開口第一句就說：「我知道你們台北分公司要被重組。我有個提案，可以救你們。」"},{"n":27,"t":"新創的提案","it":[{"s":"KAI","e":"Cheers! Thanks for coming. I'm the founder of Volta, a startup that makes smart power modules.","z":"乾杯！謝謝你們來。我是 Volta 的創辦人，我們是做智慧電源模組的新創。","a":"audio/d4c9200d535.mp3"},{"s":"OREN","e":"Congratulations on your funding round. Series A, right?","z":"恭喜你們完成融資，A 輪對吧？","a":"audio/d80b79ef4ee.mp3"},{"s":"KAI","e":"Right. Five million from a venture capital firm. We have traction, two big customers, but we need to scale up.","z":"對，創投投了五百萬。我們有市場動能，兩個大客戶，但需要擴大規模。","a":"audio/d7b75bdcf57.mp3"},{"s":"F","e":"What's your business model?","z":"你們的商業模式是什麼？","a":"audio/dce61853b21.mp3"},{"s":"KAI","e":"We design, others make. Our value proposition is power modules that use thirty percent less energy.","z":"我們設計，別人製造。我們的價值主張是省三成電的電源模組。","a":"audio/d1cb9c7cf5b.mp3"},{"s":"OREN","e":"And where do we come in?","z":"那我們的角色是？","a":"audio/de10c777fe5.mp3"},{"s":"KAI","e":"A joint venture. You have manufacturing partners and Asian customers. I have the innovation. Together, it's a win-win.","z":"合資。你們有製造夥伴和亞洲客戶，我有創新，加在一起就是雙贏。","a":"audio/d7efb985aa1.mp3"},{"q":"新創聽起來很美好。你要問一個最關鍵的問題，是哪個？","o":[{"e":"What's your burn rate, and how long can you last without new funding?","ok":true,"fb":"直擊新創最大風險：現金能撐多久。","r":{"s":"KAI","e":"…Eighteen months. Good question. Most people don't ask.","z":"……十八個月。好問題，大部分人不會問。","a":"audio/dcff404bb2f.mp3"},"a":"audio/d0dcfd57af4.mp3"},{"e":"Are you going to be a unicorn?","ok":false,"fb":"太天真，沒有實質意義。","r":{"s":"KAI","e":"Ha! I hope so.","z":"哈！希望如此。","a":"audio/de8b94ca3c3.mp3"},"a":"audio/d375c0b9b79.mp3"},{"e":"Can I invest my own money?","ok":false,"fb":"時機和角色都不對。","r":{"s":"OREN","e":"Let's keep it professional, Fancia.","z":"我們保持專業，Fancia。","a":"audio/d82775c9390.mp3"},"a":"audio/de54d58d04f.mp3"}]},{"s":"KAI","e":"We're bootstrapping less now, but our first product was an MVP built in my garage.","z":"現在比較不用自己燒錢了，但我們第一個產品是在我車庫做的最小可行產品。","a":"audio/d87e209df2a.mp3"},{"s":"OREN","e":"Interesting. This could be a breakthrough for our core business. But we need a feasibility study and a proper business plan.","z":"有意思。這可能是我們核心業務的突破，但需要可行性研究和完整的商業計畫。","a":"audio/d18cb0d2677.mp3"},{"s":"KAI","e":"Of course. And there's first-mover advantage. Vexa is talking to me too.","z":"當然。而且有先行者優勢——Vexa 也在跟我談。","a":"audio/d482fe6616b.mp3"},{"s":"F","e":"Vexa again.","z":"又是 Vexa。","a":"audio/dc4582e2309.mp3"},{"s":"OREN","e":"Let's keep in touch, Kai. I'll present this to Sharon.","z":"保持聯絡，Kai。我會把這個提給 Sharon。","a":"audio/d7f51ae6752.mp3"},{"s":"KAI","e":"Safe travels. And Oren… Leo told me to say hi.","z":"一路順風。還有 Oren……Leo 要我跟你問好。","a":"audio/d6fb0d8aa17.mp3"}],"h":"📍 週一晚上 9:00｜新加坡濱海灣的酒吧｜在場：Oren、新創創辦人 Kai｜Kai 提出合作提案｜目標：聽懂新創術語，問對關鍵問題","c":"回飯店的路上，Oren 沉默很久，終於說：「當年 Leo 離開，帶走了我們三個客戶。是我沒看出來。這次，我不會再輸給他。」"},{"n":28,"t":"報帳的審判","it":[{"s":"LIN","e":"Welcome back, superstar. Everyone saw your talk online. Now, your expense report.","z":"歡迎回來，超級巨星。大家都在網路上看了你的演講。現在，你的報帳單。","a":"audio/dce1c920969.mp3"},{"s":"F","e":"Here are my receipts. Taxi, hotel, meals within the per diem.","z":"這是我的收據：計程車、飯店、日支費範圍內的餐費。","a":"audio/d0d019c6527.mp3"},{"s":"LIN","e":"And this one? \"Bar, Marina Bay, ninety dollars.\"","z":"那這張呢？「濱海灣酒吧，九十美金。」","a":"audio/dfeb163526c.mp3"},{"s":"F","e":"That was a client meeting with a startup founder. Oren was there.","z":"那是和新創創辦人的客戶會議，Oren 也在。","a":"audio/da81d7c3c52.mp3"},{"s":"BEN","e":"(經過) Was there karaoke?","z":"（路過）有唱 KTV 嗎？","a":"audio/d53009d6aef.mp3"},{"s":"F","e":"No karaoke. I promise.","z":"沒有 KTV，我保證。","a":"audio/d2c1d59a6f9.mp3"},{"s":"LIN","e":"Fine. I'll reimburse it as a business expense, but Oren needs to approve it.","z":"好，我會當業務費用核銷，但要 Oren 批准。","a":"audio/df2d25fa441.mp3"},{"s":"LIN","e":"Also, the booth cost went over budget. Cost overrun of three thousand.","z":"還有，展位超出預算，超支三千。","a":"audio/dda907794f5.mp3"},{"q":"Linnea 說展覽超支。你要怎麼說明最好？","o":[{"e":"That's true, but we collected forty prospects. If two become clients, the ROI is about ten times the cost.","ok":true,"fb":"承認事實並用投報率說明價值。","r":{"s":"LIN","e":"I'll put that in my report. Send me the lead list.","z":"我會寫進報告，把潛在客戶名單寄給我。","a":"audio/d217721ce09.mp3"},"a":"audio/dd5555b1d92.mp3"},{"e":"Not my problem, ask Mia.","ok":false,"fb":"推給同事，不團結。","r":{"s":"LIN","e":"You were the one there.","z":"去的人是你。","a":"audio/d6621cc9ab0.mp3"},"a":"audio/d2f51c9a96f.mp3"},{"e":"I'll pay it myself.","ok":false,"fb":"不必要也不專業。","r":{"s":"BEN","e":"Nobody's paying anything themselves. Relax.","z":"沒人要自己付錢，放輕鬆。","a":"audio/d07008a1f80.mp3"},"a":"audio/df068741411.mp3"}]},{"s":"BEN","e":"Good answer. Now, bigger news. Sharon wants the quarterly financial report by Friday. HQ is watching our numbers.","z":"回答得好。現在有更大的消息：Sharon 要我們週五前交季度財報，總部在盯我們的數字。","a":"audio/d6e65df2b96.mp3"},{"s":"LIN","e":"Which means I won't sleep this week.","z":"意思是我這週不用睡了。","a":"audio/dc2b7812d86.mp3"},{"s":"F","e":"Can I help?","z":"我能幫忙嗎？","a":"audio/dd3f5f3342c.mp3"},{"s":"LIN","e":"Actually, yes. I need someone to confirm every invoice amount for the Halden account.","z":"其實可以。我需要人確認 Halden 帳戶的每一筆發票金額。","a":"audio/d64523a996b.mp3"},{"s":"BEN","e":"And Fancia, Hana from Kinto Devices called. She wants a quotation by EOD. Good catch at the show.","z":"還有 Fancia，Kinto 的 Hana 打來，她要你今天下班前給報價。展覽上抓到好客戶了。","a":"audio/dc68c32f513.mp3"},{"s":"LIN","e":"Also, did you buy any souvenirs with the company card? Those aren't reimbursable.","z":"還有，你有用公司卡買紀念品嗎？那不能報銷。","a":"audio/d4093aea06f.mp3"}],"h":"📍 週三早上 9:30｜台北辦公室・Linnea 的座位｜在場：Linnea、Ben｜出差回來報帳｜目標：交齊收據，說明每筆費用","c":"晚上十點，你在核對 Halden 的發票，發現有三張發票金額重複開立——總共多收了 Halden 四萬美元。"},{"n":29,"t":"多收的四萬美元","it":[{"s":"F","e":"Linnea, sorry to bother you so early. Do you have a minute? I found something in the Halden invoices.","z":"Linnea，抱歉這麼早打擾。有空嗎？我在 Halden 的發票裡發現了一些問題。","a":"audio/d231e9d1175.mp3"},{"s":"LIN","e":"Uh-oh. That's never a good sentence before coffee.","z":"糟了，喝咖啡前聽到這句話從來沒好事。","a":"audio/d7d427f1883.mp3"},{"s":"F","e":"Three invoices were issued twice. We overcharged them forty thousand dollars.","z":"有三張發票開了兩次，我們多收了他們四萬美元。","a":"audio/d3a8c6fbf24.mp3"},{"s":"LIN","e":"Let me see… Oh no. Our system bounced back an error last month and I re-sent them. They paid both.","z":"我看看……天啊。上個月系統跳錯誤，我重寄了一次，他們兩張都付了。","a":"audio/dbc7c0bdbc3.mp3"},{"s":"BEN","e":"(走過來) Why does everyone look like someone died?","z":"（走過來）怎麼大家一副有人過世的表情？","a":"audio/df65b54bbd3.mp3"},{"s":"LIN","e":"We need to refund Halden forty thousand. Right before the quarterly report.","z":"我們要退 Halden 四萬，就在季報前。","a":"audio/df9793c9bbe.mp3"},{"s":"BEN","e":"That hurts our revenue this quarter.","z":"這會打到這季的營收。","a":"audio/d562e1752f9.mp3"},{"q":"Ben 擔心數字。你認為應該怎麼做？","o":[{"e":"I think we should tell Diana today and refund it ASAP. If her auditors find it first, we lose their trust.","ok":true,"fb":"主動揭露、儘速退款，保護長期關係。","r":{"s":"BEN","e":"…You're right. Better a bad quarter than a lost client.","z":"……你說得對。寧可一季難看，也不要失去客戶。","a":"audio/d8f197c12d9.mp3"},"a":"audio/de2e768f08b.mp3"},{"e":"Let's wait until next quarter. Nobody will notice.","ok":false,"fb":"拖延隱瞞，風險極高。","r":{"s":"LIN","e":"Their auditors will notice.","z":"他們的稽核會發現的。","a":"audio/d3e7670b1c4.mp3"},"a":"audio/ddc6877a207.mp3"},{"e":"Let's keep the money as a deposit for future orders.","ok":false,"fb":"沒經客戶同意就扣著，不妥。","r":{"s":"BEN","e":"Without asking? That's not how we do business.","z":"不問就扣著？我們不是這樣做生意的。","a":"audio/d5c884b5acf.mp3"},"a":"audio/dd00afa99cd.mp3"}]},{"s":"LIN","e":"I'll draft the email on behalf of finance. Fancia, you call Diana first, as her account manager.","z":"我代表財務部擬信。Fancia，你是她的客戶經理，你先打給她。","a":"audio/d52d04e55a3.mp3"},{"s":"F","e":"Should I reply all to the old invoice thread?","z":"要在舊的發票信件串上全部回覆嗎？","a":"audio/d6adeb69ac6.mp3"},{"s":"LIN","e":"No, start a new email. Subject: \"Refund of duplicate invoices.\" Attach the corrected statement. Kindly ask them to acknowledge receipt.","z":"不，開新信。主旨：「重複發票退款」。附上更正後的對帳單，請他們確認收到。","a":"audio/d93e35f8ba1.mp3"},{"d":"你打給 Diana"},{"s":"DIANA","e":"Forty thousand? You're calling to give me money? Fancia, in twenty years, no supplier has ever done that.","z":"四萬？你打來是要給我錢？Fancia，二十年來沒有一家供應商這樣做過。","a":"audio/d6ce62ab8ea.mp3"}],"h":"📍 週四早上 8:30｜Linnea 的座位｜在場：Linnea，稍後 Ben｜你發現重複開立的發票｜目標：說清楚問題，決定如何通知客戶","c":"Diana 接著說：「好，那我也給你一個消息。Halden 明年要選一家獨家供應商。Northwind 和 Vexa 二選一。」"},{"n":30,"t":"季度財報","it":[{"s":"LIN","e":"Let me walk you through the income statement. Revenue growth was eight percent QoQ, but gross profit fell slightly because of air freight and the refund.","z":"我來說明損益表。營收季增 8%，但因為空運和退款，毛利略降。","a":"audio/d51c67572d2.mp3"},{"s":"SHARON","e":"What about operating expenses?","z":"營業費用呢？","a":"audio/d448a4455a4.mp3"},{"s":"LIN","e":"OPEX was flat. Overhead went down because we moved to a smaller office floor. Payroll is our biggest cost.","z":"營業費用持平。搬到較小的樓層，所以雜項開銷下降。薪資是我們最大的成本。","a":"audio/d90f615f851.mp3"},{"s":"SHARON","e":"And operating income?","z":"營業利益呢？","a":"audio/d72a2ea7f48.mp3"},{"s":"LIN","e":"Down three percent. Net income is still positive, but our net profit margin is only four percent.","z":"降了 3%。淨利還是正的，但淨利率只有 4%。","a":"audio/d6e8744ae51.mp3"},{"s":"SHARON","e":"Four percent. HQ's target is seven. Ben, what's your plan?","z":"4%。總部目標是 7%。Ben，你的計畫是什麼？","a":"audio/de04fa0b5e1.mp3"},{"s":"BEN","e":"Cost cutting won't fix it. We need to change our cost structure. Our COGS is too high because we buy in small batches.","z":"削減成本解決不了，我們要改變成本結構。因為小批採購，銷貨成本太高。","a":"audio/da13f296779.mp3"},{"s":"SHARON","e":"Explain.","z":"說清楚。","a":"audio/d7b085d9c80.mp3"},{"q":"Ben 看向你。你想補充 Halden 獨家供應商的機會，怎麼說最好？","o":[{"e":"If we win Halden as an exclusive partner, our volume doubles. That gives us leverage to negotiate better prices with suppliers.","ok":true,"fb":"把客戶機會連結到成本結構，邏輯清楚。","r":{"s":"SHARON","e":"Now that's a strategy. How likely is it?","z":"這才叫策略。機率多高？","a":"audio/d480c753967.mp3"},"a":"audio/d0fb2596833.mp3"},{"e":"We'll just work harder.","ok":false,"fb":"空泛，沒有具體方案。","r":{"s":"SHARON","e":"Everyone says that.","z":"每個人都這樣說。","a":"audio/d5e04a43471.mp3"},"a":"audio/d21943a407b.mp3"},{"e":"The numbers are bad because of Linnea's mistake.","ok":false,"fb":"怪同事，非常傷團隊。","r":{"s":"OREN","e":"That's not fair, Fancia.","z":"這不公平，Fancia。","a":"audio/da8a5abfef5.mp3"},"a":"audio/de4a48e3a29.mp3"}]},{"s":"F","e":"Fifty-fifty. Vexa is our competitor in the bid.","z":"一半一半，Vexa 是我們的競標對手。","a":"audio/d50c49e8716.mp3"},{"s":"SHARON","e":"Then here's the deal. Win Halden, and Taipei is safe. Lose it, and we restructure. You have one quarter.","z":"那條件是：拿下 Halden，台北就安全。輸了就重組。你們有一季的時間。","a":"audio/dd5ce102282.mp3"},{"s":"LIN","e":"Also, the auditors arrive next month for the annual audit.","z":"另外，下個月稽核要來做年度查帳。","a":"audio/d37538b520f.mp3"},{"s":"SHARON","e":"Make sure every financial statement is clean. No surprises.","z":"確保每份財務報表都乾淨，不要有意外。","a":"audio/d8b7d5b7cb7.mp3"},{"s":"OREN","e":"Understood.","z":"了解。","a":"audio/dd9e3a58e92.mp3"},{"s":"SHARON","e":"Who signs off on the liability side of our balance sheet? I want that clean too.","z":"資產負債表上的負債由誰簽核？那部分也要乾淨。","a":"audio/debee249caa.mp3"}],"h":"📍 週五下午 3:00｜會議室 A（視訊連線總部）｜在場：Sharon（視訊）、Ben、Linnea、Oren｜報告季度財務數字｜目標：看懂損益表重點，回答 Sharon 的提問","c":"會議結束，Linnea 癱在椅子上。Vicky 傳訊息到群組：「緊急！倉庫盤點少了 800 件，帳上的庫存資產對不上。」"},{"n":31,"t":"午餐聊投資","it":[{"s":"ELA","e":"How was your weekend so far?","z":"週末過得怎樣？","a":"audio/de050f01383.mp3"},{"s":"F","e":"Honestly? I slept twelve hours. This quarter is killing me.","z":"老實說？我睡了十二個小時，這一季快把我累死了。","a":"audio/dae3c7ce78f.mp3"},{"s":"LIN","e":"Same. So, small talk rule: no work today. Let's talk about money instead. My money.","z":"我也是。閒聊規則：今天不談工作，改聊錢，我的錢。","a":"audio/d5e533772ea.mp3"},{"s":"ELA","e":"Ha. Are you still into stocks?","z":"哈，你還在玩股票嗎？","a":"audio/d45e0471f30.mp3"},{"s":"LIN","e":"I'm a long-term investor now. Mostly index funds and ETFs. Dollar-cost averaging every month.","z":"我現在是長期投資者，主要買指數型基金和 ETF，每月定期定額。","a":"audio/d2abce0a668.mp3"},{"s":"F","e":"That sounds boring. In a good way.","z":"聽起來很無聊，好的那種。","a":"audio/d0850efc7aa.mp3"},{"s":"LIN","e":"Boring is good. Compound interest does the work. I learned that after the last market crash.","z":"無聊是好事，複利會幫你工作。我是在上次股災後學到的。","a":"audio/d86737b3be0.mp3"},{"s":"ELA","e":"I panicked in the last bear market. Sold everything. Then the bull run started.","z":"上次熊市我嚇到，全賣了。然後牛市就開始了。","a":"audio/dd029fd5e4e.mp3"},{"q":"Elaine 問你怎麼投資。你剛開始存錢，怎麼回比較自然？","o":[{"e":"I'm just getting started. First an emergency fund, then maybe some ETFs. What would you recommend?","ok":true,"fb":"自然分享，並請對方給建議，聊天會延續。","r":{"s":"LIN","e":"Good order. Know your risk tolerance first.","z":"順序很對。先了解自己的風險承受度。","a":"audio/dc79e137be4.mp3"},"a":"audio/d539337e994.mp3"},{"e":"I'll put everything into one stock. YOLO!","ok":false,"fb":"開玩笑可以，但聽起來很不理性。","r":{"s":"ELA","e":"(笑) Please don't.","z":"（笑）拜託不要。","a":"audio/d5159b40af1.mp3"},"a":"audio/df450274421.mp3"},{"e":"Investing is gambling.","ok":false,"fb":"太武斷，話題會冷掉。","r":{"s":"LIN","e":"Not if you diversify.","z":"如果分散投資就不是。","a":"audio/d0445e98a5b.mp3"},"a":"audio/dd18c3efd59.mp3"}]},{"s":"LIN","e":"The rule is asset allocation. Stocks, bonds, a little cash. Rebalance once a year.","z":"原則是資產配置：股票、債券、一點現金，每年再平衡一次。","a":"audio/de04b85f4db.mp3"},{"s":"ELA","e":"What about Halden? Their IPO was a big deal. Blue chip now.","z":"那 Halden 呢？他們上市很轟動，現在是藍籌股了。","a":"audio/d770371fbe3.mp3"},{"s":"LIN","e":"Their valuation is high. P/E ratio of forty. Too volatile for me. And with inflation and interest rates going up, I'd rather buy bonds.","z":"估值很高，本益比四十，對我來說波動太大。加上通膨和利率上升，我寧可買債券。","a":"audio/de3a977689b.mp3"},{"s":"F","e":"You should be a financial advisor.","z":"你應該去當理財顧問。","a":"audio/d606e9e7261.mp3"},{"s":"LIN","e":"{Don't tempt me|別誘惑我}. The pay is better.","z":"別誘惑我，薪水比較高。","a":"audio/d5a73405f7c.mp3"},{"s":"ELA","e":"Speaking of which… I have news. I'm pregnant.","z":"說到這個……我有消息。我懷孕了。","a":"audio/dfe2ee29346.mp3"},{"s":"F","e":"I see what you mean. Boring but safe.","z":"我懂你的意思，無聊但安全。","a":"audio/d176dc78e49.mp3"},{"s":"LIN","e":"My rule: take profit slowly, never all at once.","z":"我的原則：慢慢獲利了結，絕不一次全賣。","a":"audio/dabff713414.mp3"}],"h":"📍 週六中午 12:30｜信義區的咖啡廳｜在場：Linnea、Elaine｜週末跟同事聚餐，聊理財｜目標：學會日常閒聊和投資相關說法","c":"大家驚呼恭喜。Elaine 小聲補了一句：「但是……我的產假剛好就在 Halden 競標的那個月。出貨這塊，誰來接？」"},{"n":32,"t":"少了 800 件","it":[{"s":"VIC","e":"I counted three times. The system says 5,200 units. The shelves say 4,400.","z":"我數了三次。系統說 5,200 件，架上只有 4,400。","a":"audio/d46eb70bfe0.mp3"},{"s":"BEN","e":"Eight hundred units don't just walk away.","z":"八百件不會自己走掉。","a":"audio/dd167805c8f.mp3"},{"s":"LIN","e":"If we can't find them, I'll have to write off the inventory. That's a loss on our balance sheet right before the audit.","z":"找不到的話，我就得把存貨打消，查帳前資產負債表上會多一筆損失。","a":"audio/dc359997ee9.mp3"},{"s":"VIC","e":"Are you saying I lost them?","z":"你是在說我弄丟的嗎？","a":"audio/d9d10a81d2e.mp3"},{"s":"BEN","e":"Nobody said that.","z":"沒人這樣說。","a":"audio/de0e3bfe648.mp3"},{"s":"VIC","e":"Your face did.","z":"你的臉說了。","a":"audio/de443686f53.mp3"},{"q":"氣氛變僵了。你要怎麼化解衝突並推進？","o":[{"e":"Let's not guess. Vicky knows this warehouse best. Can we check the outbound records together, step by step?","ok":true,"fb":"肯定同事、提出具體方法，化解衝突。","r":{"s":"VIC","e":"…Okay. Thanks, Fancia.","z":"……好，謝謝你，Fancia。","a":"audio/d771bf9303e.mp3"},"a":"audio/d5d2f66d9d1.mp3"},{"e":"Vicky, just admit it.","ok":false,"fb":"指責同事，衝突升級。","r":{"s":"VIC","e":"Wow. I thought you were on my side.","z":"哇，我以為你站我這邊。","a":"audio/deeea89de30.mp3"},"a":"audio/d3f281c8139.mp3"},{"e":"I'm going back to my desk. Good luck.","ok":false,"fb":"逃避問題，不是團隊合作。","r":{"s":"BEN","e":"Stay. We need you.","z":"留下，我們需要你。","a":"audio/d51401f8205.mp3"},"a":"audio/d5cee6cc372.mp3"}]},{"d":"一小時後"},{"s":"VIC","e":"Found it. The delivery note for the Halden replacement says 200 units. But the system recorded the shipping label as 1,000.","z":"找到了。Halden 換貨的出貨單寫 200 件，但系統把出貨標籤記成 1,000 件。","a":"audio/d218bccbdfa.mp3"},{"s":"LIN","e":"So eight hundred units were never shipped. They're… where?","z":"所以八百件根本沒出貨，那它們……在哪？","a":"audio/dc32e448b7f.mp3"},{"s":"VIC","e":"Pallet 14. Behind the loading dock. Someone parked them there after the inbound check.","z":"14 號棧板，在裝卸碼頭後面。進貨檢查完有人把它們放在那裡。","a":"audio/d77dddeb104.mp3"},{"s":"BEN","e":"Good work, Vicky. I owe you an apology.","z":"做得好，Vicky。我欠你一個道歉。","a":"audio/dbfb0c3b07b.mp3"},{"s":"VIC","e":"Apology accepted. Coffee also accepted.","z":"接受道歉，也接受咖啡。","a":"audio/d52ef8882ce.mp3"},{"s":"BEN","e":"Lesson learned: we need a proper checklist for every dispatch. Fancia, add it to our action plan.","z":"學到教訓：每次出貨都要有完整檢查表。Fancia，把這個加進行動計畫。","a":"audio/d9047fa776b.mp3"}],"h":"📍 週一早上 8:00｜倉庫｜在場：Vicky、Linnea、Ben｜盤點差異 800 件｜目標：冷靜追查原因，避免互相指責","c":"你回到座位，HR 的 Grace 已經在等你：「Elaine 下個月開始產假。Ben 說你要負責面試她的代理人。今天下午三點，第一位應徵者。」"},{"n":33,"t":"第一次當面試官","it":[{"s":"GRACE","e":"Thanks for coming in, Sam. This is Fancia from sales. We've read your résumé and cover letter.","z":"Sam 謝謝你來。這是業務部的 Fancia。我們看過你的履歷和求職信了。","a":"audio/d716863de00.mp3"},{"s":"SAM","e":"Thank you for having me. I saw the job posting last week. Shipping coordinator, full-time, right?","z":"謝謝邀請。我上週看到職缺公告，出貨協調員，全職對吧？","a":"audio/d81bdf33c1e.mp3"},{"s":"GRACE","e":"Right. It's a six-month contract at first, covering maternity leave, with a probation period of one month.","z":"對。一開始是六個月的約，代理產假，試用期一個月。","a":"audio/d847504aa5f.mp3"},{"s":"F","e":"Can you tell us about your experience with customs clearance and freight forwarders?","z":"可以談談你處理清關和貨代的經驗嗎？","a":"audio/dcf542d3337.mp3"},{"s":"SAM","e":"Sure. At my last job I handled sea freight and air freight for an OEM, about fifty containers a month.","z":"好的。我上一份工作幫一家代工廠處理海空運，一個月大約五十個貨櫃。","a":"audio/daaa743bee8.mp3"},{"q":"你想了解 Sam 處理壓力的能力，哪個問題最好？","o":[{"e":"Tell me about a time a shipment went wrong. What did you do?","ok":true,"fb":"用行為面試題問實際經驗，最能看出能力。","r":{"s":"SAM","e":"A container was stuck at port for a week. I called the broker every day and found a workaround with a different port.","z":"有個貨櫃卡港一週，我每天打給報關行，最後找到改走另一個港的替代方案。","a":"audio/d0c42b6174e.mp3"},"a":"audio/d85f312938e.mp3"},{"e":"Are you good under pressure?","ok":false,"fb":"封閉式問題，對方只會說「是」。","r":{"s":"SAM","e":"Yes, very good.","z":"是，很好。","a":"audio/d591756cc3d.mp3"},"a":"audio/dd239299f9b.mp3"},{"e":"Do you have a boyfriend?","ok":false,"fb":"涉及私人問題，面試中不恰當。","r":{"s":"GRACE","e":"(咳) We can't ask that.","z":"（咳）這不能問。","a":"audio/dd0c34f7819.mp3"},"a":"audio/d056743b484.mp3"}]},{"s":"GRACE","e":"What are your strengths and weaknesses?","z":"你的優點和缺點是什麼？","a":"audio/df790b6469b.mp3"},{"s":"SAM","e":"My strength is I'm very deadline-driven. My weakness is that I sometimes take on too much. I'm working on delegating.","z":"我的優點是很重視截止期限。缺點是有時攬太多事，我正在學著分派工作。","a":"audio/d5a540b7091.mp3"},{"s":"F","e":"Why are you leaving your current job?","z":"你為什麼要離開現在的工作？","a":"audio/d772863d011.mp3"},{"s":"SAM","e":"My company had a layoff and my team was cut. I'm looking for a career path with more growth.","z":"公司裁員，我的團隊被砍了。我在找更有成長空間的職涯路徑。","a":"audio/d80d71c03fb.mp3"},{"s":"GRACE","e":"What are your salary expectations?","z":"你的期望薪資是多少？","a":"audio/d4e55648dc8.mp3"},{"s":"SAM","e":"Around fifty thousand a month, but I'm flexible depending on the benefits package.","z":"大約月薪五萬，但看福利可以調整。","a":"audio/dd9b05c84b5.mp3"},{"s":"GRACE","e":"Thank you, Sam. We'll be in touch by Friday.","z":"謝謝你，Sam，我們週五前會聯絡你。","a":"audio/db34d3005cb.mp3"},{"d":"Sam 離開後"},{"s":"GRACE","e":"So? Shortlist or no?","z":"怎麼樣？列入候選名單嗎？","a":"audio/de9d26894bd.mp3"},{"s":"F","e":"Shortlist. Strong experience. But let's do a reference check.","z":"列入。經驗很強，但要做背景查核。","a":"audio/d49bab72426.mp3"},{"s":"GRACE","e":"Why is the turnover rate so high at your last company?","z":"你上一家公司的離職率為什麼這麼高？","a":"audio/d053c4a127d.mp3"},{"s":"SAM","e":"My supervisor left, then half the team followed.","z":"我的主管離開了，然後一半的團隊也跟著走了。","a":"audio/d4b3b7b4865.mp3"}],"h":"📍 週一下午 3:00｜小會議室｜在場：HR 的 Grace、應徵者 Sam｜面試 Elaine 的職務代理人｜目標：問出關鍵能力，做出判斷","c":"Grace 打了 Sam 前公司的電話。掛斷後她皺眉：「他前公司的主管……是 Vexa 的 Leo。」"},{"n":34,"t":"錄用還是不錄用","it":[{"s":"GRACE","e":"Sam's reference check was fine. Leo actually spoke highly of him.","z":"Sam 的背景查核沒問題，Leo 其實很稱讚他。","a":"audio/d2bc6d5db46.mp3"},{"s":"BEN","e":"That's what worries me. Vexa and Halden are both in this bid.","z":"這才讓我擔心。Vexa 跟我們都在競標 Halden。","a":"audio/d7b04ab83cc.mp3"},{"s":"OREN","e":"Sam worked for Vexa's partner, not Vexa. And Leo left that company a year ago.","z":"Sam 是在 Vexa 的合作夥伴那裡工作，不是 Vexa。而且 Leo 一年前就離開那家公司了。","a":"audio/dc6a3e23ad6.mp3"},{"s":"BEN","e":"Still, he'll see our shipping data.","z":"但他會看到我們的出貨資料。","a":"audio/d039f9c12e7.mp3"},{"q":"你負責面試，要給建議。怎麼說最好？","o":[{"e":"In my opinion, he's the strongest candidate. We can ask him to sign an NDA, like everyone else, and limit his access during the bid.","ok":true,"fb":"提出建議，同時給出風險控管方法。","r":{"s":"OREN","e":"Balanced. I like that.","z":"很平衡，我喜歡。","a":"audio/d8ba6e305c2.mp3"},"a":"audio/daf7ba8e61a.mp3"},{"e":"Don't hire him. Everyone from Vexa is a spy.","ok":false,"fb":"以偏概全，不公平。","r":{"s":"GRACE","e":"That could be discrimination.","z":"這可能構成歧視。","a":"audio/d43e44bd975.mp3"},"a":"audio/dd6c763d5d9.mp3"},{"e":"Hire him, no rules needed.","ok":false,"fb":"忽視風險，Ben 不會接受。","r":{"s":"BEN","e":"Absolutely not.","z":"絕對不行。","a":"audio/d24a8080fde.mp3"},"a":"audio/db55e514467.mp3"}]},{"s":"BEN","e":"Fine. But a clear employment contract, NDA, and access only to what he needs.","z":"好。但要有清楚的勞動契約、保密協議，且只能看必要的資料。","a":"audio/d3442f021cf.mp3"},{"s":"GRACE","e":"I'll send him the job offer today. Starting date next Monday, so Elaine has two weeks for the handover.","z":"我今天寄錄取通知，下週一到職，讓 Elaine 有兩週交接。","a":"audio/dd9dd48c472.mp3"},{"s":"OREN","e":"And his onboarding?","z":"那他的到職訓練呢？","a":"audio/d9a2c80a9f7.mp3"},{"s":"GRACE","e":"Training on our systems, the employee handbook, and a mentor. Fancia, could you be his mentor?","z":"系統訓練、員工手冊，還要一位導師。Fancia，你可以當他的導師嗎？","a":"audio/d00c88899cf.mp3"},{"s":"F","e":"Me? I've only been here two months.","z":"我？我才來兩個月。","a":"audio/dfe69941cb0.mp3"},{"s":"OREN","e":"Teaching is the best way to learn.","z":"教別人是最好的學習方式。","a":"audio/da4a1e76e09.mp3"},{"s":"BEN","e":"Speaking of which, your performance review is at the end of the month. Your probation ends then too.","z":"說到這，你的績效考核在月底，你的試用期也那時結束。","a":"audio/dee8e071259.mp3"},{"s":"F","e":"No pressure, then.","z":"那就沒壓力了呢。","a":"audio/dc660f20e54.mp3"},{"s":"BEN","e":"{None at all|一點也沒有}.","z":"一點也沒有。","a":"audio/ddbdd8006c2.mp3"}],"h":"📍 週二早上 9:15｜Ben 的辦公室｜在場：Ben、Oren、HR 的 Grace｜討論是否錄用 Sam｜目標：理性分析風險，提出你的建議","c":"下午，Vicky 沒來開站立會議。Elaine 說她請了病假——但你在茶水間聽到她在電話裡哭：「我真的撐不下去了。」"},{"n":35,"t":"Vicky 撐不住了","it":[{"s":"F","e":"Hey. I brought you bubble tea. Less sugar, the way you like it.","z":"嘿，我帶了珍奶給你，微糖，你喜歡的。","a":"audio/d255ade8901.mp3"},{"s":"VIC","e":"Thanks. Sorry about the sick day. I'm not really sick. I'm just… tired.","z":"謝謝。抱歉請了病假，我其實沒生病，只是……很累。","a":"audio/d189573031a.mp3"},{"s":"F","e":"You don't have to apologize. How long have you felt like this?","z":"你不用道歉。你這樣多久了？","a":"audio/d70f468ced0.mp3"},{"s":"VIC","e":"Months. Overtime every day, weekends too. My work-life balance is zero. I think it's burnout.","z":"好幾個月了。每天加班，週末也是，我完全沒有工作生活平衡。我覺得是過勞。","a":"audio/d2e337ea26d.mp3"},{"q":"Vicky 很低落。你要怎麼回應最好？","o":[{"e":"That sounds really hard. Thank you for telling me. What would help the most right now?","ok":true,"fb":"先同理，再問對方需要什麼。","r":{"s":"VIC","e":"Honestly? One person who can help with inventory. And a real day off.","z":"老實說？一個能幫忙庫存的人，還有一天真正的休假。","a":"audio/d3e7b4e4317.mp3"},"a":"audio/da512752fcd.mp3"},{"e":"Everyone's tired. Just push through.","ok":false,"fb":"否定對方感受，傷人。","r":{"s":"VIC","e":"…Right. Forget I said anything.","z":"……好，當我沒說。","a":"audio/dacb4408670.mp3"},"a":"audio/d73b87c0731.mp3"},{"e":"You should resign.","ok":false,"fb":"太快下結論，不是對方要的。","r":{"s":"VIC","e":"I don't want to quit. I love this job.","z":"我不想辭職，我喜歡這份工作。","a":"audio/dd23fc67cc9.mp3"},"a":"audio/d8e2e26a69d.mp3"}]},{"s":"F","e":"Have you talked to Ben about it?","z":"你跟 Ben 談過嗎？","a":"audio/d513bc46a45.mp3"},{"s":"VIC","e":"Ben only talks about numbers. And our headcount is frozen.","z":"Ben 只談數字，而且我們的人力編制被凍結了。","a":"audio/d351a0f5471.mp3"},{"s":"F","e":"Then let me raise it in the one-on-one. Numbers can help, actually. Staff turnover costs more than one part-time assistant.","z":"那我在一對一面談時提。其實數字能幫上忙：員工流失的成本比一個兼職助理還高。","a":"audio/d9191e72212.mp3"},{"s":"VIC","e":"You'd do that?","z":"你願意這樣做？","a":"audio/dfa5675434b.mp3"},{"s":"F","e":"Of course. You saved me in my first week. Also, take your annual leave. You have twelve days left.","z":"當然，你在我第一週救了我。還有，去休年假，你還剩十二天。","a":"audio/d8537a04a06.mp3"},{"s":"VIC","e":"Twelve? I didn't even know.","z":"十二天？我都不知道。","a":"audio/d1c8a78e47e.mp3"},{"s":"F","e":"Check your HR portal. Remote work is also possible two days a week for admin tasks.","z":"去看 HR 系統。行政工作每週也可以遠端兩天。","a":"audio/d3d9a5392ce.mp3"},{"s":"VIC","e":"{You're a lifesaver|你是我的救星}. Okay. I'll talk to Ben with you.","z":"你是我的救星。好，我跟你一起去找 Ben。","a":"audio/d818e9cbb5e.mp3"},{"s":"F","e":"And you can work from home on Fridays if Ben agrees.","z":"如果 Ben 同意，你週五可以在家工作。","a":"audio/d354e754249.mp3"}],"h":"📍 週三晚上 7:00｜公司附近的公園｜在場：Vicky｜關心過勞的同事｜目標：用同理心傾聽，找出具體的協助方式","c":"隔天早上，Ben 聽完後只說了一句：「我知道了。」然後關上辦公室的門。中午，全公司收到一封信：「下週一全員會議——組織調整說明。」"},{"n":36,"t":"組織調整","it":[{"s":"BEN","e":"Thanks, everyone. I'll keep this short. We're going to restructure the Taipei team. Nobody is being laid off.","z":"謝謝大家，我長話短說。台北團隊要重組，沒有人會被裁員。","a":"audio/d4dbc36cb62.mp3"},{"s":"BEN","e":"First, we're hiring a part-time warehouse assistant. Vicky, you'll be the team lead for warehouse and logistics.","z":"第一，我們會請一位兼職倉庫助理。Vicky，你升為倉儲物流組長。","a":"audio/db2512518b9.mp3"},{"s":"VIC","e":"(驚訝) Me?","z":"（驚訝）我？","a":"audio/d3e3aee1ee5.mp3"},{"s":"BEN","e":"You've been doing the job for a year. It's time we gave you the job title.","z":"這工作你做一年了，該給你這個職稱了。","a":"audio/dd4cf2b36a9.mp3"},{"s":"OREN","e":"Second, we're introducing flexible hours. You can clock in between eight and ten.","z":"第二，我們要實施彈性工時，八點到十點之間打卡都可以。","a":"audio/d99d1056a92.mp3"},{"s":"SHARON","e":"And from HQ, we're adding a recognition program and a team building budget. Morale matters.","z":"總部這邊會新增表揚計畫和團隊建設預算，士氣很重要。","a":"audio/d1eadbc2a57.mp3"},{"q":"你想問一個大家關心但沒人敢問的問題。怎麼問最得體？","o":[{"e":"Thank you, this is great news. Could you clarify how this affects the restructure plan HQ mentioned before?","ok":true,"fb":"先感謝，再禮貌地問出關鍵疑慮。","r":{"s":"SHARON","e":"Good question. That depends on the Halden bid. I'll be transparent: it's still on the table.","z":"好問題。那取決於 Halden 競標。坦白說，那個計畫還在桌上。","a":"audio/d515b07c27a.mp3"},"a":"audio/dcc1562f7dc.mp3"},{"e":"So are we getting fired or not?","ok":false,"fb":"太直接，會引起恐慌。","r":{"s":"BEN","e":"I just said nobody is being laid off.","z":"我剛說了沒人被裁。","a":"audio/dde3111a335.mp3"},"a":"audio/d25d4446aa7.mp3"},{"e":"(什麼都不問)","ok":false,"fb":"錯過釐清的機會。","r":{"s":"ELA","e":"(小聲) Someone should ask…","z":"（小聲）總要有人問……","a":"audio/d7d1ea7e72f.mp3"},"a":null}]},{"s":"BEN","e":"One more thing. Change management is hard. I haven't always set an example. I micromanage. I'm working on it.","z":"還有一件事。變革管理很難，我不一定都有以身作則。我會管太細，我正在改。","a":"audio/dd98f57689b.mp3"},{"s":"OREN","e":"(小聲) I've waited five years to hear that.","z":"（小聲）我等這句話等了五年。","a":"audio/ddaebd68525.mp3"},{"s":"BEN","e":"Any questions? No? Then let's get back to work. And Fancia, my office. Your performance review is today.","z":"有問題嗎？沒有？那回去工作吧。Fancia，到我辦公室，今天做你的績效考核。","a":"audio/d2d8e949c8c.mp3"}],"h":"📍 週一早上 10:00｜大會議室｜在場：Ben、Oren、全體同事、Sharon（視訊）｜宣布組織調整｜目標：聽懂公告重點，適時提問","c":"你走進 Ben 的辦公室，桌上放著兩份文件。一份是你的考核表。另一份，是 Vexa 寄給 Ben 的信，標題：「Job offer — Sales Director」。"},{"n":37,"t":"績效考核","it":[{"s":"BEN","e":"Let's start. This is your appraisal for the probation period. Overall: exceeds expectations.","z":"開始吧。這是你試用期的考核，整體：超出預期。","a":"audio/d899705624c.mp3"},{"s":"F","e":"Thank you. That means a lot.","z":"謝謝，這對我意義重大。","a":"audio/d07f7c71e1f.mp3"},{"s":"BEN","e":"Your strengths: client trust, teamwork, and you're a real team player. Your colleagues gave great feedback.","z":"你的優點：客戶信任、團隊合作，你真的很有團隊精神。同事們給的回饋都很好。","a":"audio/dba9a967341.mp3"},{"s":"BEN","e":"Area to improve: you say yes too fast. Check the numbers first.","z":"需要改進的：你太快答應，先看數字。","a":"audio/d9cc1569458.mp3"},{"s":"F","e":"Fair. What's the next performance goal?","z":"有道理。下一個績效目標是什麼？","a":"audio/d0f50f8a9b7.mp3"},{"s":"BEN","e":"Win Halden. If you do, I'll recommend you for promotion to senior account manager, with a raise and a year-end bonus.","z":"拿下 Halden。拿下的話，我會推薦你升資深客戶經理，加薪還有年終獎金。","a":"audio/d2fecb85ccc.mp3"},{"q":"你想談職涯發展，同時了解薪酬，怎麼說得體？","o":[{"e":"I appreciate that. Could we also talk about my career development, like training on contracts? And what the compensation package would look like?","ok":true,"fb":"先感謝，再同時提發展與薪酬，很成熟。","r":{"s":"BEN","e":"Good. Grace will share the details. Employee stock ownership is part of it.","z":"很好，Grace 會給你細節，員工認股也包含在內。","a":"audio/dbccf67a4e6.mp3"},"a":"audio/d3b62f12a3b.mp3"},{"e":"How much money exactly? Now?","ok":false,"fb":"太急著談錢，時機不好。","r":{"s":"BEN","e":"Let's win the deal first.","z":"先拿下案子再說。","a":"audio/db7761e8cb4.mp3"},"a":"audio/d6f93e0f271.mp3"},{"e":"I don't care about promotion.","ok":false,"fb":"不真誠，也錯失機會。","r":{"s":"BEN","e":"Everyone cares. Don't be modest.","z":"每個人都在乎，別謙虛。","a":"audio/dda089b9875.mp3"},"a":"audio/d2d4fe943fe.mp3"}]},{"s":"F","e":"Ben, can I ask about the letter on your desk?","z":"Ben，我可以問你桌上那封信的事嗎？","a":"audio/d5078ccf2b3.mp3"},{"s":"BEN","e":"…You saw it. Yes. Leo offered me the Sales Director job at Vexa. Better salary, better benefits.","z":"……你看到了。對，Leo 給我 Vexa 業務總監的職位，薪水和福利都更好。","a":"audio/dc9ed3ece06.m
